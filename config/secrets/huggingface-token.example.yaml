apiVersion: v1
kind: Secret
metadata:
  name: huggingface-token
  labels:
    app: llm-d-bench
type: Opaque
stringData:
  HF_CLI_TOKEN: "hf_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
---
# HuggingFace Token Secret
#
# This secret is required for downloading models and tokenizers from HuggingFace.
#
# To create this secret:
#   1. Get your HuggingFace token from https://huggingface.co/settings/tokens
#   2. Replace the placeholder value above with your actual token
#   3. Create the secret:
#      oc create -f config/secrets/huggingface-token.yaml
#
# Or create directly from command line:
#   oc create secret generic huggingface-token \
#     --from-literal=HF_CLI_TOKEN=hf_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
#
# IMPORTANT: Never commit actual tokens to version control!
