apiVersion: v1
kind: Secret
metadata:
  name: tekton-results-tls
  namespace: tekton-pipelines
  labels:
    app: llm-d-bench
type: kubernetes.io/tls
stringData:
  tls.crt: |
    -----BEGIN CERTIFICATE-----
    <paste your certificate here>
    -----END CERTIFICATE-----
  tls.key: |
    -----BEGIN PRIVATE KEY-----
    <paste your private key here>
    -----END PRIVATE KEY-----
---
# Tekton Results TLS Secret
#
# This secret provides the TLS certificate and private key for the Tekton
# Results API server. It must be created before installing Tekton Results.
#
# Fields:
#   tls.crt: PEM-encoded TLS certificate
#   tls.key: PEM-encoded TLS private key
#
# To generate a self-signed certificate and create the secret:
#
#   openssl req -x509 \
#     -newkey rsa:4096 \
#     -keyout key.pem \
#     -out cert.pem \
#     -days 365 \
#     -nodes \
#     -subj "/CN=tekton-results-api-service.tekton-pipelines.svc.cluster.local" \
#     -addext "subjectAltName = DNS:tekton-results-api-service.tekton-pipelines.svc.cluster.local"
#
#   kubectl create secret tls tekton-results-tls \
#     --namespace=tekton-pipelines \
#     --cert=cert.pem \
#     --key=key.pem
#
#   rm -f cert.pem key.pem
#
# For production, use a certificate from a trusted CA instead of self-signed.
#
# See docs/TEKTON-RESULTS.md for full installation instructions.
#
# IMPORTANT: Never commit actual certificates or keys to version control!
