apiVersion: v1
kind: Secret
metadata:
  name: tekton-results-postgres
  namespace: tekton-pipelines
  labels:
    app: llm-d-bench
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "your-secure-password"
---
# Tekton Results PostgreSQL Secret
#
# This secret is required before installing Tekton Results. It provides the
# database credentials for the bundled PostgreSQL instance.
#
# Fields:
#   POSTGRES_USER:     Database username (default: "postgres")
#   POSTGRES_PASSWORD: Database password (use a strong random value)
#
# To create this secret:
#   1. Replace the placeholder password above with a strong random password
#   2. Create the secret:
#      oc apply -f config/cluster/secrets/tekton-results-postgres.yaml
#
# Or create directly from command line with a random password:
#   oc create secret generic tekton-results-postgres \
#     --namespace=tekton-pipelines \
#     --from-literal=POSTGRES_USER=postgres \
#     --from-literal=POSTGRES_PASSWORD=$(openssl rand -base64 20)
#
# See docs/TEKTON-RESULTS.md for full installation instructions.
#
# IMPORTANT: Never commit actual credentials to version control!
