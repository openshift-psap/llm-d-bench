apiVersion: v1
kind: Secret
metadata:
  name: tekton-results-s3-creds
  namespace: tekton-pipelines
  labels:
    app: llm-d-bench
type: Opaque
stringData:
  S3_ACCESS_KEY_ID: "your-access-key-id"
  S3_SECRET_ACCESS_KEY: "your-secret-access-key"
  S3_BUCKET_NAME: "tekton-results-logs"
  S3_REGION: "us-east-1"
  S3_ENDPOINT: ""
---
# Tekton Results S3 Credentials Secret
#
# This secret stores S3 credentials used by Tekton Results for log storage.
# Required when configuring Tekton Results with LOGS_TYPE=S3.
#
# Fields:
#   S3_ACCESS_KEY_ID:     AWS/S3-compatible access key
#   S3_SECRET_ACCESS_KEY: AWS/S3-compatible secret key
#   S3_BUCKET_NAME:       S3 bucket for storing logs
#   S3_REGION:            AWS region (or "us-east-1" for MinIO)
#   S3_ENDPOINT:          Custom S3 endpoint (for MinIO/Ceph; leave empty for AWS)
#
# To create this secret:
#   1. Replace the placeholder values above with actual S3 credentials
#   2. Create the secret:
#      oc apply -f config/cluster/secrets/tekton-results-s3-creds.yaml
#
# Or create directly from command line:
#   oc create secret generic tekton-results-s3-creds \
#     --namespace=tekton-pipelines \
#     --from-literal=S3_ACCESS_KEY_ID=your-access-key-id \
#     --from-literal=S3_SECRET_ACCESS_KEY=your-secret-access-key \
#     --from-literal=S3_BUCKET_NAME=tekton-results-logs \
#     --from-literal=S3_REGION=us-east-1 \
#     --from-literal=S3_ENDPOINT=
#
# Note: These values must also be set in the tekton-results-api-config ConfigMap
# for Tekton Results to use S3 storage. See docs/TEKTON-RESULTS.md for full
# setup instructions including AWS CLI commands for bucket and IAM user creation.
#
# For MinIO or other S3-compatible storage, set S3_ENDPOINT to the service URL
# (e.g., https://minio.example.com) and ensure S3_HOSTNAME_IMMUTABLE is set to
# "true" in the tekton-results-api-config ConfigMap.
#
# IMPORTANT: Never commit actual credentials to version control!
