apiVersion: v1
kind: ServiceAccount
metadata:
  name: deploy-model-sa
  labels:
    app: llm-d-bench
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deploy-model-role
  labels:
    app: llm-d-bench
rules:
  # Allow creating, getting, and deleting LLMInferenceService resources
  - apiGroups:
      - serving.kserve.io
    resources:
      - llminferenceservices
    verbs:
      - create
      - get
      - list
      - update
      - patch
      - delete

  # Allow managing namespaces (for Helm --create-namespace flag)
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - get
      - patch

  # Allow managing secrets (for Helm and HuggingFace tokens)
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - create
      - update
      - patch
      - delete

  # Allow managing Helm releases (deployments, services, etc.)
  - apiGroups:
      - ""
    resources:
      - pods
      - services
      - configmaps
      - persistentvolumeclaims
      - serviceaccounts
    verbs:
      - create
      - get
      - list
      - update
      - patch
      - delete
      - watch

  - apiGroups:
      - apps
    resources:
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
    verbs:
      - create
      - get
      - list
      - update
      - patch
      - delete
      - watch

  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - roles
      - rolebindings
    verbs:
      - create
      - get
      - list
      - update
      - patch
      - delete

  # Gateway API resources
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - gateways
      - httproutes
      - grpcroutes
    verbs:
      - create
      - get
      - list
      - update
      - patch
      - delete

  # Inference pool resources (x-k8s.io - legacy)
  - apiGroups:
      - inference.networking.x-k8s.io
    resources:
      - inferencepools
      - inferencepoolrefs
      - inferenceobjectives
      - inferencemodelrewrites
    verbs:
      - create
      - get
      - list
      - update
      - patch
      - delete
      - watch

  # Inference pool resources (k8s.io - stable)
  - apiGroups:
      - inference.networking.k8s.io
    resources:
      - inferencepools
    verbs:
      - create
      - get
      - list
      - update
      - patch
      - delete
      - watch

  # Istio resources
  - apiGroups:
      - telemetry.istio.io
    resources:
      - telemetries
    verbs:
      - create
      - get
      - list
      - update
      - patch
      - delete

  - apiGroups:
      - networking.istio.io
    resources:
      - destinationrules
      - virtualservices
    verbs:
      - create
      - get
      - list
      - update
      - patch
      - delete

  # Monitoring resources
  - apiGroups:
      - monitoring.coreos.com
    resources:
      - servicemonitors
      - podmonitors
    verbs:
      - create
      - get
      - list
      - update
      - patch
      - delete

  # OpenShift Routes (for RHAIIS deployment mode)
  - apiGroups:
      - route.openshift.io
    resources:
      - routes
    verbs:
      - create
      - get
      - list
      - update
      - patch
      - delete

  # Pod logs access for artifact collection
  - apiGroups:
      - ""
    resources:
      - pods/log
    verbs:
      - get
      - list

  # ConfigMap export for artifact collection
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deploy-model-rolebinding
  labels:
    app: llm-d-bench
subjects:
  - kind: ServiceAccount
    name: deploy-model-sa
roleRef:
  kind: Role
  name: deploy-model-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: deploy-model-cluster-role
  labels:
    app: llm-d-bench
rules:
  # Allow managing cluster-scoped RBAC resources created by GAIE
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - clusterroles
      - clusterrolebindings
    verbs:
      - create
      - get
      - list
      - update
      - patch
      - delete

  # GAIE EPP needs to create these for authentication/authorization
  - apiGroups:
      - authentication.k8s.io
    resources:
      - tokenreviews
    verbs:
      - create

  - apiGroups:
      - authorization.k8s.io
    resources:
      - subjectaccessreviews
    verbs:
      - create

  # GAIE EPP needs to access metrics endpoint
  - nonResourceURLs:
      - /metrics
    verbs:
      - get

  # Cross-namespace deployment permissions (all rules from Role)
  # Allow creating, getting, and deleting LLMInferenceService resources
  - apiGroups:
      - serving.kserve.io
    resources:
      - llminferenceservices
    verbs:
      - create
      - get
      - list
      - update
      - patch
      - delete

  # Allow managing namespaces (for Helm --create-namespace flag)
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - get
      - patch

  # Allow managing secrets (for Helm and HuggingFace tokens)
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - create
      - update
      - patch
      - delete

  # Allow managing Helm releases (deployments, services, etc.)
  - apiGroups:
      - ""
    resources:
      - pods
      - services
      - configmaps
      - persistentvolumeclaims
      - serviceaccounts
    verbs:
      - create
      - get
      - list
      - update
      - patch
      - delete
      - watch

  - apiGroups:
      - apps
    resources:
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
    verbs:
      - create
      - get
      - list
      - update
      - patch
      - delete
      - watch

  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - roles
      - rolebindings
    verbs:
      - create
      - get
      - list
      - update
      - patch
      - delete

  # Gateway API resources
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - gateways
      - httproutes
      - grpcroutes
    verbs:
      - create
      - get
      - list
      - update
      - patch
      - delete

  # Inference pool resources (x-k8s.io - legacy)
  - apiGroups:
      - inference.networking.x-k8s.io
    resources:
      - inferencepools
      - inferencepoolrefs
      - inferenceobjectives
      - inferencemodelrewrites
    verbs:
      - create
      - get
      - list
      - update
      - patch
      - delete
      - watch

  # Inference pool resources (k8s.io - stable)
  - apiGroups:
      - inference.networking.k8s.io
    resources:
      - inferencepools
    verbs:
      - create
      - get
      - list
      - update
      - patch
      - delete
      - watch

  # Istio resources
  - apiGroups:
      - telemetry.istio.io
    resources:
      - telemetries
    verbs:
      - create
      - get
      - list
      - update
      - patch
      - delete

  - apiGroups:
      - networking.istio.io
    resources:
      - destinationrules
      - virtualservices
    verbs:
      - create
      - get
      - list
      - update
      - patch
      - delete

  # Monitoring resources
  - apiGroups:
      - monitoring.coreos.com
    resources:
      - servicemonitors
      - podmonitors
    verbs:
      - create
      - get
      - list
      - update
      - patch
      - delete

  # OpenShift Routes (for RHAIIS deployment mode)
  - apiGroups:
      - route.openshift.io
    resources:
      - routes
    verbs:
      - create
      - get
      - list
      - update
      - patch
      - delete

  # Prometheus CRD access for querying metrics
  - apiGroups:
      - monitoring.coreos.com
    resources:
      - prometheuses
      - prometheuses/api
    verbs:
      - get
      - create

  # Prometheus/Thanos API access for metrics collection
  - nonResourceURLs:
      - /api/v1/query
      - /api/v1/query_range
    verbs:
      - get

  # Pod logs access across namespaces for artifact collection
  - apiGroups:
      - ""
    resources:
      - pods/log
    verbs:
      - get
      - list

  # Metrics API access
  - apiGroups:
      - metrics.k8s.io
    resources:
      - nodes
      - pods
    verbs:
      - get
      - list

  # Custom metrics API access
  - apiGroups:
      - custom.metrics.k8s.io
    resources:
      - "*"
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: deploy-model-cluster-rolebinding
  labels:
    app: llm-d-bench
subjects:
  - kind: ServiceAccount
    name: deploy-model-sa
    namespace: llm-d-bench
roleRef:
  kind: ClusterRole
  name: deploy-model-cluster-role
  apiGroup: rbac.authorization.k8s.io
