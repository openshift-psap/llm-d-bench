apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kserve-deployer
rules:
  # KServe ServingRuntime permissions
  - apiGroups: ["serving.kserve.io"]
    resources: ["servingruntimes"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]

  # KServe InferenceService permissions
  - apiGroups: ["serving.kserve.io"]
    resources: ["inferenceservices"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]

  # Status subresource permissions
  - apiGroups: ["serving.kserve.io"]
    resources: ["servingruntimes/status", "inferenceservices/status"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kserve-deployer-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kserve-deployer
subjects:
  - kind: ServiceAccount
    name: deploy-model-sa
