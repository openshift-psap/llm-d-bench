apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-results-postgres-sa
  namespace: tekton-pipelines
  labels:
    app: llm-d-bench
---
# Tekton Results PostgreSQL ServiceAccount
#
# The upstream Tekton Results release deploys a Bitnami PostgreSQL StatefulSet
# that uses the "default" service account. On OpenShift, this fails because the
# container requires:
#   - fsGroup: 1001
#   - capabilities.add: ["NET_BIND_SERVICE"]
#   - seccompProfile: RuntimeDefault
#
# These are rejected by OpenShift's default restricted-v2 SCC.
#
# To fix this (steps 1-2 BEFORE installing Tekton Results, step 3 AFTER):
#
#   1. Apply this file to create the service account:
#      oc apply -f config/cluster/rbac/tekton-results-rbac.yaml
#
#   2. Grant the privileged SCC to the service account:
#      oc adm policy add-scc-to-user privileged \
#        -z tekton-results-postgres-sa -n tekton-pipelines
#
#   3. Install Tekton Results, then immediately patch the StatefulSet:
#      kubectl apply -f https://storage.googleapis.com/tekton-releases/results/latest/release.yaml
#      kubectl patch statefulset tekton-results-postgres \
#        -n tekton-pipelines \
#        --type merge \
#        -p '{"spec":{"template":{"spec":{"serviceAccountName":"tekton-results-postgres-sa"}}}}'
#
# See docs/TEKTON-RESULTS.md for full installation instructions.
