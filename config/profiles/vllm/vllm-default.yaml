apiVersion: v1
kind: ConfigMap
metadata:
  name: vllm-default
  namespace: llm-d-bench
  annotations:
    description: "Default vLLM config with prefix caching disabled"
  labels:
    config-type: vllm
data:
  VLLM_ARGS: |
    --max-model-len=8192
    --uvicorn-log-level=debug
    --trust-remote-code
    --gpu-memory-utilization=0.92
    --no-enable-prefix-caching
    --disable-log-requests