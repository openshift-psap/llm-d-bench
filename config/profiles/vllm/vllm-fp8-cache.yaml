apiVersion: v1
kind: ConfigMap
metadata:
  name: vllm-fp8-cache
  namespace: llm-d-bench
  annotations:
    description: "vLLM with KV cache fp8"
  labels:
    config-type: vllm
data:
  VLLM_ARGS: |
    --max-model-len=8192
    --uvicorn-log-level=debug
    --trust-remote-code
    --gpu-memory-utilization=0.92
    --no-enable-prefix-caching
    --disable-log-requests
    --kv-cache-dtype=fp8