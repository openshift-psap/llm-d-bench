apiVersion: v1
kind: ConfigMap
metadata:
  name: deployment-llm-d-precise-prefix-cache
  namespace: llm-d-bench
  annotations:
    description: "llm-d Precise Prefix Cache deployment with KV-events"
  labels:
    config-type: deployment
data:
  DEPLOYMENT_TYPE: "llm-d"
  DEPLOYMENT_MODE: "precise-prefix-cache"
  LLM_D_REPO_REF: "v0.4.0"
  GATEWAY_PROVIDER: "istio"
  BLOCK_SIZE: "64"
  HASH_SEED: "42"
  ZMQ_PORT: "5557"
