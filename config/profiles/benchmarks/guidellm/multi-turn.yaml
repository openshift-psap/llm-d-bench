apiVersion: v1
kind: ConfigMap
metadata:
  name: multi-turn
  namespace: llm-d-bench
  annotations:
    description: "Multi-turn load test with all concurrency levels"
  labels:
    config-type: benchmark
data:
  IMAGE: "ghcr.io/openshift-psap/llm-d-bench/guidellm:multiturn"
  GUIDELLM_BACKEND_TYPE: "openai_http"
  GUIDELLM_RATE_TYPE: "concurrent"
  GUIDELLM_RATE: "32,64,128,256,512"
  GUIDELLM_DATA: "prompt_tokens=128,output_tokens=128,turns=5,prefix_tokens=10000,prefix_count=2*concurrency"
  GUIDELLM_MAX_SECONDS: ""
  GUIDELLM_MAX_REQUESTS: "10*concurrency"
