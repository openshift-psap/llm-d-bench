apiVersion: v1
kind: ConfigMap
metadata:
  name: multi-turn
  namespace: llm-d-bench
  annotations:
    description: "Multi-turn load test with all concurrency levels"
  labels:
    config-type: benchmark
data:
  IMAGE: "image-registry.openshift-image-registry.svc:5000/llm-d-bench/guidellm-custom:multiturn"
  GUIDELLM_BACKEND_TYPE: "openai_http"
  GUIDELLM_RATE_TYPE: "concurrent"
  GUIDELLM_RATE: "32,64,128,256,512"
  GUIDELLM_DATA: "prompt_tokens=128,output_tokens=128,prefix_tokens=10000,turns=5"
  GUIDELLM_MAX_SECONDS: "600"
  GUIDELLM_MAX_REQUESTS: "10"
