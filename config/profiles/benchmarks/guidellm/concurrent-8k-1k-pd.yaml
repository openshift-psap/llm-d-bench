apiVersion: v1
kind: ConfigMap
metadata:
  name: concurrent-8k-1k-pd
  namespace: llm-d-bench
  annotations:
    description: "PD disaggregation load test: 8k/1k tokens with high concurrency sweep"
  labels:
    config-type: benchmark
data:
  IMAGE: "ghcr.io/openshift-psap/llm-d-bench/guidellm:latest"
  GUIDELLM_BACKEND_TYPE: "openai_http"
  GUIDELLM_RATE_TYPE: "concurrent"
  GUIDELLM_RATE: "25,50,100,250,500,1000,2000,4000"
  GUIDELLM_DATA: "prompt_tokens=8000,output_tokens=1000"
  GUIDELLM_MAX_SECONDS: "420"
  GUIDELLM_MAX_REQUESTS: ""
