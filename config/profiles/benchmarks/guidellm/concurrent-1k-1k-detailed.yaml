apiVersion: v1
kind: ConfigMap
metadata:
  name: concurrent-1k-1k-detailed
  namespace: llm-d-bench
  annotations:
    description: "Full 1k/1k load test with detailed concurrency levels"
  labels:
    config-type: benchmark
data:
  IMAGE: "ghcr.io/openshift-psap/llm-d-bench/guidellm:pr-18"
  GUIDELLM_BACKEND_TYPE: "openai_http"
  GUIDELLM_RATE_TYPE: "concurrent"
  GUIDELLM_RATE: "300,250,200,150,100,50,25,10,1"
  GUIDELLM_DATA: "prompt_tokens=1000,output_tokens=1000"
  GUIDELLM_MAX_SECONDS: "600"
  GUIDELLM_MAX_REQUESTS: ""
