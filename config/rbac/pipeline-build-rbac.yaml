apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipeline-build-sa
  labels:
    app: llm-d-bench
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pipeline-build-role
  labels:
    app: llm-d-bench
rules:
  # Allow managing build resources
  - apiGroups:
      - ""
    resources:
      - pods
      - pods/log
      - persistentvolumeclaims
    verbs:
      - create
      - get
      - list
      - watch
      - delete
  # Allow pushing to internal registry
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
  # Allow image manipulation
  - apiGroups:
      - image.openshift.io
    resources:
      - imagestreams
      - imagestreamtags
    verbs:
      - create
      - get
      - update
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipeline-build-rolebinding
  labels:
    app: llm-d-bench
subjects:
  - kind: ServiceAccount
    name: pipeline-build-sa
roleRef:
  kind: Role
  name: pipeline-build-role
  apiGroup: rbac.authorization.k8s.io
