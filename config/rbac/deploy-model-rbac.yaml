apiVersion: v1
kind: ServiceAccount
metadata:
  name: deploy-model-sa
  labels:
    app: llm-d-bench
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deploy-model-role
  labels:
    app: llm-d-bench
rules:
  # Allow creating, getting, and deleting LLMInferenceService resources
  - apiGroups:
      - serving.kserve.io
    resources:
      - llminferenceservices
    verbs:
      - create
      - get
      - list
      - update
      - patch
      - delete

  # Allow managing secrets (for Helm and HuggingFace tokens)
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - create
      - update
      - patch
      - delete

  # Allow managing Helm releases (deployments, services, etc.)
  - apiGroups:
      - ""
    resources:
      - pods
      - services
      - configmaps
      - persistentvolumeclaims
      - serviceaccounts
    verbs:
      - create
      - get
      - list
      - update
      - patch
      - delete
      - watch

  - apiGroups:
      - apps
    resources:
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
    verbs:
      - create
      - get
      - list
      - update
      - patch
      - delete
      - watch

  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - roles
      - rolebindings
    verbs:
      - create
      - get
      - list
      - update
      - patch
      - delete

  # Gateway API resources
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - gateways
      - httproutes
      - grpcroutes
    verbs:
      - create
      - get
      - list
      - update
      - patch
      - delete

  # Inference pool resources
  - apiGroups:
      - inference.networking.x-k8s.io
    resources:
      - inferencepools
      - inferencepoolrefs
    verbs:
      - create
      - get
      - list
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deploy-model-rolebinding
  labels:
    app: llm-d-bench
subjects:
  - kind: ServiceAccount
    name: deploy-model-sa
roleRef:
  kind: Role
  name: deploy-model-role
  apiGroup: rbac.authorization.k8s.io
