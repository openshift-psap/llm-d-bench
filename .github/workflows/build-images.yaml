name: Build and Push Container Images

on:
  push:
    branches:
      - main
    paths:
      - 'build/**'
  pull_request:
    branches:
      - main
    paths:
      - 'build/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # github.repository format: openshift-psap/llm-d-bench
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: guidellm
            containerfile: build/guidellm/Containerfile
          - image: guidellm
            containerfile: build/guidellm/Containerfile.multiturn
            variant_tag: multiturn
          - image: mlperf
            containerfile: build/mlperf/Containerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install podman
        run: |
          sudo apt-get update
          sudo apt-get -y install podman

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Set image tags
        id: tags
        run: |
          # Determine the tag
          if [[ -n "${{ matrix.variant_tag }}" ]]; then
            # For variant builds (like multiturn), use the variant tag
            TAG="${{ matrix.variant_tag }}"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            TAG="pr-${{ github.event.pull_request.number }}"
          else
            TAG="latest"
          fi

          IMAGE_URL="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${TAG}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "image_url=${IMAGE_URL}" >> $GITHUB_OUTPUT

      - name: Build image with podman
        run: |
          podman build \
            -f ${{ matrix.containerfile }} \
            -t ${{ steps.tags.outputs.image_url }} \
            .

      - name: Push image
        run: |
          podman push ${{ steps.tags.outputs.image_url }}

      - name: Image summary
        run: |
          echo "## Built: ${{ matrix.image }}:${{ steps.tags.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "**Containerfile:** \`${{ matrix.containerfile }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** \`${{ steps.tags.outputs.image_url }}\`" >> $GITHUB_STEP_SUMMARY
