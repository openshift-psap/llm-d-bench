---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "llm-inferenceservice.basename" . }}-route
  namespace: {{ .Release.Namespace }}
  labels:
    llm-d.ai/model-name: {{ include "llm-inferenceservice.modelShortName" . | quote }}
  annotations:
    llm-d.ai/model-name: {{ include "llm-inferenceservice.modelShortName" . | quote }}
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: infra-inference-gateway
    namespace: {{ .Release.Namespace }}
  rules:
    - backendRefs:
      - group: inference.networking.x-k8s.io
        kind: InferencePool
        name: gaie
        port: 8000 # FIXME
        weight: 1
      timeouts:
        backendRequest: 0s
        request: 0s
      matches:
      - path:
          type: PathPrefix
          value: /
