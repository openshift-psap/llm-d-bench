# MI300X Cluster Profile: 8 AMD MI300X GPUs
# AMD GPU benchmarks
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: ResourceFlavor
metadata:
  name: mi300x-flavor
spec:
  nodeLabels:
    amd.com/gpu.product: MI300X
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: ClusterQueue
metadata:
  name: benchmark-cluster-queue
spec:
  namespaceSelector: {}
  queueingStrategy: StrictFIFO
  resourceGroups:
  - coveredResources:
    - amd.com/gpu
    - cpu
    - memory
    flavors:
    - name: mi300x-flavor
      resources:
      - name: amd.com/gpu
        nominalQuota: 8
      - name: cpu
        nominalQuota: 200
      - name: memory
        nominalQuota: 1000Gi
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: LocalQueue
metadata:
  name: psap-benchmark
  namespace: llm-d-bench
spec:
  clusterQueue: benchmark-cluster-queue
