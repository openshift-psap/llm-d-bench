# H200 Cluster Profile: 8 NVIDIA H200 GPUs
# Production benchmarks on H200 cluster
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: ResourceFlavor
metadata:
  name: h200-flavor
spec:
  nodeLabels:
    nvidia.com/gpu.product: NVIDIA-H200
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: ClusterQueue
metadata:
  name: benchmark-cluster-queue
spec:
  namespaceSelector: {}
  queueingStrategy: StrictFIFO
  resourceGroups:
  - coveredResources:
    - nvidia.com/gpu
    - cpu
    - memory
    flavors:
    - name: h200-flavor
      resources:
      - name: nvidia.com/gpu
        nominalQuota: 8
      - name: cpu
        nominalQuota: 200
      - name: memory
        nominalQuota: 1000Gi
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: LocalQueue
metadata:
  name: psap-benchmark
  namespace: llm-d-bench
spec:
  clusterQueue: benchmark-cluster-queue
