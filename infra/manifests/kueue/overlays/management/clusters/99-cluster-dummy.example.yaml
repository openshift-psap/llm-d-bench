# Example cluster configuration - copy and remove .example to activate
# Steps:
#   1. cp 99-cluster-dummy.example.yaml 99-cluster-<name>.yaml
#   2. Get kubeconfig: oc config view --flatten --minify > /tmp/kubeconfig
#   3. Encode: cat /tmp/kubeconfig | base64 -w 0
#   4. Replace <KUBECONFIG_CONTENT_BASE64> below
#   5. Add "- 99-cluster-<name>.yaml" to kustomization.yaml resources
apiVersion: v1
kind: Secret
metadata:
  name: cluster-<name>-kubeconfig
  namespace: kueue
type: Opaque
data:
  kubeconfig: <KUBECONFIG_CONTENT_BASE64>
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: MultiKueueCluster
metadata:
  name: cluster-<name>
spec:
  kubeConfig:
    location: Secret
    locationName: cluster-<name>-kubeconfig
