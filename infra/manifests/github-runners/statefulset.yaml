apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: github-runner
  namespace: github-runners
  labels:
    app: github-runner
spec:
  serviceName: github-runner
  replicas: 2
  selector:
    matchLabels:
      app: github-runner
  template:
    metadata:
      labels:
        app: github-runner
    spec:
      serviceAccountName: github-runner
      securityContext:
        runAsUser: 1001
        fsGroup: 1001
      containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:latest
        securityContext:
          runAsUser: 1001
        command:
        - /bin/bash
        - -c
        args:
        - |
          /scripts/startup.sh
        env:
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: github-token
              key: github_token
        - name: GITHUB_OWNER
          valueFrom:
            secretKeyRef:
              name: github-token
              key: github_owner
        - name: GITHUB_REPOSITORY
          valueFrom:
            secretKeyRef:
              name: github-token
              key: github_repo
        - name: RUNNER_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: RUNNER_LABELS
          value: "openshift,self-hosted,linux,x64"
        - name: RUNNER_GROUP
          value: "default"
        - name: RUNNER_WORKDIR
          value: "_work"
        - name: RUNNER_JOB_TIMEOUT
          value: "43200000"  # 12 hours in milliseconds
        volumeMounts:
        - name: runner-scripts
          mountPath: /scripts
          readOnly: true
        - name: work
          mountPath: /home/runner/_work
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 4Gi
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu
                operator: DoesNotExist
              - key: nvidia.com/gpu.present
                operator: DoesNotExist
      volumes:
      - name: runner-scripts
        configMap:
          name: runner-scripts
          defaultMode: 0755
      - name: work
        emptyDir: {}
  volumeClaimTemplates:
  - metadata:
      name: runner-storage
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
