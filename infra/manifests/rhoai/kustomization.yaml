# Manually install ../rhcl/install.sh before RHOAI

kind: Kustomization
apiVersion: kustomize.config.k8s.io/v1beta1

resources:
  - ./namespace.yaml
  - ./subscription.yaml
  - ./dsc.yaml
  - ./gateway.yaml
  - ./gatewayclass.yaml

patches:
  - target:
      group: gateway.networking.k8s.io
      version: v1
      kind: Gateway
      name: openshift-ai-inference
      namespace: openshift-ingress
    patch: |-
      - op: replace
        path: /spec/listeners/0/hostname
        value: "inference-gateway.apps.psap-llmd-h200.ibm-rh-ai.rhperfscale.org" # "inference.apps.REPLACEME.example.com"

