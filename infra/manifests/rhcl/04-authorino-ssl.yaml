# Apply after the authorino-server-cert secret is created:
# oc apply -f authorino-ssl.yaml
#
# Verify pods restart with TLS:
# oc wait --for=condition=ready pod -l authorino-resource=authorino -n kuadrant-system --timeout=150s

apiVersion: operator.authorino.kuadrant.io/v1beta1
kind: Authorino
metadata:
  name: authorino
  namespace: kuadrant-system
spec:
  replicas: 1
  clusterWide: true
  listener:
    tls:
      enabled: true
      certSecretRef:
        name: authorino-server-cert
  oidcServer:
    tls:
      enabled: false

