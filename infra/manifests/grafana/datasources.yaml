apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: grafana
  labels:
    app.kubernetes.io/name: grafana
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Thanos
        type: prometheus
        access: proxy
        url: https://thanos-querier.openshift-monitoring.svc:9091
        isDefault: true
        jsonData:
          tlsSkipVerify: true
          httpHeaderName1: Authorization
          timeInterval: "30s"
        secureJsonData:
          httpHeaderValue1: "Bearer ${BEARER_TOKEN}"
      - name: Prometheus
        type: prometheus
        access: proxy
        url: https://prometheus-k8s.openshift-monitoring.svc:9091
        jsonData:
          tlsSkipVerify: true
          httpHeaderName1: Authorization
        secureJsonData:
          httpHeaderValue1: "Bearer ${BEARER_TOKEN}"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: grafana
  labels:
    app.kubernetes.io/name: grafana
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'llm-d-bench'
        orgId: 1
        folder: 'LLM Benchmarks'
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards/llm-d-bench
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  namespace: grafana
  labels:
    app.kubernetes.io/name: grafana
data:
  grafana.ini: |
    [auth]
    disable_login_form = false
    
    [auth.anonymous]
    enabled = true
    org_name = Main Org.
    org_role = Viewer
    
    [security]
    allow_embedding = true
    
    [server]
    root_url = %(protocol)s://%(domain)s/
    serve_from_sub_path = false
    
    [users]
    viewers_can_edit = false
    
    [panels]
    disable_sanitize_html = false
    
    [log]
    mode = console
    level = info
    
    [dashboards]
    default_home_dashboard_path = /var/lib/grafana/dashboards/llm-d-bench/llm-d-bench-dashboard.json
