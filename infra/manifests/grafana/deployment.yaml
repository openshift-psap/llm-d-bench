apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: grafana
  labels:
    app.kubernetes.io/name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: llm-d-bench
        app.kubernetes.io/component: monitoring
    spec:
      serviceAccountName: grafana
      containers:
        - name: grafana
          image: docker.io/grafana/grafana:11.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin-credentials
                  key: password
                  optional: true
          volumeMounts:
            - name: storage
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboards
              mountPath: /etc/grafana/provisioning/dashboards
            - name: config
              mountPath: /etc/grafana
            - name: llm-d-bench-dashboards
              mountPath: /var/lib/grafana/dashboards/llm-d-bench
            - name: service-account-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 60
            timeoutSeconds: 30
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            timeoutSeconds: 30
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: grafana-storage
        - name: datasources-src
          configMap:
            name: grafana-datasources
        - name: datasources
          emptyDir: {}
        - name: dashboards
          configMap:
            name: grafana-dashboards
        - name: config
          configMap:
            name: grafana-config
        - name: llm-d-bench-dashboards
          configMap:
            name: llm-d-bench-dashboards
            optional: true
        - name: service-account-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 86400
      initContainers:
        - name: fix-datasources
          image: bitnami/kubectl:latest
          command:
            - /bin/sh
            - -c
            - |
              TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              cp /src/datasources.yaml /dst/datasources.yaml.bak
              sed "s/\${BEARER_TOKEN}/${TOKEN}/g" /dst/datasources.yaml.bak > /dst/datasources.yaml
              echo "Datasource token replaced"
          volumeMounts:
            - name: datasources-src
              mountPath: /src
              readOnly: true
            - name: datasources
              mountPath: /dst
            - name: service-account-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
