apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin-credentials
  namespace: grafana
  labels:
    app: llm-d-bench
type: Opaque
stringData:
  password: "changeme"
---
# Grafana Admin Credentials
#
# This secret sets the admin password for the Grafana instance.
# Referenced by the Grafana deployment via GF_SECURITY_ADMIN_PASSWORD env var.
# The admin username is hardcoded as "admin" in the deployment.
#
# To create this secret:
#   1. Copy this file to grafana-admin-credentials.yaml
#   2. Replace the password with a secure value
#   3. Apply: oc apply -k infra/manifests/grafana/
#
# Or create directly:
#   oc create secret generic grafana-admin-credentials \
#     --from-literal=password=your-secure-password -n grafana
