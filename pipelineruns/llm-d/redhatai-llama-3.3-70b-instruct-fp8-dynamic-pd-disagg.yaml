apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: meta-llama-31-70b-pd-disagg-
  labels:
    app: llm-d-bench
    pipeline: llm-d-end-to-end-benchmark
    experiment: meta-llama-31-70b-pd-disaggregation
    benchmark-tool: guidellm
    deployment-mode: llm-d-pd-disaggregation
spec:
  pipelineRef:
    name: llm-d-end-to-end-benchmark

  taskRunTemplate:
    serviceAccountName: deploy-model-sa

  ttlSecondsAfterFinished: 3600

  params:
    - name: MODEL_NAME
      value: "RedHatAI/Llama-3.3-70B-Instruct-FP8-dynamic"

    - name: VLLM_CONFIG
      value: "vllm-default"
    - name: DEPLOYMENT_CONFIG
      value: "deployment-llm-d-pd-disaggregation"
    - name: BENCHMARK_CONFIG
      value: "concurrent-1k-1k"

    - name: DEPLOYMENT_MODE
      value: "pd-disaggregation"
    - name: RELEASE_NAME
      value: "llama-70b-pd"
    - name: PREFILL_TP
      value: "1"
    - name: DECODE_TP
      value: "4"
    - name: PD_THRESHOLD
      value: "0"
    - name: HASH_BLOCK_SIZE
      value: "5"
    - name: ENABLE_RDMA
      value: "false"
    - name: TP
      value: "4"

    - name: ACCELERATOR
      value: "H200"
    - name: BENCHMARK_ENV_VARS
      value: []

    - name: MLFLOW_ENABLED
      value: "true"
    - name: MLFLOW_EXPERIMENT_NAME
      value: "meta-llama-31-70b-pd-disaggregation"
    - name: VERSION
      value: "llm-d-0.4-pd"
    - name: MLFLOW_TAGS
      value:
        - "deployment=llm-d-pd-disaggregation"
        - "benchmark-tool=guidellm"

  timeouts:
    pipeline: "4h"
    tasks: "4h"

  workspaces:
    - name: models-storage
      persistentVolumeClaim:
        claimName: models-storage

    - name: source
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi

    - name: results
      emptyDir: {}
