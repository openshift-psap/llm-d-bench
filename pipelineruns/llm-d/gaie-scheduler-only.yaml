apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: gaie-scheduler-only-
  labels:
    app: llm-d-bench
    pipeline: upstream-end-to-end-benchmark
    experiment: gaie-scheduler-only
    profile: gaie
spec:
  pipelineRef:
    name: llm-d-end-to-end-benchmark

  # Use service account with permissions for deployments
  taskRunTemplate:
    serviceAccountName: deploy-model-sa

  # Automatically clean up completed PipelineRun after 1 hour
  ttlSecondsAfterFinished: 3600

  params:
    # Model Configuration (not used for GAIE-only but required params)
    - name: MODEL_NAME
      value: "Qwen/Qwen3-0.6B"
    - name: MODEL_REVISION
      value: "main"

    # Deployment Configuration - GAIE Scheduler Only
    - name: RELEASE_NAME
      value: "scheduler-test"
    - name: NAMESPACE
      value: "llm-d"
    - name: GATEWAY_PROVIDER
      value: "istio"
    - name: MODEL_REPLICAS
      value: "1"
    - name: HF_TOKEN_SECRET
      value: "huggingface-token"
    - name: VLLM_ARGS
      value: []

    # Benchmark Configuration (skipped for GAIE-only)
    - name: IMAGE
      value: "image-registry.openshift-image-registry.svc:5000/llm-d/guidellm-custom:latest"
    - name: TARGET
      value: "https://scheduler-test-gateway.llm-d.svc.cluster.local:8000"
    - name: PROCESSOR
      value: ""
    - name: BACKEND_TYPE
      value: "openai_http"
    - name: RATE_TYPE
      value: "concurrent"
    - name: RATE
      value: "1"
    - name: DATA
      value: "prompt_tokens=1000,output_tokens=1000"
    - name: MAX_SECONDS
      value: "300"
    - name: MAX_REQUESTS
      value: ""
    - name: ACCELERATOR
      value: ""
    - name: EXPERIMENT_NAME
      value: "gaie-scheduler-only"
    - name: VERSION
      value: "RHOAI-3.0"
    - name: TP
      value: "1"
    - name: BENCHMARK_ENV_VARS
      value: []

    # MLflow Configuration
    - name: MLFLOW_ENABLED
      value: "false"
    - name: TAGS
      value:
        - "deployment=upstream"
        - "profile=gaie-only"

    # Health Check Configuration
    - name: HEALTH_CHECK_TIMEOUT
      value: "300"

    # Stage Control - only deploy GAIE, skip everything else
    - name: SKIP_DOWNLOAD
      value: "true"
    - name: SKIP_DEPLOY
      value: "false"
    - name: SKIP_BENCHMARK
      value: "true"
    - name: SKIP_CLEANUP
      value: "false"

  timeouts:
    pipeline: "30m"
    tasks: "30m"

  workspaces:
    - name: models-storage
      persistentVolumeClaim:
        claimName: models-storage
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
