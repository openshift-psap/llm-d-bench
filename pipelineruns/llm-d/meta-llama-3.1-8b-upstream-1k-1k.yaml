apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: meta-llama-31-8b-upstream-1k-1k-
  labels:
    app: llm-d-bench
    pipeline: upstream-end-to-end-benchmark
    experiment: meta-llama-31-8b-upstream-1k-1k
spec:
  pipelineRef:
    name: llm-d-end-to-end-benchmark

  taskRunTemplate:
    serviceAccountName: deploy-model-sa

  ttlSecondsAfterFinished: 3600

  params:
    - name: MODEL_NAME
      value: "meta-llama/Llama-3.1-8B"

    - name: VLLM_CONFIG
      value: "vllm-default"
    - name: DEPLOYMENT_CONFIG
      value: "deployment-llm-d-inference-scheduling"
    - name: BENCHMARK_CONFIG
      value: "concurrent-1k-1k"

    - name: RELEASE_NAME
      value: "llama-31-8b"
    - name: REPLICAS
      value: "1"
    - name: TP
      value: "1"

    - name: ACCELERATOR
      value: "H200"
    - name: BENCHMARK_ENV_VARS
      value: []

    - name: MLFLOW_ENABLED
      value: "true"
    - name: MLFLOW_EXPERIMENT_NAME
      value: "meta-llama-31-8b-upstream-1k-1k"
    - name: VERSION
      value: "RHOAI-3.0"
    - name: MLFLOW_TAGS
      value:
        - "deployment=upstream"
        - "llm-d-version=RHOAI 3.0"

  timeouts:
    pipeline: "2h"
    tasks: "2h"

  workspaces:
    - name: models-storage
      persistentVolumeClaim:
        claimName: models-storage
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
