# ===========================================
# llm-d End-to-End Benchmark Example
# ===========================================
# This file contains ALL available parameters for the llm-d-end-to-end-benchmark pipeline.
# Use this as a reference to create new llm-d pipelineruns.
#
# Parameters are annotated with:
#   - REQUIRED: Must be provided, no default value
#   - DEFAULT: Shows the default value if not specified
#   - Options: Lists available choices for the parameter
#
# Deployment Modes:
#   - inference-scheduling: Standard distributed inference (default)
#   - pd-disaggregation: Prefill/Decode disaggregation for large models (70B+, 8+ GPUs)
#
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: qwen-qwen3-06b-example-
  labels:
    app: llm-d-bench
    pipeline: llm-d-end-to-end-benchmark
    experiment: qwen-qwen3-06b-example
    benchmark-tool: guidellm
    deployment-mode: llm-d
spec:
  pipelineRef:
    name: llm-d-end-to-end-benchmark

  # Service account with permissions for Helm/Helmfile deployments
  taskRunTemplate:
    serviceAccountName: deploy-model-sa
    podTemplate:
      labels:
        # Kueue integration for GPU quota management (optional)
        # Remove these labels if not using Kueue
        kueue.x-k8s.io/queue-name: psap-releases-queue
        kueue.x-k8s.io/priority-class: psap-releases

  # Automatically clean up completed PipelineRun after 1 hour
  ttlSecondsAfterFinished: 3600

  params:
    # ===========================================
    # Model Configuration
    # ===========================================
    - name: MODEL_NAME
      # REQUIRED - HuggingFace model identifier
      # Examples: "meta-llama/Llama-3.1-8B", "Qwen/Qwen3-0.6B", "mistralai/Mistral-7B-v0.1"
      value: "Qwen/Qwen3-0.6B"

    - name: MODEL_REVISION
      # DEFAULT: "main"
      # Git branch, tag, or commit hash for the model
      value: "main"

    # ===========================================
    # Deployment Configuration
    # ===========================================
    - name: DEPLOYMENT_MODE
      # DEFAULT: "inference-scheduling"
      # Options: "inference-scheduling", "pd-disaggregation"
      # - inference-scheduling: Standard mode, uses MODEL_REPLICAS and TP
      # - pd-disaggregation: Advanced mode for 70B+ models, uses PREFILL_*/DECODE_* params
      value: "inference-scheduling"

    - name: RELEASE_NAME
      # REQUIRED - Unique identifier for this deployment
      # Used in Helm release names and Kubernetes resource names
      # Must be DNS-compatible (lowercase, alphanumeric, hyphens)
      value: "qwen-06b-example"

    - name: NAMESPACE
      # REQUIRED - Kubernetes namespace for deployment
      value: "llm-d-bench"

    - name: GATEWAY_PROVIDER
      # DEFAULT: "istio"
      # Options: "istio", "kgateway", "standalone", "gke"
      # - istio: OpenShift Service Mesh / Istio (most common)
      # - kgateway: Kubernetes Gateway API with kgateway
      # - standalone: No gateway, direct service access
      # - gke: Google Kubernetes Engine gateway
      value: "istio"

    # ===========================================
    # Inference-Scheduling Mode Parameters
    # (Only used when DEPLOYMENT_MODE=inference-scheduling)
    # ===========================================
    - name: MODEL_REPLICAS
      # DEFAULT: "1"
      # Number of vLLM worker replicas (horizontal scaling)
      value: "1"

    - name: TP
      # DEFAULT: "1"
      # Tensor parallelism size (GPUs per replica)
      # Common values: 1, 2, 4, 8
      # Total GPUs = MODEL_REPLICAS × TP
      value: "1"

    # ===========================================
    # PD Disaggregation Mode Parameters
    # (Only used when DEPLOYMENT_MODE=pd-disaggregation)
    # Requires minimum 8 GPUs total
    # ===========================================
    - name: PREFILL_REPLICAS
      # DEFAULT: "4"
      # Number of prefill worker replicas (horizontal scaling for prefill phase)
      value: "4"

    - name: PREFILL_TP
      # DEFAULT: "1"
      # Tensor parallelism for prefill workers
      value: "1"

    - name: DECODE_REPLICAS
      # DEFAULT: "1"
      # Number of decode worker replicas
      value: "1"

    - name: DECODE_TP
      # DEFAULT: "4"
      # Tensor parallelism for decode workers (vertical scaling)
      value: "4"

    - name: PD_THRESHOLD
      # DEFAULT: "0"
      # Selective PD threshold
      # - 0: Always disaggregate (all requests go through PD pipeline)
      # - >0: Only disaggregate requests with input length > threshold
      value: "0"

    - name: HASH_BLOCK_SIZE
      # DEFAULT: "5"
      # Hash block size for PD profiling in GAIE
      # Used for KV cache profiling and matching
      value: "5"

    - name: ENABLE_RDMA
      # DEFAULT: "true"
      # Enable RDMA/InfiniBand networking for KV cache transfer
      # Set to "false" for clusters without RDMA hardware
      # Performance will be reduced without RDMA
      value: "true"

    # ===========================================
    # Storage & Authentication
    # ===========================================
    - name: HF_TOKEN_SECRET
      # DEFAULT: "huggingface-token"
      # Kubernetes secret name containing HuggingFace token
      # Secret must have key "HF_TOKEN"
      value: "huggingface-token"

    - name: VLLM_ARGS
      # DEFAULT: []
      # Additional vLLM command-line arguments
      # Common options:
      #   --max-model-len=N        Maximum sequence length
      #   --gpu-memory-utilization=0.95   GPU memory fraction to use
      #   --trust-remote-code      Trust remote code in model repo
      #   --quantization=awq|gptq  Enable quantization
      #   --enforce-eager          Disable CUDA graphs
      #   --distributed-executor-backend=mp|ray  Distributed backend
      value:
        - "--max-model-len=8192"
        - "--gpu-memory-utilization=0.95"

    # ===========================================
    # llm-d Repository Configuration
    # ===========================================
    - name: LLM_D_REPO_URL
      # DEFAULT: "https://github.com/llm-d/llm-d.git"
      # llm-d repository URL (use fork URL for testing changes)
      value: "https://github.com/llm-d/llm-d.git"

    - name: LLM_D_REPO_REF
      # DEFAULT: "main"
      # Git branch, tag, or commit for llm-d repository
      # Use specific version tags for reproducibility (e.g., "v0.4.0")
      value: "v0.4.0"

    # ===========================================
    # Benchmark Configuration - GuideLLM
    # ===========================================
    - name: IMAGE
      # DEFAULT: "image-registry.openshift-image-registry.svc:5000/llm-d-bench/guidellm-custom:latest"
      # GuideLLM benchmark container image
      # Update namespace if built in different namespace
      value: "image-registry.openshift-image-registry.svc:5000/llm-d-bench/guidellm-custom:latest"

    - name: TARGET
      # REQUIRED - Inference endpoint URL
      # Format depends on GATEWAY_PROVIDER:
      #   istio: http://infra-{RELEASE_NAME}-inference-gateway-istio.{NAMESPACE}.svc.cluster.local:80
      #   kgateway: http://infra-{RELEASE_NAME}-inference-gateway.{NAMESPACE}.svc.cluster.local:80
      #   standalone: http://{service-name}.{NAMESPACE}.svc.cluster.local:8000
      value: "http://infra-qwen-06b-example-inference-gateway-istio.llm-d-bench.svc.cluster.local:80"

    - name: GUIDELLM_PROCESSOR
      # DEFAULT: "" (empty, uses MODEL_NAME)
      # Tokenizer/processor model name for GuideLLM
      # Set explicitly if different from MODEL_NAME
      value: "Qwen/Qwen3-0.6B"

    - name: GUIDELLM_BACKEND_TYPE
      # DEFAULT: "openai_http"
      # Options: "openai_http", "openai_server"
      # Backend type for the inference server
      value: "openai_http"

    - name: GUIDELLM_RATE_TYPE
      # DEFAULT: "concurrent"
      # Options: "concurrent", "synchronous"
      # - concurrent: Maintain N concurrent requests
      # - synchronous: Send requests at fixed rate (requests/sec)
      value: "concurrent"

    - name: GUIDELLM_RATE
      # DEFAULT: "1,50,100"
      # Comma-separated list of rates to test
      # For concurrent: number of concurrent requests
      # For synchronous: requests per second
      value: "1"

    - name: GUIDELLM_DATA
      # DEFAULT: "prompt_tokens=1000,output_tokens=1000"
      # Request data profile
      # Format: prompt_tokens=N,output_tokens=M
      # Or use dataset name: "emulated:prompt_tokens=1000,output_tokens=1000"
      value: "prompt_tokens=1000,output_tokens=1000"

    - name: GUIDELLM_MAX_SECONDS
      # DEFAULT: "600"
      # Maximum duration per rate in seconds
      # Set lower for quick tests, higher for stable measurements
      value: "60"

    - name: GUIDELLM_MAX_REQUESTS
      # DEFAULT: "" (unlimited)
      # Maximum number of requests per rate
      # Leave empty for time-based runs
      value: ""

    # ===========================================
    # MLflow Configuration
    # ===========================================
    - name: MLFLOW_ENABLED
      # DEFAULT: "false"
      # Enable MLflow experiment tracking
      # Requires MLflow server and mlflow-auth secret
      value: "true"

    - name: MLFLOW_EXPERIMENT_NAME
      # DEFAULT: "guidellm-benchmarks-llm-d"
      # MLflow experiment name
      value: "qwen-qwen3-06b"

    - name: VERSION
      # DEFAULT: "" (empty)
      # Version identifier for visualization reports
      # Useful for comparing different configurations
      value: "llm-d-upstream"

    - name: ACCELERATOR
      # DEFAULT: "" (empty)
      # GPU/accelerator type tag for MLflow
      # Examples: "H100", "H200", "A100-80GB", "L40S"
      value: "H200"

    - name: MLFLOW_TAGS
      # DEFAULT: []
      # Additional tags as array of key=value pairs
      # Recorded in MLflow for filtering/grouping
      value:
        - "deployment=llm-d"
        - "gateway=istio"

    - name: BENCHMARK_ENV_VARS
      # DEFAULT: []
      # Additional environment variables for benchmark container
      # Format: ["VAR1=value1", "VAR2=value2"]
      value: []

    # ===========================================
    # MLPerf Benchmark Parameters
    # (Only used when IMAGE contains 'mlperf')
    # ===========================================
    - name: MLPERF_DATASET_NAME
      # DEFAULT: "cnn_eval.json"
      # Dataset filename in /mlperf-data/ PVC mount
      value: "cnn_eval.json"

    - name: MLPERF_SCENARIO
      # DEFAULT: "Offline"
      # Options: "Offline", "Server", "SingleStream", "MultiStream"
      value: "Offline"

    - name: MLPERF_TEST_MODE
      # DEFAULT: "accuracy"
      # Options: "accuracy", "performance"
      value: "accuracy"

    - name: MLPERF_BATCH_SIZE
      # DEFAULT: "" (auto)
      # Batch size for MLPerf
      value: ""

    - name: MLPERF_NUM_SAMPLES
      # DEFAULT: "4388"
      # Number of samples to process
      value: "4388"

    - name: MLPERF_OUTPUT_DIR
      # DEFAULT: "./test-run"
      # Output directory for MLPerf results
      value: "./test-run"

    - name: MLPERF_SERVER_TARGET_QPS
      # DEFAULT: "10"
      # Target QPS for Server scenario
      value: "10"

    # ===========================================
    # Health Check Configuration
    # ===========================================
    - name: HEALTH_CHECK_TIMEOUT
      # DEFAULT: "3600"
      # Endpoint health check timeout in seconds
      # Increase for large models that take longer to load
      value: "3600"

    # ===========================================
    # Stage Control
    # ===========================================
    - name: SKIP_DOWNLOAD
      # DEFAULT: "false"
      # Skip model download stage (use if model already exists on PVC)
      value: "false"

    - name: SKIP_DEPLOY
      # DEFAULT: "false"
      # Skip deployment stage (use if model already deployed)
      value: "false"

    - name: SKIP_BENCHMARK
      # DEFAULT: "false"
      # Skip benchmark stage (use for deployment-only runs)
      value: "false"

    - name: SKIP_CLEANUP
      # DEFAULT: "false"
      # Skip cleanup stage (keep deployment running after benchmark)
      value: "false"

  # ===========================================
  # Timeouts
  # ===========================================
  timeouts:
    pipeline: "2h"
    tasks: "2h"

  # ===========================================
  # Workspaces
  # ===========================================
  workspaces:
    # Model storage PVC (required)
    # Must be RWX for multi-pod deployments, RWO for single-pod
    - name: models-storage
      persistentVolumeClaim:
        claimName: models-storage

    # Source workspace for cloning llm-d repository
    # Uses ephemeral storage (volumeClaimTemplate)
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi

    # Results workspace (optional, only for non-MLflow mode)
    # Use emptyDir for MLflow mode, PVC for file-based results
    - name: results
      emptyDir: {}
