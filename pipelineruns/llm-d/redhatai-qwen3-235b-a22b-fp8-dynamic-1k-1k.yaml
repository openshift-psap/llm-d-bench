apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: redhatai-qwen3-235b-a22b-fp8-dynamic-1k-1k-
  labels:
    app: llm-d-bench
    pipeline: upstream-end-to-end-benchmark
    experiment: redhatai-qwen3-235b-a22b-fp8-dynamic-1k-1k
spec:
  pipelineRef:
    name: llm-d-end-to-end-benchmark

  # Use service account with permissions for deployments
  taskRunTemplate:
    serviceAccountName: deploy-model-sa

  # Automatically clean up completed PipelineRun after 1 hour
  ttlSecondsAfterFinished: 3600

  params:
    # Model Configuration
    - name: MODEL_NAME
      value: "RedHatAI/Qwen3-235B-A22B-FP8-dynamic"
    - name: MODEL_REVISION
      value: "main"

    # Deployment Configuration
    - name: RELEASE_NAME
      value: "qwen3-235b-a22b-fp8"
    - name: NAMESPACE
      value: "llm-d-bench"
    - name: GATEWAY_PROVIDER
      value: "istio"
    - name: MODEL_REPLICAS
      value: "1"
    - name: HF_TOKEN_SECRET
      value: "huggingface-token"
    - name: VLLM_ARGS
      value:
        - "--max-model-len=8192"
        - "--uvicorn-log-level=debug" 
        - "--trust-remote-code"
        - "--gpu-memory-utilization=0.92"
        - "--no-enable-prefix-caching"
        - "--disable-log-requests"
        - "--enable-expert-parallel"

    # Benchmark Configuration
    - name: IMAGE
      value: "image-registry.openshift-image-registry.svc:5000/llm-d/guidellm-custom:latest"
    - name: TARGET
      value: "http://infra-qwen3-235b-a22b-fp8-inference-gateway-istio.llm-d.svc.cluster.local:80"
    - name: PROCESSOR
      value: "RedHatAI/Qwen3-235B-A22B-FP8-dynamic"
    - name: BACKEND_TYPE
      value: "openai_http"
    - name: RATE_TYPE
      value: "concurrent"
    - name: RATE
      value: "650,500,300,200,100,50,1"
    - name: DATA
      value: "prompt_tokens=1000,output_tokens=1000"
    - name: MAX_SECONDS
      value: "600"
    - name: MAX_REQUESTS
      value: ""
    - name: ACCELERATOR
      value: "H200"
    - name: EXPERIMENT_NAME
      value: "redhatai-qwen3-235b-a22b-fp8-dynamic-1k-1k"
    - name: VERSION
      value: "llm-d-0.4"
    - name: TP
      value: "1"
    - name: BENCHMARK_ENV_VARS
      value:
        - "GUIDELLM__MAX_WORKER_PROCESSES=100"

    # MLflow Configuration
    - name: MLFLOW_ENABLED
      value: "true"
    - name: TAGS
      value:
        - "deployment=upstream"
        - "llm-d-version=0.4.0"

    # Health Check Configuration
    - name: HEALTH_CHECK_TIMEOUT
      value: "3600"

    # Stage Control - skip download, enable deploy/benchmark/cleanup
    - name: SKIP_DOWNLOAD
      value: "true"
    - name: SKIP_DEPLOY
      value: "false"
    - name: SKIP_BENCHMARK
      value: "false"
    - name: SKIP_CLEANUP
      value: "false"

  timeouts:
    pipeline: "2h"
    tasks: "2h"

  workspaces:
    - name: models-storage
      persistentVolumeClaim:
        claimName: models-storage
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
