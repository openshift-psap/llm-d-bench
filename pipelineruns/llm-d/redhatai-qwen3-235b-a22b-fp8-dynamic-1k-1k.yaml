apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: redhatai-qwen3-235b-a22b-fp8-dynamic-1k-1k-
  labels:
    app: llm-d-bench
    pipeline: upstream-end-to-end-benchmark
    experiment: redhatai-qwen3-235b-a22b-fp8-dynamic-1k-1k
spec:
  pipelineRef:
    name: llm-d-end-to-end-benchmark

  taskRunTemplate:
    serviceAccountName: deploy-model-sa

  ttlSecondsAfterFinished: 3600

  params:
    - name: MODEL_NAME
      value: "RedHatAI/Qwen3-235B-A22B-FP8-dynamic"

    - name: VLLM_CONFIG
      value: "vllm-experts-parallel"
    - name: DEPLOYMENT_CONFIG
      value: "deployment-llm-d-inference-scheduling"
    - name: BENCHMARK_CONFIG
      value: "concurrent-1k-1k"

    - name: RELEASE_NAME
      value: "qwen3-235b-a22b-fp8"
    - name: REPLICAS
      value: "1"
    - name: TP
      value: "4"

    - name: ACCELERATOR
      value: "H200"
    - name: BENCHMARK_ENV_VARS
      value:
        - "GUIDELLM__MAX_WORKER_PROCESSES=100"

    - name: MLFLOW_ENABLED
      value: "true"
    - name: MLFLOW_EXPERIMENT_NAME
      value: "redhatai-qwen3-235b-a22b-fp8-dynamic-1k-1k"
    - name: VERSION
      value: "llm-d-0.4"
    - name: MLFLOW_TAGS
      value:
        - "deployment=upstream"
        - "llm-d-version=0.4.0"

  timeouts:
    pipeline: "2h"
    tasks: "2h"

  workspaces:
    - name: models-storage
      persistentVolumeClaim:
        claimName: models-storage
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
