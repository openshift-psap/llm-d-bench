apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: nvidia-nvidia-nemotron-3-nano-30b-a3b-fp8-1k-1k-
  labels:
    app: llm-d-bench
    pipeline: llm-d-end-to-end-benchmark
    experiment: nvidia-nvidia-nemotron-3-nano-30b-a3b-fp8-1k-1k
    benchmark-tool: guidellm
    deployment-mode: llm-d
spec:
  pipelineRef:
    name: llm-d-end-to-end-benchmark

  taskRunTemplate:
    serviceAccountName: deploy-model-sa

  ttlSecondsAfterFinished: 3600

  params:
    - name: MODEL_NAME
      value: "nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-FP8"

    - name: VLLM_CONFIG
      value: "vllm-fp8-cache"
    - name: DEPLOYMENT_CONFIG
      value: "deployment-llm-d-inference-scheduling"
    - name: BENCHMARK_CONFIG
      value: "concurrent-1k-1k"

    - name: RELEASE_NAME
      value: "nvidia-nemotron-3"
    - name: REPLICAS
      value: "1"
    - name: TP
      value: "1"

    - name: ACCELERATOR
      value: "H200"
    - name: BENCHMARK_ENV_VARS
      value:
        - "GUIDELLM__MAX_WORKER_PROCESSES=100"

    - name: MLFLOW_ENABLED
      value: "true"
    - name: MLFLOW_EXPERIMENT_NAME
      value: "nvidia-nvidia-nemotron-3-nano-30b-a3b-fp8-1k-1k"
    - name: VERSION
      value: "llm-d-0.4"
    - name: MLFLOW_TAGS
      value:
        - "deployment=llm-d"
        - "benchmark-tool=guidellm"

  timeouts:
    pipeline: "2h"
    tasks: "2h"

  workspaces:
    - name: models-storage
      persistentVolumeClaim:
        claimName: models-storage
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi

    - name: results
      emptyDir: {}
