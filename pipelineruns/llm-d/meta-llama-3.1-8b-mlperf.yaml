apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: redhatai-meta-llama-31-8b-instruct-fp8-mlperf-
  labels:
    app: llm-d-bench
    pipeline: llm-d-end-to-end-benchmark-mlperf
    experiment: redhatai-meta-llama-31-8b-instruct-fp8-mlperf
    benchmark-tool: mlperf
    deployment-mode: llm-d
spec:
  pipelineRef:
    name: llm-d-end-to-end-benchmark-mlperf

  taskRunTemplate:
    serviceAccountName: deploy-model-sa

  ttlSecondsAfterFinished: 3600

  params:
    # ===========================================
    # Model Configuration
    # ===========================================
    - name: MODEL_NAME
      value: "RedHatAI/Meta-Llama-3.1-8B-Instruct-FP8"
    - name: MODEL_REVISION
      value: "main"

    # ===========================================
    # Deployment Configuration (llm-d-specific)
    # ===========================================
    - name: RELEASE_NAME
      value: "llama-31-8b-mlperf"
    - name: NAMESPACE
      value: "llm-d"
    - name: GATEWAY_PROVIDER
      value: "istio"
    - name: MODEL_REPLICAS
      value: "1"
    - name: VLLM_ARGS
      value:
        - "--max-model-len=8192"
        - "--gpu-memory-utilization=0.92"
        - "--trust-remote-code"

    # ===========================================
    # Benchmark Configuration - MLPerf Image
    # ===========================================
    - name: IMAGE
      value: "image-registry.openshift-image-registry.svc:5000/llm-d/mlperf-custom:latest"
    - name: TARGET
      value: "http://infra-llama-31-8b-mlperf-inference-gateway-istio.llm-d.svc.cluster.local:80"

    # ===========================================
    # MLPerf-specific parameters
    # ===========================================
    - name: DATASET_NAME
      value: "cnn_eval.json"
    - name: SCENARIO
      value: "Server"
    - name: TEST_MODE
      value: "performance"
    - name: NUM_SAMPLES
      value: "13368"
    - name: SERVER_TARGET_QPS
      value: "20"
    - name: BATCH_SIZE
      value: ""
    - name: OUTPUT_DIR
      value: "/tmp/mlperf"
    - name: BENCHMARK_ENV_VARS
      value:
        - "MLFLOW_TRACKING_URI=http://150.239.115.202:5000"

    # ===========================================
    # GuideLLM parameters (unused but required by pipeline schema)
    # ===========================================
    - name: RATE
      value: "1"
    - name: DATA
      value: ""
    - name: PROCESSOR
      value: ""
    - name: MAX_SECONDS
      value: ""
    - name: MAX_REQUESTS
      value: ""
    - name: BACKEND_TYPE
      value: ""
    - name: RATE_TYPE
      value: ""

    # ===========================================
    # MLflow Configuration
    # ===========================================
    - name: MLFLOW_ENABLED
      value: "true"
    - name: EXPERIMENT_NAME
      value: "redhatai-meta-llama-31-8b-instruct-fp8-mlperf"
    - name: VERSION
      value: "llm-d-0.4"
    - name: ACCELERATOR
      value: "H200"
    - name: TP
      value: "1"
    - name: TAGS
      value:
        - "deployment=llm-d"
        - "benchmark-tool=mlperf"

    # ===========================================
    # Health Check Configuration
    # ===========================================
    - name: HEALTH_CHECK_TIMEOUT
      value: "3600"

    # ===========================================
    # Stage Control
    # ===========================================
    - name: SKIP_DOWNLOAD
      value: "false"
    - name: SKIP_DEPLOY
      value: "false"
    - name: SKIP_BENCHMARK
      value: "false"
    - name: SKIP_CLEANUP
      value: "false"

  timeouts:
    pipeline: "2h"
    tasks: "2h"

  workspaces:
    - name: models-storage
      persistentVolumeClaim:
        claimName: models-storage  # Must contain both models/ and datasets/ subdirectories

    - name: source
      emptyDir: {}

    - name: results
      emptyDir: {}
