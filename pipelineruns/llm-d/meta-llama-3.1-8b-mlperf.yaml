apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: meta-llama-31-8b-mlperf-
  labels:
    app: llm-d-bench
    pipeline: llm-d-end-to-end-benchmark
    experiment: meta-llama-31-8b-mlperf
    benchmark-tool: mlperf
    deployment-mode: llm-d
spec:
  pipelineRef:
    name: llm-d-end-to-end-benchmark

  taskRunTemplate:
    serviceAccountName: deploy-model-sa

  ttlSecondsAfterFinished: 3600

  params:
    - name: MODEL_NAME
      value: "RedHatAI/Meta-Llama-3.1-8B-Instruct-FP8"

    - name: VLLM_CONFIG
      value: "vllm-default"
    - name: DEPLOYMENT_CONFIG
      value: "deployment-llm-d-inference-scheduling"
    - name: BENCHMARK_CONFIG
      value: "concurrent-1k-1k"

    - name: RELEASE_NAME
      value: "llama-31-8b-mlperf"
    - name: REPLICAS
      value: "1"
    - name: TP
      value: "1"

    - name: MLPERF_DATASET_NAME
      value: "cnn_eval.json"
    - name: MLPERF_SCENARIO
      value: "Server"
    - name: MLPERF_TEST_MODE
      value: "performance"
    - name: MLPERF_NUM_SAMPLES
      value: "13368"
    - name: MLPERF_SERVER_TARGET_QPS
      value: "20"
    - name: MLPERF_BATCH_SIZE
      value: ""
    - name: MLPERF_OUTPUT_DIR
      value: "/tmp/mlperf"
    - name: ACCELERATOR
      value: "H200"
    - name: BENCHMARK_ENV_VARS
      value: []

    - name: MLFLOW_ENABLED
      value: "true"
    - name: MLFLOW_EXPERIMENT_NAME
      value: "meta-llama-31-8b-mlperf"
    - name: VERSION
      value: "llm-d-0.4"
    - name: MLFLOW_TAGS
      value:
        - "deployment=llm-d"
        - "benchmark-tool=mlperf"

  timeouts:
    pipeline: "2h"
    tasks: "2h"

  workspaces:
    - name: models-storage
      persistentVolumeClaim:
        claimName: models-storage  # Must contain both models/ and datasets/ subdirectories

    - name: source
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi

    - name: results
      emptyDir: {}
