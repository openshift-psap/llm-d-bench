apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: redhatai-qwen3-235b-a22b-fp8-dynamic-1k-1k-
  labels:
    app: llm-d-tekton
    pipeline: full-benchmark-lifecycle
    experiment: redhatai-qwen3-235b-a22b-fp8-dynamic-1k-1k
spec:
  pipelineRef:
    name: full-benchmark-lifecycle

  # Use service account with permissions for LLMInferenceService resources
  taskRunTemplate:
    serviceAccountName: deploy-model-sa

  # Automatically clean up completed PipelineRun after 1 hour
  ttlSecondsAfterFinished: 3600

  params:
    # Model Configuration
    - name: MODEL_NAME
      value: "RedHatAI/Qwen3-235B-A22B-FP8-dynamic"
    - name: MODEL_REVISION
      value: "main"

    # Deployment Configuration
    - name: DEPLOYMENT_NAME
      value: "RedHatAI-Qwen3-235B-A22B-FP8-dynamic"
    - name: NAMESPACE
      value: "downstream-llm-d"
    - name: VLLM_ARGS
      value: '[]'
    - name: ENABLE_AUTH
      value: "false"
    - name: REPLICAS
      value: "1"

    # Benchmark Configuration
    - name: IMAGE
      value: "image-registry.openshift-image-registry.svc:5000/downstream-llm-d/guidellm-custom:latest"
    - name: TARGET
      value: "https://inference-gateway.apps.psap-llmd-h200.ibm-rh-ai.rhperfscale.org/downstream-llm-d/redhatai-qwen3-235b-a22b-fp8-dynamic"
    - name: PROCESSOR
      value: "RedHatAI/Qwen3-235B-A22B-FP8-dynamic"
    - name: BACKEND_TYPE
      value: "openai_http"
    - name: RATE_TYPE
      value: "concurrent"
    - name: RATE
      value: "650,500,300,200,100,50,1"
    - name: DATA
      value: "prompt_tokens=1000,output_tokens=1000"
    - name: MAX_SECONDS
      value: "600"
    - name: MAX_REQUESTS
      value: ""
    - name: ACCELERATOR
      value: "H200"
    - name: EXPERIMENT_NAME
      value: "redhatai-qwen3-235b-a22b-fp8-dynamic-1k-1k"
    - name: VERSION
      value: "RHOAI-3.0"
    - name: TP
      value: "1"

    # MLflow Configuration
    - name: MLFLOW_ENABLED
      value: "true"
    - name: MLFLOW_TRACKING_URI
      value: "https://mlflow-mlflow.apps.aperdomo-lab.ibm.rhperfscale.org"
    - name: TAGS
      value: '{"llm-d-version":"RHOAI 3.0"}'

    # Health Check Configuration
    - name: HEALTH_CHECK_TIMEOUT
      value: "3600"

    # Stage Control - skip download, enable deploy/benchmark/cleanup
    - name: SKIP_DOWNLOAD
      value: "true"
    - name: SKIP_DEPLOY
      value: "false"
    - name: SKIP_BENCHMARK
      value: "false"
    - name: SKIP_CLEANUP
      value: "false"

  workspaces:
    - name: models-storage
      persistentVolumeClaim:
        claimName: models-storage
