apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: deepseek-r1-0528-1k-1k-
  labels:
    app: llm-d-bench
    pipeline: downstream-end-to-end-benchmark
    experiment: deepseek-r1-0528-1k-1k
    benchmark-tool: guidellm
    deployment-mode: rhoai
spec:
  pipelineRef:
    name: rhoai-end-to-end-benchmark

  taskRunTemplate:
    serviceAccountName: deploy-model-sa

  ttlSecondsAfterFinished: 3600

  params:
    - name: MODEL_NAME
      value: "deepseek-ai/DeepSeek-R1-0528"

    - name: VLLM_CONFIG
      value: "vllm-default"
    - name: DEPLOYMENT_CONFIG
      value: "deployment-rhoai-kserve"
    - name: BENCHMARK_CONFIG
      value: "concurrent-1k-1k"

    - name: VLLM_ARGS
      value:
        - "--max-model-len=8192"
        - "--uvicorn-log-level=debug"
        - "--trust-remote-code"
        - "--gpu-memory-utilization=0.92"
        - "--no-enable-prefix-caching"
        - "--disable-log-requests"
    - name: ENABLE_AUTH
      value: "false"
    - name: REPLICAS
      value: "1"
    - name: TP
      value: "8"

    - name: ACCELERATOR
      value: "H200"
    - name: BENCHMARK_ENV_VARS
      value:
        - "GUIDELLM__MAX_WORKER_PROCESSES=100"

    - name: MLFLOW_ENABLED
      value: "true"
    - name: MLFLOW_EXPERIMENT_NAME
      value: "deepseek-r1-0528-1k-1k"
    - name: VERSION
      value: "RHOAI-3.2-RC3"
    - name: MLFLOW_TAGS
      value:
        - "deployment=rhoai"
        - "benchmark-tool=guidellm"

  timeouts:
    pipeline: "2h"
    tasks: "2h"

  workspaces:
    - name: models-storage
      persistentVolumeClaim:
        claimName: models-storage

    - name: results
      persistentVolumeClaim:
        claimName: collection-results

    - name: manifests-storage
      emptyDir: {}
