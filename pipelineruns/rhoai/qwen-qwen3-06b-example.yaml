# ===========================================
# RHOAI End-to-End Benchmark Example
# ===========================================
# This file contains ALL available parameters for the rhoai-end-to-end-benchmark pipeline.
# Use this as a reference to create new RHOAI pipelineruns.
#
# Parameters are annotated with:
#   - REQUIRED: Must be provided, no default value
#   - DEFAULT: Shows the default value if not specified
#   - Options: Lists available choices for the parameter
#
# RHOAI deploys models using KServe LLMInferenceService (Red Hat OpenShift AI).
# Requires RHOAI 3.0+ with KServe and Service Mesh configured.
#
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: qwen-qwen3-06b-example-
  labels:
    app: llm-d-bench
    pipeline: rhoai-end-to-end-benchmark
    experiment: qwen-qwen3-06b-example
    benchmark-tool: guidellm
    deployment-mode: rhoai
spec:
  pipelineRef:
    name: rhoai-end-to-end-benchmark

  # Service account with permissions for LLMInferenceService resources
  taskRunTemplate:
    serviceAccountName: deploy-model-sa
    podTemplate:
      labels:
        # Kueue integration for GPU quota management (optional)
        # Remove these labels if not using Kueue
        kueue.x-k8s.io/queue-name: psap-releases-queue
        kueue.x-k8s.io/priority-class: psap-releases

  # Automatically clean up completed PipelineRun after 1 hour
  ttlSecondsAfterFinished: 3600

  params:
    # ===========================================
    # Model Configuration
    # ===========================================
    - name: MODEL_NAME
      # REQUIRED - HuggingFace model identifier
      # Examples: "meta-llama/Llama-3.1-8B", "Qwen/Qwen3-0.6B", "mistralai/Mistral-7B-v0.1"
      value: "Qwen/Qwen3-0.6B"

    - name: MODEL_REVISION
      # DEFAULT: "main"
      # Git branch, tag, or commit hash for the model
      value: "main"

    # ===========================================
    # Deployment Configuration (RHOAI-specific)
    # ===========================================
    - name: NAMESPACE
      # REQUIRED - Kubernetes namespace for deployment
      # Must have RHOAI/KServe configured
      value: "llm-d-bench"

    - name: REPLICAS
      # DEFAULT: "1"
      # Number of LLMInferenceService replicas
      value: "1"

    - name: TP
      # DEFAULT: "1"
      # Tensor parallelism size (GPUs per replica)
      # Common values: 1, 2, 4, 8
      # Total GPUs = REPLICAS × TP
      value: "1"

    - name: ENABLE_AUTH
      # DEFAULT: "false"
      # Enable authentication on the inference service
      # When true, requires auth token for API calls
      value: "false"

    - name: VLLM_ARGS
      # DEFAULT: []
      # Additional vLLM command-line arguments
      # Common options:
      #   --max-model-len=N        Maximum sequence length
      #   --gpu-memory-utilization=0.95   GPU memory fraction to use
      #   --trust-remote-code      Trust remote code in model repo
      #   --quantization=awq|gptq  Enable quantization
      #   --enforce-eager          Disable CUDA graphs
      #   --distributed-executor-backend=mp|ray  Distributed backend
      value:
        - "--max-model-len=8192"
        - "--gpu-memory-utilization=0.95"

    # ===========================================
    # Routing Configuration (EPP)
    # ===========================================
    - name: ROUTING_MODE
      # DEFAULT: "direct"
      # Options:
      #   - direct: KServe SVC only, no EPP (default)
      #   - prefix-estimation: EPP with kv-cache-utilization-scorer
      #   - prefix-precise: EPP with prefix-aware-scorer
      value: "direct"

    - name: GATEWAY_NAME
      # DEFAULT: "openshift-ai-inference"
      # Name of the Gateway for EPP routing (required for prefix-* modes)
      value: "openshift-ai-inference"

    - name: GATEWAY_NAMESPACE
      # DEFAULT: "openshift-ingress"
      # Namespace of the Gateway for EPP routing
      value: "openshift-ingress"

    # ===========================================
    # Benchmark Configuration - GuideLLM
    # ===========================================
    - name: IMAGE
      # DEFAULT: "image-registry.openshift-image-registry.svc:5000/llm-d-bench/guidellm-custom:latest"
      # GuideLLM benchmark container image
      # Update namespace if built in different namespace
      value: "image-registry.openshift-image-registry.svc:5000/llm-d-bench/guidellm-custom:v0.5.3"

    - name: TARGET
      # REQUIRED - Inference endpoint URL
      # Format for RHOAI/KServe:
      #   https://{sanitized-model-name}-kserve-workload-svc.{namespace}.svc.cluster.local:8000
      # Model name is sanitized: lowercase, slashes replaced with hyphens
      # Example: "meta-llama/Llama-3.1-8B" -> "meta-llama-llama-3.1-8b"
      value: "https://qwen-qwen3-06b-kserve-workload-svc.llm-d-bench.svc.cluster.local:8000"

    - name: GUIDELLM_PROCESSOR
      # DEFAULT: "" (empty, uses MODEL_NAME)
      # Tokenizer/processor model name for GuideLLM
      # Set explicitly if different from MODEL_NAME
      value: "Qwen/Qwen3-0.6B"

    - name: GUIDELLM_BACKEND_TYPE
      # DEFAULT: "openai_http"
      # Options: "openai_http", "openai_server"
      # Backend type for the inference server
      value: "openai_http"

    - name: GUIDELLM_RATE_TYPE
      # DEFAULT: "concurrent"
      # Options: "concurrent", "synchronous"
      # - concurrent: Maintain N concurrent requests
      # - synchronous: Send requests at fixed rate (requests/sec)
      value: "concurrent"

    - name: GUIDELLM_RATE
      # DEFAULT: "1,50,100"
      # Comma-separated list of rates to test
      # For concurrent: number of concurrent requests
      # For synchronous: requests per second
      value: "1,50,100"

    - name: GUIDELLM_DATA
      # DEFAULT: "prompt_tokens=1000,output_tokens=1000"
      # Request data profile
      # Format: prompt_tokens=N,output_tokens=M
      # Or use dataset name: "emulated:prompt_tokens=1000,output_tokens=1000"
      value: "prompt_tokens=1000,output_tokens=1000"

    - name: GUIDELLM_MAX_SECONDS
      # DEFAULT: "600"
      # Maximum duration per rate in seconds
      # Set lower for quick tests, higher for stable measurements
      value: 100"

    - name: GUIDELLM_MAX_REQUESTS
      # DEFAULT: "" (unlimited)
      # Maximum number of requests per rate
      # Leave empty for time-based runs
      value: ""

    # ===========================================
    # MLflow Configuration
    # ===========================================
    - name: MLFLOW_ENABLED
      # DEFAULT: "false"
      # Enable MLflow experiment tracking
      # Requires MLflow server and mlflow-auth secret
      value: "true"

    - name: MLFLOW_EXPERIMENT_NAME
      # DEFAULT: "guidellm-benchmarks"
      # MLflow experiment name
      value: "qwen-qwen3-06b"

    - name: VERSION
      # DEFAULT: "" (empty)
      # Version identifier for visualization reports
      # Useful for comparing different configurations
      value: "RHOAI-3.0"

    - name: ACCELERATOR
      # DEFAULT: "" (empty)
      # GPU/accelerator type tag for MLflow
      # Examples: "H100", "H200", "A100-80GB", "L40S"
      value: "H200"

    - name: MLFLOW_TAGS
      # DEFAULT: []
      # Additional tags as array of key=value pairs
      # Recorded in MLflow for filtering/grouping
      value:
        - "deployment=RHOAI"

    - name: BENCHMARK_ENV_VARS
      # DEFAULT: []
      # Additional environment variables for benchmark container
      # Format: ["VAR1=value1", "VAR2=value2"]
      value: []

    # ===========================================
    # MLPerf Benchmark Parameters
    # (Only used when IMAGE contains 'mlperf')
    # ===========================================
    - name: MLPERF_DATASET_NAME
      # DEFAULT: "cnn_eval.json"
      # Dataset filename in /mlperf-data/ PVC mount
      value: "cnn_eval.json"

    - name: MLPERF_SCENARIO
      # DEFAULT: "Offline"
      # Options: "Offline", "Server", "SingleStream", "MultiStream"
      value: "Offline"

    - name: MLPERF_TEST_MODE
      # DEFAULT: "accuracy"
      # Options: "accuracy", "performance"
      value: "accuracy"

    - name: MLPERF_BATCH_SIZE
      # DEFAULT: "" (auto)
      # Batch size for MLPerf
      value: ""

    - name: MLPERF_NUM_SAMPLES
      # DEFAULT: "4388"
      # Number of samples to process
      value: "4388"

    - name: MLPERF_OUTPUT_DIR
      # DEFAULT: "./test-run"
      # Output directory for MLPerf results
      value: "./test-run"

    - name: MLPERF_SERVER_TARGET_QPS
      # DEFAULT: "10"
      # Target QPS for Server scenario
      value: "10"

    # ===========================================
    # Health Check Configuration
    # ===========================================
    - name: HEALTH_CHECK_TIMEOUT
      # DEFAULT: "3600"
      # Endpoint health check timeout in seconds
      # Increase for large models that take longer to load
      value: "3600"

    # ===========================================
    # Stage Control
    # ===========================================
    - name: SKIP_DOWNLOAD
      # DEFAULT: "false"
      # Skip model download stage (use if model already exists on PVC)
      value: "false"

    - name: SKIP_DEPLOY
      # DEFAULT: "false"
      # Skip deployment stage (use if model already deployed)
      value: "false"

    - name: SKIP_BENCHMARK
      # DEFAULT: "false"
      # Skip benchmark stage (use for deployment-only runs)
      value: "false"

    - name: SKIP_CLEANUP
      # DEFAULT: "false"
      # Skip cleanup stage (keep deployment running after benchmark)
      value: "false"

  # ===========================================
  # Timeouts
  # ===========================================
  timeouts:
    pipeline: "2h"
    tasks: "2h"

  # ===========================================
  # Workspaces
  # ===========================================
  workspaces:
    # Model storage PVC (required)
    # Must be RWX for multi-replica deployments
    # RWO is sufficient for single replica
    - name: models-storage
      persistentVolumeClaim:
        claimName: models-storage

    # Results workspace (optional, only for non-MLflow mode)
    # Use emptyDir for MLflow mode, PVC for file-based results
    - name: results
      emptyDir: {}
