apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: benchmark-run-
  labels:
    app: llm-d-bench
    pipeline: run-benchmark
spec:
  pipelineRef:
    name: run-benchmark

  taskRunTemplate:
    serviceAccountName: deploy-model-sa

  ttlSecondsAfterFinished: 3600

  params:
    - name: BENCHMARK_CONFIG
      value: "concurrent-1k-1k"

    - name: TARGET
      value: "https://inference-gateway.apps.example.com/llm-d-bench/my-model"
    - name: MODEL
      value: "meta-llama/Llama-3.1-8B"

    - name: ACCELERATOR
      value: "H200"
    - name: MLFLOW_EXPERIMENT_NAME
      value: "guidellm-benchmarks"
    - name: VERSION
      value: "RHOAI-3.0"
    - name: TP
      value: "1"

    - name: MLFLOW_ENABLED
      value: "true"
    - name: MLFLOW_TAGS
      value:
        - "llm-d-version=RHOAI 3.0"
        - "team=ai"
