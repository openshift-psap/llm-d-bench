apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: qwen-qwen3-06b-1k-1k-
  labels:
    app: llm-d-bench
    pipeline: downstream-end-to-end-benchmark
    experiment: qwen-qwen3-06b-1k-1k
    benchmark-tool: guidellm
    deployment-mode: rhoai
spec:
  pipelineRef:
    name: rhoai-end-to-end-benchmark

  taskRunTemplate:
    serviceAccountName: deploy-model-sa

  ttlSecondsAfterFinished: 3600

  params:
    - name: MODEL_NAME
      value: "Qwen/Qwen3-0.6B"

    - name: VLLM_CONFIG
      value: "vllm-default"
    - name: DEPLOYMENT_CONFIG
      value: "deployment-rhoai-kserve"
    - name: BENCHMARK_CONFIG
      value: "concurrent-1k-1k"

    - name: ENABLE_AUTH
      value: "false"
    - name: REPLICAS
      value: "1"
    - name: TP
      value: "1"

    - name: ACCELERATOR
      value: "H200"

    - name: MLFLOW_ENABLED
      value: "true"
    - name: MLFLOW_EXPERIMENT_NAME
      value: "qwen-qwen3-06b-1k-1k"
    - name: VERSION
      value: "RHOAI-3.0"
    - name: MLFLOW_TAGS
      value:
        - "deployment=rhoai"
        - "benchmark-tool=guidellm"

  timeouts:
    pipeline: "2h"
    tasks: "2h"

  workspaces:
    - name: models-storage
      persistentVolumeClaim:
        claimName: models-storage

    - name: results
      persistentVolumeClaim:
        claimName: collection-results

    - name: manifests-storage
      emptyDir: {}
