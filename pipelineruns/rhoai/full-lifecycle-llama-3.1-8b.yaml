apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: full-lifecycle-llama-31-8b-
  labels:
    app: llm-d-bench
    pipeline: downstream-end-to-end-benchmark
    model: llama-3.1-8b
    experiment: full-lifecycle-demo
    benchmark-tool: guidellm
    deployment-mode: rhoai
spec:
  pipelineRef:
    name: rhoai-end-to-end-benchmark

  taskRunTemplate:
    serviceAccountName: deploy-model-sa

  ttlSecondsAfterFinished: 3600

  params:
    - name: MODEL_NAME
      value: "meta-llama/Llama-3.1-8B"

    - name: VLLM_CONFIG
      value: "vllm-default"
    - name: DEPLOYMENT_CONFIG
      value: "deployment-rhoai-kserve"
    - name: BENCHMARK_CONFIG
      value: "concurrent-1k-1k"

    - name: VLLM_ARGS
      value:
        - "--max-model-len=8192"
        - "--gpu-memory-utilization=0.9"
    - name: ENABLE_AUTH
      value: "false"
    - name: REPLICAS
      value: "1"
    - name: TP
      value: "1"

    - name: ACCELERATOR
      value: "H200"

    - name: MLFLOW_ENABLED
      value: "false"
    - name: MLFLOW_EXPERIMENT_NAME
      value: "llama-3.1-8b-full-lifecycle"
    - name: VERSION
      value: ""
    - name: MLFLOW_TAGS
      value:
        - "deployment=rhoai"
        - "benchmark-tool=guidellm"

  timeouts:
    pipeline: "2h"
    tasks: "2h"

  workspaces:
    - name: models-storage
      persistentVolumeClaim:
        claimName: models-storage
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi

    - name: results
      persistentVolumeClaim:
        claimName: benchmark-results
