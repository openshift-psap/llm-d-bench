apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: redhatai-llama-33-70b-instruct-fp8-dynamic-1k-1k-
  labels:
    app: llm-d-bench
    pipeline: downstream-end-to-end-benchmark
    experiment: redhatai-llama-33-70b-instruct-fp8-dynamic-1k-1k
    benchmark-tool: guidellm
    deployment-mode: rhoai
spec:
  pipelineRef:
    name: rhoai-end-to-end-benchmark-prefix-cache

  taskRunTemplate:
    serviceAccountName: deploy-model-sa

  ttlSecondsAfterFinished: 3600

  params:
    # - name: SKIP_BENCHMARK
    #   value: "true"
    - name: SKIP_CLEANUP
      value: "true"

    - name: MODEL_NAME
      value: "RedHatAI/Llama-3.3-70B-Instruct-FP8-dynamic"

    - name: VLLM_CONFIG
      # value: "vllm-prefix-caching-long"
      value: "vllm-prefix-caching"
    - name: DEPLOYMENT_CONFIG
      # value: "deployment-rhoai-kserve"
      value: "deployment-rhoai-kserve-prefix-cache"
    - name: BENCHMARK_CONFIG
      value: "concurrent-1k-1k"
      # value: "heavy-heterogeneous"
      # value: "multi-turn"

    - name: ENABLE_AUTH
      value: "false"
    - name: REPLICAS
      value: "4"
    - name: TP
      value: "2"

    - name: ACCELERATOR
      value: "H200"
    - name: BENCHMARK_ENV_VARS
      value:
        # - "GUIDELLM__MAX_WORKER_PROCESSES=100"
        - "GUIDELLM__LOGGING__CONSOLE_LOG_LEVEL=DEBUG"
        # - "MULTITURN=true"

    - name: MLFLOW_ENABLED
      value: "true"
    - name: MLFLOW_EXPERIMENT_NAME
      value: "redhatai-llama-33-70b-instruct-fp8-dynamic-1k-1k"
      # value: "redhatai-llama-33-70b-instruct-fp8-dynamic-heavy-heterogeneous"
      # value: "redhatai-llama-33-70b-instruct-fp8-dynamic-multiturn"
    - name: VERSION
      value: "RHOAI-3.3-RC3"
    - name: MLFLOW_TAGS
      value:
        - "deployment=rhoai"
        - "benchmark-tool=guidellm"
        - "epp=precise-prefix-caching"

  timeouts:
    pipeline: "2h"
    tasks: "2h"

  workspaces:
    - name: models-storage
      persistentVolumeClaim:
        claimName: models-storage

    - name: results
      persistentVolumeClaim:
        claimName: collection-results

    - name: manifests-storage
      emptyDir: {}
