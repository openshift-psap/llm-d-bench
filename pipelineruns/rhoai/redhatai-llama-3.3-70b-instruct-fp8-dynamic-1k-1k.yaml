apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: redhatai-llama-33-70b-instruct-fp8-dynamic-1k-1k-
  labels:
    app: llm-d-bench
    pipeline: downstream-end-to-end-benchmark
    experiment: redhatai-llama-33-70b-instruct-fp8-dynamic-1k-1k
spec:
  pipelineRef:
    name: rhoai-end-to-end-benchmark

  # Use service account with permissions for LLMInferenceService resources
  taskRunTemplate:
    serviceAccountName: deploy-model-sa
    podTemplate:
      labels:
        # Kueue integration for GPU quota management
        kueue.x-k8s.io/queue-name: psap-releases-queue
        kueue.x-k8s.io/priority-class: psap-releases

  # Automatically clean up completed PipelineRun after 1 hour
  ttlSecondsAfterFinished: 3600

  params:
    # Model Configuration
    - name: MODEL_NAME
      value: "RedHatAI/Llama-3.3-70B-Instruct-FP8-dynamic"
    - name: MODEL_REVISION
      value: "main"

    # Deployment Configuration
    - name: NAMESPACE
      value: "llm-d-bench"
    - name: VLLM_ARGS
      value:
        - "--max-model-len=8192"
        - "--uvicorn-log-level=debug" 
        - "--trust-remote-code"
        - "--gpu-memory-utilization=0.92"
        - "--no-enable-prefix-caching"
        - "--disable-log-requests"
    - name: ENABLE_AUTH
      value: "false"
    - name: REPLICAS
      value: "1"

    # Benchmark Configuration
    - name: IMAGE
      value: "image-registry.openshift-image-registry.svc:5000/llm-d-bench/guidellm-custom:latest"
    - name: TARGET
      value: "https://redhatai-llama-33-70b-instruct-fp8-dynamic-kserve-workload-svc.llm-d-bench.svc.cluster.local:8000"
    - name: GUIDELLM_PROCESSOR
      value: "RedHatAI/Llama-3.3-70B-Instruct-FP8-dynamic"
    - name: GUIDELLM_BACKEND_TYPE
      value: "openai_http"
    - name: GUIDELLM_RATE_TYPE
      value: "concurrent"
    - name: GUIDELLM_RATE
      value: "650,500,300,200,100,50,1"
    - name: GUIDELLM_DATA
      value: "prompt_tokens=1000,output_tokens=1000"
    - name: GUIDELLM_MAX_SECONDS
      value: "600"
    - name: GUIDELLM_MAX_REQUESTS
      value: ""
    - name: ACCELERATOR
      value: "H200"
    - name: MLFLOW_EXPERIMENT_NAME
      value: "redhatai-llama-33-70b-instruct-fp8-dynamic-1k-1k"
    - name: VERSION
      value: "RHOAI-3.0"
    - name: TP
      value: "4"
    - name: BENCHMARK_ENV_VARS
      value:
        - "GUIDELLM__MAX_WORKER_PROCESSES=100"

    # MLflow Configuration
    - name: MLFLOW_ENABLED
      value: "true"
    - name: MLFLOW_TAGS
      value:
        - "llm-d-version=RHOAI-3.0"

    # Health Check Configuration
    - name: HEALTH_CHECK_TIMEOUT
      value: "3600"

    # Stage Control - skip download, enable deploy/benchmark/cleanup
    - name: SKIP_DOWNLOAD
      value: "false"
    - name: SKIP_DEPLOY
      value: "false"
    - name: SKIP_BENCHMARK
      value: "false"
    - name: SKIP_CLEANUP
      value: "false"

  timeouts:
    pipeline: "2h"
    tasks: "2h"

  workspaces:
    - name: models-storage
      persistentVolumeClaim:
        claimName: models-storage
