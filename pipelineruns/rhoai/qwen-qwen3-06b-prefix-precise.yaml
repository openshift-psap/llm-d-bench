# ===========================================
# RHOAI Benchmark - Qwen3-0.6B - Precise Prefix Caching
# ===========================================
# Test scenario 3: EPP with prefix-cache-scorer
# Uses hash-based prefix matching for precise KV cache sharing
#
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: qwen-qwen3-06b-prefix-precise-
  labels:
    app: llm-d-bench
    pipeline: rhoai-end-to-end-benchmark
    experiment: qwen-qwen3-06b-prefix-precise
    benchmark-tool: guidellm
    deployment-mode: rhoai
    routing-mode: prefix-precise
spec:
  pipelineRef:
    name: rhoai-end-to-end-benchmark

  taskRunTemplate:
    serviceAccountName: deploy-model-sa

  params:
    # Model Configuration
    - name: MODEL_NAME
      value: "Qwen/Qwen3-0.6B"
    - name: MODEL_REVISION
      value: "main"

    # Deployment Configuration
    - name: NAMESPACE
      value: "llm-d-bench"
    - name: REPLICAS
      value: "1"
    - name: TP
      value: "4"
    - name: ENABLE_AUTH
      value: "false"
    - name: KUEUE_QUEUE_NAME
      value: "psap-releases"
    - name: VLLM_ARGS
      value:
        - "--max-model-len=8192"
        - "--gpu-memory-utilization=0.95"

    # vLLM Image
    - name: DEPLOYMENT_IMAGE
      value: "quay.io/aipcc/rhaiis/cuda-ubi9:3.3.0-1769597087"
      
    # Routing Mode - PREFIX-PRECISE (EPP with prefix-cache-scorer)
    - name: ROUTING_MODE
      value: "prefix-precise"
    - name: GATEWAY_NAME
      value: "openshift-ai-inference"
    - name: GATEWAY_NAMESPACE
      value: "openshift-ingress"

    # Benchmark Configuration
    - name: IMAGE
      value: "image-registry.openshift-image-registry.svc:5000/llm-d-bench/guidellm-custom:v0.5.3"
    # TARGET is now auto-derived from deployment task results
    - name: GUIDELLM_PROCESSOR
      value: "Qwen/Qwen3-0.6B"
    - name: GUIDELLM_BACKEND_TYPE
      value: "openai_http"
    - name: GUIDELLM_RATE_TYPE
      value: "concurrent"
    - name: GUIDELLM_RATE
      value: "1,50,100,200"
    - name: GUIDELLM_DATA
      value: "prompt_tokens=1000,output_tokens=1000"
    - name: GUIDELLM_MAX_SECONDS
      value: "60"
    - name: GUIDELLM_MAX_REQUESTS
      value: ""

    # MLflow Configuration
    - name: MLFLOW_ENABLED
      value: "true"
    - name: MLFLOW_EXPERIMENT_NAME
      value: "qwen-qwen3-06b-routing-comparison"
    - name: VERSION
      value: "RHOAI-3.2"
    - name: ACCELERATOR
      value: "H200"
    - name: MLFLOW_TAGS
      value:
        - "deployment=RHOAI"
        - "routing-mode=prefix-precise"
        - "epp-scorer=prefix-aware"

    # Health Check
    - name: HEALTH_CHECK_TIMEOUT
      value: "3600"

    # Stage Control
    - name: SKIP_DOWNLOAD
      value: "true"
    - name: SKIP_DEPLOY
      value: "false"
    - name: SKIP_BENCHMARK
      value: "false"
    - name: SKIP_CLEANUP
      value: "false"

  timeouts:
    pipeline: "2h"
    tasks: "2h"

  workspaces:
    - name: models-storage
      persistentVolumeClaim:
        claimName: models-storage
    - name: results
      emptyDir: {}
