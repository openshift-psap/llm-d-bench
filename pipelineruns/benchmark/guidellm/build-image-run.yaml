apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: build-guidellm-image-
  labels:
    app: llm-d-bench
    pipeline: build-image
spec:
  pipelineRef:
    name: guidellm-build-image

  # Automatically clean up completed PipelineRun after 1 hour
  ttlSecondsAfterFinished: 3600

  params:
    - name: GIT_URL
      value: "https://github.com/openshift-psap/llm-d-bench.git"
    - name: GIT_REVISION
      value: "main"
    - name: IMAGE_NAME
      value: "guidellm-custom"
    - name: IMAGE_TAG
      value: "latest"
    - name: REGISTRY
      value: "image-registry.openshift-image-registry.svc:5000"
    - name: NAMESPACE
      value: "llm-d-bench"
    - name: GUIDELLM_VERSION
      value: "v0.3.1"

  timeouts:
    pipeline: "2h"
    tasks: "2h"

  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi
