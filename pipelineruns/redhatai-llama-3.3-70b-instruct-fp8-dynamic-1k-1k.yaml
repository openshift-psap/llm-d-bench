apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: redhatai-llama-33-70b-instruct-fp8-dynamic-1k-1k-
  labels:
    app: llm-d-tekton
    pipeline: run-benchmark
    experiment: redhatai-llama-33-70b-instruct-fp8-dynamic-1k-1k
spec:
  pipelineRef:
    name: run-benchmark

  params:
    # Image configuration
    - name: IMAGE
      value: "image-registry.openshift-image-registry.svc:5000/downstream-llm-d/guidellm-custom:latest"

    # Target and model
    - name: TARGET
      value: "https://redhatai-llama-33-70b-instruct-fp8-dynamic-kserve-workload-svc.downstream-llm-d.svc.cluster.local:8000"
    - name: MODEL
      value: "RedHatAI/Llama-3.3-70B-Instruct-FP8-dynamic"
    - name: PROCESSOR
      value: "RedHatAI/Llama-3.3-70B-Instruct-FP8-dynamic"

    # Benchmark configuration
    - name: BACKEND_TYPE
      value: "openai_http"
    - name: RATE_TYPE
      value: "concurrent"
    - name: RATE
      value: "1"
    - name: DATA
      value: "prompt_tokens=1000,output_tokens=1000"
    - name: MAX_SECONDS
      value: "600"
    - name: ACCELERATOR
      value: "H200"

    # MLflow configuration
    - name: MLFLOW_ENABLED
      value: "true"
    - name: MLFLOW_TRACKING_URI
      value: "https://mlflow-mlflow.apps.aperdomo-lab.ibm.rhperfscale.org"
    - name: EXPERIMENT_NAME
      value: "guidellm-benchmarks"
    - name: TAGS
      value: '{"llm-d-version":"RHOAI 3.0"}'

    # Visualization configuration
    - name: VERSION
      value: "RHOAI-3.0"
    - name: TP
      value: "4"

    # Health check
    - name: SKIP_HEALTH_CHECK
      value: "false"
    - name: HEALTH_CHECK_TIMEOUT
      value: "3600"
