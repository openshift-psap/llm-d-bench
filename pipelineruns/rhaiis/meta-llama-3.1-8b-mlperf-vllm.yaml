apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: meta-llama-31-8b-mlperf-
  labels:
    app: llm-d-bench
    pipeline: rhaiis-end-to-end-benchmark
    experiment: meta-llama-31-8b-mlperf
    benchmark-tool: mlperf
    deployment-mode: rhaiis
spec:
  pipelineRef:
    name: rhaiis-end-to-end-benchmark

  taskRunTemplate:
    serviceAccountName: deploy-model-sa

  ttlSecondsAfterFinished: 3600

  params:
    - name: MODEL_NAME
      value: "RedHatAI/Meta-Llama-3.1-8B-Instruct-FP8"

    - name: VLLM_CONFIG
      value: "vllm-default"
    - name: DEPLOYMENT_CONFIG
      value: "deployment-rhaiis-vllm-pod"
    - name: BENCHMARK_CONFIG
      value: "mlperf-server"

    - name: VLLM_ARGS
      value:
        - "--max-model-len=131072"
        - "--gpu-memory-utilization=0.91"
        - "--disable-log-requests"
        - "--max-num-batched-tokens=1024"
        - "--max-num-seqs=512"
    - name: REPLICAS
      value: "1"
    - name: TP
      value: "1"

    - name: MLPERF_SERVER_TARGET_QPS
      value: "20"

    - name: ACCELERATOR
      value: "H200"

    - name: MLFLOW_ENABLED
      value: "true"
    - name: MLFLOW_EXPERIMENT_NAME
      value: "meta-llama-31-8b-mlperf"
    - name: VERSION
      value: "llm-d-0.4"
    - name: MLFLOW_TAGS
      value:
        - "deployment=rhaiis"
        - "benchmark-tool=mlperf"

  timeouts:
    pipeline: "2h"
    tasks: "2h"

  workspaces:
    - name: models-storage
      persistentVolumeClaim:
        claimName: models-storage
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi

    - name: results
      emptyDir: {}
