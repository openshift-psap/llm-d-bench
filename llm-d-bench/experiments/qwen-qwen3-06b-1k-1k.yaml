# Qwen/Qwen3-0.6B Benchmark Experiment with Deployment
namespace: downstream-llm-d

deploy: true

benchmark:
  name: qwen-qwen3-06b-1k-1k

  tags:
    llm-d-version: placeholder

  image:
    repository: "image-registry.openshift-image-registry.svc:5000/downstream-llm-d/guidellm-custom"
    tag: "latest"
    pullPolicy: Always

  affinity: null

  # target: https://{{ .Values.benchmark.name }}-kserve-workload-svc.{{ .Values.namespace }}.svc.cluster.local:8000

  model: Qwen/Qwen3-0.6B
  processor: Qwen/Qwen3-0.6B

  rateType: concurrent
  rate: "1,5,20"
  data: "prompt_tokens=1000,output_tokens=1000"
  maxSeconds: "60"
  accelerator: "H200"
  tp: 1

  env:
    GUIDELLM__REQUEST_TIMEOUT: "1000"
    GUIDELLM__LOGGING__CONSOLE_LOG_LEVEL: "INFO"
  
mlflow:
  enabled: true
  trackingUri: "https://mlflow-mlflow.apps.aperdomo-lab.ibm.rhperfscale.org"
  # Authentication secret (must exist in the same namespace!)
  auth:
    secretName: "mlflow-ui-auth"
    usernameKey: "username"
    passwordKey: "password"
  # S3 credentials for MLflow artifact store
  s3:
    # Secret name containing S3 credentials
    secretName: "mlflow-s3-secret"
    # Keys in the secret for S3 credentials
    accessKey: "access-key"
    secretKey: "secret-key"
    bucketNameKey: "bucket-name"
    regionKey: "region"

kueue:
  enabled: false
