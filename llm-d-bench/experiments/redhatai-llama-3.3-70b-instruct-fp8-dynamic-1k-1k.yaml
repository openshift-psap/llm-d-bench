# RedHatAI/Llama-3.3-70B-Instruct-FP8-dynamic Benchmark Experiment
namespace: downstream-llm-d

deploy: true

benchmark:
  name: redhatai-llama-33-70b-instruct-fp8-dynamic-1k-1k

  tags:
    llm-d-version: RHOAI 3.0
    # tag to mark "golden" runs - ones to be consumed by the perf dashboard
    # golden: true

  image:
    repository: "image-registry.openshift-image-registry.svc:5000/downstream-llm-d/guidellm-custom"
    tag: "latest"
    pullPolicy: Always

  affinity: null

  model: RedHatAI/Llama-3.3-70B-Instruct-FP8-dynamic
  processor: RedHatAI/Llama-3.3-70B-Instruct-FP8-dynamic

  rateType: concurrent
  rate: "1,50,100,150,200,300,400,500,650"
  data: "prompt_tokens=1000,output_tokens=1000"
  maxSeconds: "600"
  accelerator: "H200"
  tp: 4

  vllmArgs:
    - "--max-model-len=8192"
    - "--uvicorn-log-level=debug" 
    - "--trust-remote-code"
    - "--gpu-memory-utilization=0.92"
    - "--no-enable-prefix-caching"
    - "--disable-log-requests"

  env:
    GUIDELLM__REQUEST_TIMEOUT: "6000"
    GUIDELLM__LOGGING__CONSOLE_LOG_LEVEL: "INFO"
  
mlflow:
  enabled: true
  trackingUri: "https://mlflow-mlflow.apps.aperdomo-lab.ibm.rhperfscale.org"
  # Authentication secret (must exist in the same namespace!)
  auth:
    secretName: "mlflow-ui-auth"
    usernameKey: "username"
    passwordKey: "password"
  # S3 credentials for MLflow artifact store
  s3:
    # Secret name containing S3 credentials
    secretName: "mlflow-s3-secret"
    # Keys in the secret for S3 credentials
    accessKey: "access-key"
    secretKey: "secret-key"
    bucketNameKey: "bucket-name"
    regionKey: "region"

kueue:
  enabled: false
