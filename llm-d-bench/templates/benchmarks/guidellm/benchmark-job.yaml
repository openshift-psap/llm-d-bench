{{- if eq .Values.benchmarkTool "guidellm" }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.benchmark.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: llm-d-bench
    job-type: benchmark
    {{- if .Values.kueue.enabled }}
    kueue.x-k-s.io/queue-name: "{{ .Values.kueue.queueName }}"
    {{- end }}
spec:
  {{- if .Values.kueue.enabled }}
  suspend: true
  {{- end }}
  template:
    metadata:
      labels:
        app: llm-d-bench
        job: {{ .Values.benchmark.name }}
    spec:
      initContainers:
      - name: wait-for-inference
        image: registry.access.redhat.com/ubi9/ubi:latest
        command: ['/bin/bash', '-c']
        args:
        - |
          echo "Waiting for LLMInferenceService..."
          {{- if .Values.benchmark.target }}
          TARGET="{{ .Values.benchmark.target }}/v1/models"
          {{- else }}
          TARGET="https://{{ include "model.serviceName" . }}-kserve-workload-svc.{{ .Values.namespace }}.svc.cluster.local:8000/v1/models"
          {{- end }}
          until curl -k -s -f -o /dev/null "$TARGET"; do
            echo "Waiting for 200 OK from $TARGET..."
            sleep 10
          done
          echo "Model is UP!"

      containers:
      - name: guidellm
        image: {{ include "benchmark.image" . | quote }}
        imagePullPolicy: {{ .Values.benchmark.image.pullPolicy | quote }}
        workingDir: /tmp
        {{- if not .Values.mlflow.enabled }}
        volumeMounts:
        - name: benchmark-results
          mountPath: /benchmark-results
        {{- end }}
        args:
          - "--target"
          {{- if .Values.benchmark.target }}
          - "{{ .Values.benchmark.target }}" 
          {{- else}}
          - "https://{{ include "model.serviceName" . }}-kserve-workload-svc.{{ .Values.namespace }}.svc.cluster.local:8000"
          {{- end}}
          {{- if .Values.benchmark.model }}
          - "--model"
          - "{{ .Values.benchmark.model }}"
          {{- end }}
          {{- if .Values.benchmark.processor }}
          - "--processor"
          - "{{ .Values.benchmark.processor }}"
          {{- end }}
          {{- if .Values.benchmark.rateType }}
          - "--rate-type"
          - "{{ .Values.benchmark.rateType }}"
          {{- end }}
          {{- if .Values.benchmark.rate }}
          - "--rate"
          - "{{ if kindIs "slice" .Values.benchmark.rate }}{{ join "," .Values.benchmark.rate }}{{ else }}{{ .Values.benchmark.rate }}{{ end }}"
          {{- end }}
          {{- if .Values.benchmark.data }}
          - "--data"
          - "{{ if kindIs "slice" .Values.benchmark.data }}{{ join "," .Values.benchmark.data }}{{ else }}{{ .Values.benchmark.data }}{{ end }}"
          {{- end }}
          {{- if .Values.benchmark.maxSeconds }}
          - "--max-seconds"
          - "{{ .Values.benchmark.maxSeconds }}"
          {{- end }}
          {{- if .Values.benchmark.accelerator }}
          - "--accelerator"
          - "{{ .Values.benchmark.accelerator }}"
          {{- end }}
          {{- if .Values.benchmark.name }}
          - "--experiment-name"
          - "{{ .Values.benchmark.name }}"
          {{- end}}
          {{- range $key, $value := .Values.benchmark.tags }}
          - "--tag"
          - "{{ $key }}={{ $value }}"
          {{- end }}
          {{- if .Values.benchmark.additionalArgs }}
          - "{{ .Values.benchmark.additionalArgs }}"
          {{- end }}
        env:
          - name: HF_HOME
            value: "/tmp/.huggingface"
          - name: HF_CLI_TOKEN
            valueFrom:
              secretKeyRef:
                name: huggingface-token
                key: HF_CLI_TOKEN
          {{- if .Values.mlflow.enabled }}
          - name: MLFLOW_ENABLED
            value: "true"
          - name: MLFLOW_TRACKING_INSECURE_TLS
            value: "true"
          - name: MLFLOW_TRACKING_URI
            value: {{ .Values.mlflow.trackingUri | quote }}
          - name: MLFLOW_TRACKING_USERNAME
            valueFrom:
              secretKeyRef:
                name: {{ .Values.mlflow.auth.secretName }}
                key: {{ .Values.mlflow.auth.usernameKey }}
          - name: MLFLOW_TRACKING_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ .Values.mlflow.auth.secretName }}
                key: {{ .Values.mlflow.auth.passwordKey }}
          - name: MLFLOW_EXPERIMENT_NAME
            value: {{ .Values.benchmark.name | quote }}
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: {{ .Values.mlflow.s3.secretName }}
                key: {{ .Values.mlflow.s3.accessKey }}
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: {{ .Values.mlflow.s3.secretName }}
                key: {{ .Values.mlflow.s3.secretKey }}
          - name: AWS_REGION
            valueFrom:
              secretKeyRef:
                name: {{ .Values.mlflow.s3.secretName }}
                key: {{ .Values.mlflow.s3.regionKey }}
          - name: MLFLOW_S3_BUCKET_NAME
            valueFrom:
              secretKeyRef:
                name: {{ .Values.mlflow.s3.secretName }}
                key: {{ .Values.mlflow.s3.bucketNameKey }}
          {{- else }}
          - name: MLFLOW_ENABLED
            value: "false"
          {{- end }}
          {{- range $key, $value := .Values.benchmark.env }}
          - name: {{ $key }}
            value: {{ $value | quote }}
          {{- end }}
        resources:
          requests:
            memory: "8Gi"
            cpu: "500m"
          limits:
            memory: "10Gi"
            cpu: "1000m"
      {{- if not .Values.mlflow.enabled }}
      volumes:
      - name: benchmark-results
        persistentVolumeClaim:
          claimName: {{ .Values.benchmark.name }}-results
      {{- end }}
      restartPolicy: Never
      {{- if .Values.benchmark.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.benchmark.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.benchmark.affinity }}
      affinity:
        {{- toYaml .Values.benchmark.affinity | nindent 8 }}
      {{- end }}
  backoffLimit: 1
{{- end }}