apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: generate-run-uuid
  annotations:
    tekton.dev/displayName: "Generate Run UUID"
    tekton.dev/categories: "Common"
    tekton.dev/tags: "uuid,tracking"
spec:
  description: |
    Generate unique identifiers for the pipeline run.
    - Full UUID for MLflow tracking and correlation
    - Short 5-char suffix for Kubernetes resource names (length limits)

  results:
    - name: RUN_UUID
      description: Full UUID for MLflow tracking (36 characters)
    - name: RUN_UUID_SHORT
      description: Short 5-character suffix for K8s resource names
    - name: RUN_TIMESTAMP
      description: ISO timestamp for the run start

  steps:
    - name: generate
      image: registry.redhat.io/openshift4/ose-cli:latest
      script: |
        #!/bin/bash
        set -e

        # Generate full UUID (using /proc/sys/kernel/random/uuid if available, else fallback)
        if [ -f /proc/sys/kernel/random/uuid ]; then
          RUN_UUID=$(cat /proc/sys/kernel/random/uuid)
        else
          # Fallback: generate UUID-like string from urandom
          RUN_UUID=$(head /dev/urandom | tr -dc 'a-f0-9' | head -c 32 | sed 's/\(.\{8\}\)\(.\{4\}\)\(.\{4\}\)\(.\{4\}\)\(.\{12\}\)/\1-\2-\3-\4-\5/')
        fi

        # Short version for K8s names (last 5 chars of UUID without dashes)
        RUN_UUID_SHORT=$(echo "$RUN_UUID" | tr -d '-' | tail -c 6 | head -c 5)

        RUN_TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

        printf "%s" "$RUN_UUID" > $(results.RUN_UUID.path)
        printf "%s" "$RUN_UUID_SHORT" > $(results.RUN_UUID_SHORT.path)
        printf "%s" "$RUN_TIMESTAMP" > $(results.RUN_TIMESTAMP.path)

        echo "============================================"
        echo "Pipeline Run Tracking"
        echo "============================================"
        echo "Full UUID:  $RUN_UUID"
        echo "Short UUID: $RUN_UUID_SHORT"
        echo "Timestamp:  $RUN_TIMESTAMP"
        echo "============================================"
        echo ""
        echo "Full UUID used for:"
        echo "  - MLflow run tagging and correlation"
        echo "  - Artifact collection and upload"
        echo ""
        echo "Short UUID used for:"
        echo "  - Kubernetes deployment names"
        echo "  - Pod naming (K8s length limits)"
        echo "============================================"
