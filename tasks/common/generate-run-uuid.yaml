apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: generate-run-uuid
  annotations:
    tekton.dev/displayName: "Generate Run UUID"
    tekton.dev/categories: "Common"
    tekton.dev/tags: "uuid,tracking"
spec:
  description: |
    Generate unique identifiers for pipeline run tracking.
    - Full UUID: Standard UUID for MLflow tracking and correlation
    - Short UUID: First 5 characters of full UUID for K8s resource names

  results:
    - name: RUN_UUID
      description: Full UUID for MLflow tracking (36 characters)
    - name: RUN_UUID_SHORT
      description: First 5 characters of UUID for K8s resource names
    - name: RUN_TIMESTAMP
      description: ISO timestamp for the run start

  steps:
    - name: generate
      image: registry.redhat.io/openshift4/ose-cli:latest
      script: |
        #!/bin/bash
        set -e

        # Generate full UUID
        RUN_UUID=$(cat /proc/sys/kernel/random/uuid)

        # Short UUID is first 5 characters of full UUID
        RUN_UUID_SHORT=$(echo "$RUN_UUID" | cut -c1-5)

        RUN_TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

        printf "%s" "$RUN_UUID" > $(results.RUN_UUID.path)
        printf "%s" "$RUN_UUID_SHORT" > $(results.RUN_UUID_SHORT.path)
        printf "%s" "$RUN_TIMESTAMP" > $(results.RUN_TIMESTAMP.path)

        echo "============================================"
        echo "Pipeline Run Tracking"
        echo "============================================"
        echo "Full UUID:    $RUN_UUID"
        echo "Short UUID:   $RUN_UUID_SHORT"
        echo "Timestamp:    $RUN_TIMESTAMP"
        echo "============================================"
        echo ""
        echo "Full UUID used for:"
        echo "  - MLflow run tagging and correlation"
        echo "  - Artifact collection and upload"
        echo ""
        echo "Short UUID used for:"
        echo "  - Kubernetes deployment names (e.g., model-name-$RUN_UUID_SHORT)"
        echo "  - Correlates directly with full UUID"
        echo "============================================"
