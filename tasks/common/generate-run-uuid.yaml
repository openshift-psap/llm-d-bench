apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: generate-run-uuid
  annotations:
    tekton.dev/displayName: "Generate Run UUID"
    tekton.dev/categories: "Common"
    tekton.dev/tags: "uuid,tracking"
spec:
  description: |
    Extract unique identifiers from the PipelineRun for tracking.
    Uses Tekton's built-in PipelineRun identifiers for consistent correlation.
    - Full UUID: PipelineRun's Kubernetes UID
    - Short UUID: Suffix from PipelineRun name (e.g., 'v4xw4' from 'example-v4xw4')

  params:
    - name: PIPELINERUN_NAME
      description: Name of the PipelineRun (use context.pipelineRun.name)
      type: string
    - name: PIPELINERUN_UID
      description: UID of the PipelineRun (use context.pipelineRun.uid)
      type: string

  results:
    - name: RUN_UUID
      description: Full UUID (PipelineRun UID) for MLflow tracking
    - name: RUN_UUID_SHORT
      description: Short suffix from PipelineRun name for K8s resource names
    - name: RUN_TIMESTAMP
      description: ISO timestamp for the run start
    - name: PIPELINERUN_NAME
      description: Full PipelineRun name for reference

  steps:
    - name: extract-ids
      image: registry.redhat.io/openshift4/ose-cli:latest
      script: |
        #!/bin/bash
        set -e

        PIPELINERUN_NAME="$(params.PIPELINERUN_NAME)"
        PIPELINERUN_UID="$(params.PIPELINERUN_UID)"

        # Full UUID is the PipelineRun's Kubernetes UID
        RUN_UUID="$PIPELINERUN_UID"

        # Short UUID is the suffix from PipelineRun name (after last dash)
        RUN_UUID_SHORT=$(echo "$PIPELINERUN_NAME" | rev | cut -d'-' -f1 | rev)

        RUN_TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

        printf "%s" "$RUN_UUID" > $(results.RUN_UUID.path)
        printf "%s" "$RUN_UUID_SHORT" > $(results.RUN_UUID_SHORT.path)
        printf "%s" "$RUN_TIMESTAMP" > $(results.RUN_TIMESTAMP.path)
        printf "%s" "$PIPELINERUN_NAME" > $(results.PIPELINERUN_NAME.path)

        echo "============================================"
        echo "Pipeline Run Tracking"
        echo "============================================"
        echo "PipelineRun:  $PIPELINERUN_NAME"
        echo "Full UUID:    $RUN_UUID"
        echo "Short UUID:   $RUN_UUID_SHORT"
        echo "Timestamp:    $RUN_TIMESTAMP"
        echo "============================================"
        echo ""
        echo "Full UUID used for:"
        echo "  - MLflow run tagging and correlation"
        echo "  - Artifact collection and upload"
        echo ""
        echo "Short UUID used for:"
        echo "  - Kubernetes deployment names"
        echo "  - Pod naming (matches PipelineRun suffix)"
        echo "============================================"
