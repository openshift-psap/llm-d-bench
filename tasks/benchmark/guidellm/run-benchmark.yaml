apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: run-guidellm-benchmark
  labels:
    app.kubernetes.io/version: "0.1"
  annotations:
    tekton.dev/displayName: "Run GuideLLM Benchmark"
    tekton.dev/tags: benchmark, llm, guidellm
    tekton.dev/platforms: "linux/amd64"
spec:
  description: >-
    Execute a GuideLLM benchmark test against an LLM inference endpoint.
    Supports both MLflow tracking and PVC-based result storage.

  params:
    - name: IMAGE
      description: Full URL of the GuideLLM custom image to use
      type: string

    - name: TARGET
      description: Target inference endpoint URL
      type: string

    - name: MODEL
      description: Model name/identifier
      type: string

    - name: GUIDELLM_PROCESSOR
      description: Tokenizer/processor model name (GuideLLM only, optional)
      type: string
      default: ""

    - name: GUIDELLM_BACKEND_TYPE
      description: Backend type for the inference server (GuideLLM only)
      type: string
      default: "openai_http"

    - name: GUIDELLM_RATE_TYPE
      description: Rate strategy - concurrent or synchronous (GuideLLM only)
      type: string
      default: "concurrent"

    - name: GUIDELLM_RATE
      description: Comma-separated list of rates to test (GuideLLM only, e.g., "1,50,100,200")
      type: string
      default: "1,50,100"

    - name: GUIDELLM_DATA
      description: Request data profile (GuideLLM only, e.g., "prompt_tokens=1000,output_tokens=1000")
      type: string
      default: "prompt_tokens=1000,output_tokens=1000"

    - name: GUIDELLM_MAX_SECONDS
      description: Maximum duration per rate in seconds (GuideLLM only)
      type: string
      default: "600"

    - name: GUIDELLM_MAX_REQUESTS
      description: Maximum number of requests per rate (GuideLLM only, optional)
      type: string
      default: ""

    - name: ACCELERATOR
      description: Accelerator type tag (e.g., H200, A100)
      type: string
      default: ""

    - name: MLFLOW_EXPERIMENT_NAME
      description: MLflow experiment name
      type: string
      default: "guidellm-benchmarks"

    - name: MLFLOW_ENABLED
      description: Enable MLflow tracking (true or false)
      type: string
      default: "false"

    - name: MLFLOW_TAGS
      description: Additional tags as array of key=value pairs (e.g., ["version=3.0", "team=ai"])
      type: array
      default: []

    - name: VERSION
      description: Version identifier for visualization reports (e.g., RHOAI-3.0)
      type: string
      default: ""

    - name: TP
      description: Tensor parallelism size for visualization reports
      type: string
      default: "1"

    - name: REPLICAS
      description: Number of replicas for standard deployment mode
      type: string
      default: ""

    - name: PREFILL_REPLICAS
      description: Number of prefill worker replicas for P/D disaggregation
      type: string
      default: ""

    - name: DECODE_REPLICAS
      description: Number of decode worker replicas for P/D disaggregation
      type: string
      default: ""

    - name: LOG_LEVEL
      description: Logging level (DEBUG, INFO, WARNING, ERROR)
      type: string
      default: "DEBUG"

    - name: BENCHMARK_ENV_VARS
      description: Additional environment variables for the benchmark container as array of name=value pairs
      type: array
      default: []

    - name: PIPELINE_RUN_NAME
      description: PipelineRun name for MLflow run naming and traceability
      type: string
      default: ""

  workspaces:
    - name: results
      description: Workspace for storing benchmark results (only used if MLFLOW_ENABLED=false)
      optional: true

  results:
    - name: mlflow-run-id
      description: MLflow run ID for metrics correlation
    - name: benchmark-start-time
      description: Benchmark start timestamp (ISO8601)
    - name: benchmark-end-time
      description: Benchmark end timestamp (ISO8601)

  steps:
    - name: run-guidellm-benchmark
      image: $(params.IMAGE)
      imagePullPolicy: Always
      workingDir: /tmp
      env:
        - name: MLFLOW_ENABLED
          value: $(params.MLFLOW_ENABLED)
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: huggingface-token
              key: HF_TOKEN
              optional: true
        - name: MLFLOW_TRACKING_USERNAME
          valueFrom:
            secretKeyRef:
              name: mlflow-ui-auth
              key: username
              optional: true
        - name: MLFLOW_TRACKING_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mlflow-ui-auth
              key: password
              optional: true
        - name: MLFLOW_TRACKING_URI
          valueFrom:
            secretKeyRef:
              name: mlflow-ui-auth
              key: tracking-uri
              optional: true
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: mlflow-s3-secret
              key: access-key
              optional: true
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: mlflow-s3-secret
              key: secret-key
              optional: true
        - name: MLFLOW_S3_BUCKET_NAME
          valueFrom:
            secretKeyRef:
              name: mlflow-s3-secret
              key: bucket-name
              optional: true
        - name: AWS_DEFAULT_REGION
          valueFrom:
            secretKeyRef:
              name: mlflow-s3-secret
              key: region
              optional: true
        - name: GUIDELLM__REQUEST_TIMEOUT
          value: "6000"
        - name: GUIDELLM__LOGGING__CONSOLE_LOG_LEVEL
          value: "INFO"
        - name: MLFLOW_TRACKING_INSECURE_TLS
          value: "true"
        - name: LOG_LEVEL
          value: $(params.LOG_LEVEL)
        - name: HF_HOME
          value: /tmp/.huggingface
        - name: PIPELINE_RUN_NAME
          value: $(params.PIPELINE_RUN_NAME)
      args:
        - $(params.BENCHMARK_ENV_VARS[*])
        - "---SEPARATOR---"
        - $(params.MLFLOW_TAGS[*])
      script: |
        #!/bin/bash
        set -e

        # Separate env vars and tags from positional parameters
        ENV_VARS=()
        TAGS_ARRAY=()
        CURRENT="env"

        for arg in "$@"; do
          if [ "$arg" = "---SEPARATOR---" ]; then
            CURRENT="tags"
            continue
          fi

          if [ "$CURRENT" = "env" ]; then
            ENV_VARS+=("$arg")
          else
            TAGS_ARRAY+=("$arg")
          fi
        done

        # Export additional environment variables
        for env_var in "${ENV_VARS[@]}"; do
          if [ -n "$env_var" ]; then
            export "$env_var"
            echo "Exported env var: $env_var"
          fi
        done

        ARGS=(
          --target "$(params.TARGET)"
          --model "$(params.MODEL)"
          --rate "$(params.GUIDELLM_RATE)"
          --backend-type "$(params.GUIDELLM_BACKEND_TYPE)"
          --rate-type "$(params.GUIDELLM_RATE_TYPE)"
        )

        [ -n "$(params.GUIDELLM_PROCESSOR)" ] && ARGS+=(--processor "$(params.GUIDELLM_PROCESSOR)")
        [ -n "$(params.GUIDELLM_DATA)" ] && ARGS+=(--data "$(params.GUIDELLM_DATA)")
        [ -n "$(params.GUIDELLM_MAX_SECONDS)" ] && ARGS+=(--max-seconds "$(params.GUIDELLM_MAX_SECONDS)")
        [ -n "$(params.GUIDELLM_MAX_REQUESTS)" ] && ARGS+=(--max-requests "$(params.GUIDELLM_MAX_REQUESTS)")
        [ -n "$(params.ACCELERATOR)" ] && ARGS+=(--accelerator "$(params.ACCELERATOR)")
        [ -n "$(params.VERSION)" ] && ARGS+=(--version "$(params.VERSION)")
        [ -n "$(params.TP)" ] && ARGS+=(--tp "$(params.TP)")
        [ -n "$(params.REPLICAS)" ] && ARGS+=(--replicas "$(params.REPLICAS)")
        [ -n "$(params.PREFILL_REPLICAS)" ] && ARGS+=(--prefill-replicas "$(params.PREFILL_REPLICAS)")
        [ -n "$(params.DECODE_REPLICAS)" ] && ARGS+=(--decode-replicas "$(params.DECODE_REPLICAS)")

        if [ "$(params.MLFLOW_ENABLED)" = "true" ]; then
          ARGS+=(--experiment-name "$(params.MLFLOW_EXPERIMENT_NAME)")
          [ -n "$MLFLOW_TRACKING_URI" ] && ARGS+=(--mlflow-tracking-uri "$MLFLOW_TRACKING_URI")
        fi

        # Add tags to args
        for tag in "${TAGS_ARRAY[@]}"; do
          if [ -n "$tag" ]; then
            ARGS+=(--tag "$tag")
          fi
        done

        # Record benchmark start time
        START_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        echo "benchmark-start-time:$START_TIME" > /tmp/benchmark_metadata.txt
        echo "Starting benchmark at: $START_TIME"
        echo "Starting benchmark with args: ${ARGS[@]}"

        # Run benchmark and capture output
        set +e
        python3 -m benchmark.main "${ARGS[@]}" 2>&1 | tee /tmp/benchmark_output.log
        BENCHMARK_EXIT_CODE=${PIPESTATUS[0]}
        set -e

        # Record benchmark end time
        END_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        echo "benchmark-end-time:$END_TIME" >> /tmp/benchmark_metadata.txt
        echo "Benchmark completed at: $END_TIME"

        # Extract MLflow run ID from output if MLflow is enabled
        # TODO: Currently assumes benchmark succeeds. If benchmark fails, results won't be
        # emitted and collection tasks in finally block won't have access to run_id or timestamps.
        # Need to implement fallback mechanism (e.g., generate run_id before benchmark starts
        # and emit it even on failure, or query MLflow API to find the run by experiment + tags).
        if [ "$(params.MLFLOW_ENABLED)" = "true" ]; then
          # Try multiple patterns for MLflow run ID extraction
          MLFLOW_RUN_ID=$(
            grep -oP 'Run completed: \K[a-f0-9]{32}' /tmp/benchmark_output.log | tail -1 ||
            grep -oP 'run_id["\s:]+([a-f0-9]{32})' /tmp/benchmark_output.log | grep -oP '[a-f0-9]{32}' | tail -1 ||
            grep -oP 'run\s+([a-f0-9]{32})' /tmp/benchmark_output.log | grep -oP '[a-f0-9]{32}' | tail -1 ||
            grep -oP '[a-f0-9]{32}' /tmp/benchmark_output.log | tail -1 ||
            echo ""
          )
          
          # Validate run ID format (should be 32 hex characters)
          if [ -n "$MLFLOW_RUN_ID" ] && echo "$MLFLOW_RUN_ID" | grep -qE '^[a-f0-9]{32}$'; then
            echo "MLflow Run ID: $MLFLOW_RUN_ID"
            echo -n "$MLFLOW_RUN_ID" > $(results.mlflow-run-id.path)
          else
            echo "⚠ Could not extract valid MLflow run ID from output"
            echo -n "" > $(results.mlflow-run-id.path)
          fi
        else
          echo -n "" > $(results.mlflow-run-id.path)
        fi

        # Write timestamps to results
        echo -n "$START_TIME" > $(results.benchmark-start-time.path)
        echo -n "$END_TIME" > $(results.benchmark-end-time.path)

        # Exit with benchmark exit code
        exit $BENCHMARK_EXIT_CODE

      volumeMounts:
        - name: results-volume
          mountPath: /benchmark-results

  volumes:
    - name: results-volume
      emptyDir: {}

  # Avoid scheduling on GPU nodes
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: nvidia.com/gpu
                operator: DoesNotExist
