apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: run-mlperf-benchmark
  labels:
    app.kubernetes.io/version: "0.1"
  annotations:
    tekton.dev/displayName: "Run MLPerf Benchmark"
    tekton.dev/tags: benchmark, llm, mlperf
    tekton.dev/platforms: "linux/amd64"
spec:
  description: >-
    Execute an MLPerf benchmark test against an LLM inference endpoint.
    Supports both MLflow tracking and dataset-based benchmarking.

  params:
    # Common parameters (shared with GuideLLM)
    - name: IMAGE
      description: Full URL of the MLPerf custom image to use
      type: string

    - name: TARGET
      description: Target inference endpoint URL
      type: string

    - name: MODEL
      description: Model name/identifier
      type: string

    - name: MLFLOW_EXPERIMENT_NAME
      description: MLflow experiment name
      type: string
      default: "mlperf-benchmarks"

    - name: MLFLOW_ENABLED
      description: Enable MLflow tracking (true or false)
      type: string
      default: "false"

    - name: MLFLOW_TAGS
      description: Additional tags as array of key=value pairs
      type: array
      default: []

    - name: VERSION
      description: Version identifier for visualization reports
      type: string
      default: ""

    - name: TP
      description: Tensor parallelism size for visualization reports
      type: string
      default: "1"

    - name: ACCELERATOR
      description: Accelerator type tag (e.g., H200, A100)
      type: string
      default: ""

    - name: BENCHMARK_ENV_VARS
      description: Additional environment variables for the benchmark container
      type: array
      default: []

    # MLPerf-specific parameters
    - name: MLPERF_DATASET_NAME
      description: Dataset filename (MLPerf only, e.g., "cnn_eval.json")
      type: string
      default: "cnn_eval.json"

    - name: MLPERF_SCENARIO
      description: MLPerf scenario - Offline, Server, SingleStream, MultiStream (MLPerf only)
      type: string
      default: "Offline"

    - name: MLPERF_TEST_MODE
      description: MLPerf test mode - accuracy or performance (MLPerf only)
      type: string
      default: "accuracy"

    - name: MLPERF_BATCH_SIZE
      description: Batch size for inference (MLPerf only, optional)
      type: string
      default: ""

    - name: MLPERF_NUM_SAMPLES
      description: Number of samples to process (MLPerf only)
      type: string
      default: "4388"

    - name: MLPERF_OUTPUT_DIR
      description: Output directory for results (MLPerf only)
      type: string
      default: "./test-run"

    - name: MLPERF_SERVER_TARGET_QPS
      description: Target QPS for Server scenario (MLPerf only)
      type: string
      default: "10"

    - name: LOG_LEVEL
      description: Logging level (DEBUG, INFO, WARNING, ERROR)
      type: string
      default: "DEBUG"

  workspaces:
    - name: models-storage
      description: PVC containing datasets at /datasets/ subdirectory
      optional: false

    - name: results
      description: Workspace for storing benchmark results (optional)
      optional: true

  steps:
    - name: run-mlperf-benchmark
      image: $(params.IMAGE)
      workingDir: /tmp
      env:
        - name: MLFLOW_ENABLED
          value: $(params.MLFLOW_ENABLED)
        - name: MLFLOW_TRACKING_USERNAME
          valueFrom:
            secretKeyRef:
              name: mlflow-ui-auth
              key: username
              optional: true
        - name: MLFLOW_TRACKING_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mlflow-ui-auth
              key: password
              optional: true
        - name: MLFLOW_TRACKING_URI
          valueFrom:
            secretKeyRef:
              name: mlflow-ui-auth
              key: tracking-uri
              optional: true
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: mlflow-s3-secret
              key: access-key
              optional: true
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: mlflow-s3-secret
              key: secret-key
              optional: true
        - name: MLFLOW_S3_BUCKET_NAME
          valueFrom:
            secretKeyRef:
              name: mlflow-s3-secret
              key: bucket-name
              optional: true
        - name: AWS_DEFAULT_REGION
          valueFrom:
            secretKeyRef:
              name: mlflow-s3-secret
              key: region
              optional: true
        - name: MLFLOW_TRACKING_INSECURE_TLS
          value: "true"
        - name: LOG_LEVEL
          value: $(params.LOG_LEVEL)
        - name: HF_HOME
          value: /tmp/.huggingface
      args:
        - $(params.BENCHMARK_ENV_VARS[*])
      script: |
        #!/bin/bash
        set -euo pipefail

        # Export additional environment variables
        for env_var in "$@"; do
          if [ -n "$env_var" ]; then
            export "$env_var"
            echo "Exported env var: $env_var"
          fi
        done

        # Construct dataset path
        DATASET_PATH="$(workspaces.models-storage.path)/datasets/$(params.MLPERF_DATASET_NAME)"

        echo "MLPerf Benchmark Configuration"
        echo "==============================="
        echo "Target: $(params.TARGET)"
        echo "Model: $(params.MODEL)"
        echo "Dataset: $DATASET_PATH"
        echo "Scenario: $(params.MLPERF_SCENARIO)"
        echo "Test Mode: $(params.MLPERF_TEST_MODE)"
        echo "Num Samples: $(params.MLPERF_NUM_SAMPLES)"
        echo ""

        # Verify dataset exists
        if [ ! -f "$DATASET_PATH" ]; then
          echo "ERROR: Dataset not found: $DATASET_PATH"
          echo ""
          echo "Available datasets:"
          ls -lh "$(workspaces.models-storage.path)/datasets/" 2>/dev/null || echo "  No datasets directory found"
          echo ""
          echo "To upload datasets, see documentation: docs/ADVANCED.md#mlperf-benchmark-tool"
          exit 1
        fi

        echo "Dataset found: $DATASET_PATH ($(du -h $DATASET_PATH | cut -f1))"
        echo ""

        # Build MLPerf command
        ARGS=(
          --target "$(params.TARGET)"
          --model "$(params.MODEL)"
          --dataset-path "$DATASET_PATH"
          --dataset-name "$(params.MLPERF_DATASET_NAME)"
          --scenario "$(params.MLPERF_SCENARIO)"
          --test-mode "$(params.MLPERF_TEST_MODE)"
          --num-samples "$(params.MLPERF_NUM_SAMPLES)"
          --output-dir "$(params.MLPERF_OUTPUT_DIR)"
          --server-target-qps "$(params.MLPERF_SERVER_TARGET_QPS)"
        )

        # Add optional parameters
        [ -n "$(params.MLPERF_BATCH_SIZE)" ] && ARGS+=(--batch-size "$(params.MLPERF_BATCH_SIZE)")

        if [ "$(params.MLFLOW_ENABLED)" = "true" ]; then
          ARGS+=(--experiment-name "$(params.MLFLOW_EXPERIMENT_NAME)")
          [ -n "$MLFLOW_TRACKING_URI" ] && ARGS+=(--mlflow-tracking-uri "$MLFLOW_TRACKING_URI")
        fi

        echo "Starting MLPerf benchmark..."
        echo "Command: python3 -m benchmark.main ${ARGS[@]}"
        echo ""

        exec python3 -m benchmark.main "${ARGS[@]}"

  # Avoid scheduling on GPU nodes
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: nvidia.com/gpu
                operator: DoesNotExist
