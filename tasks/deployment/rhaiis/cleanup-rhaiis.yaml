apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup-rhaiis
  labels:
    app.kubernetes.io/version: "0.1"
  annotations:
    tekton.dev/displayName: "Cleanup RHAIIS Deployment"
    tekton.dev/tags: cleanup, rhaiis
spec:
  description: >-
    Cleanup RHAIIS InferenceService and ServingRuntime resources.

  params:
    - name: MODEL_NAME
      description: HuggingFace model identifier
      type: string

    - name: NAMESPACE
      description: Namespace for deployment
      type: string

    - name: WAIT_FOR_DELETION
      description: Wait for resources to be fully deleted
      type: string
      default: "true"

    - name: SKIP_IF_NOT_EXISTS
      description: Skip if resources don't exist (no error)
      type: string
      default: "true"

  steps:
    - name: cleanup
      image: registry.redhat.io/openshift4/ose-cli:latest
      script: |
        #!/bin/bash
        set -e

        # Generate deployment name (same logic as deploy task)
        DEPLOYMENT_NAME=$(echo "$(params.MODEL_NAME)" | tr '[:upper:]' '[:lower:]' | sed 's/\//-/g' | sed 's/\.//g' | sed 's/-$//' | cut -c1-42)

        echo "Cleaning up KServe deployment:"
        echo "  Name: $DEPLOYMENT_NAME"
        echo "  Namespace: $(params.NAMESPACE)"
        echo ""

        # Check if InferenceService exists
        if ! oc get inferenceservice "$DEPLOYMENT_NAME" -n "$(params.NAMESPACE)" 2>/dev/null; then
          if [ "$(params.SKIP_IF_NOT_EXISTS)" = "true" ]; then
            echo "✓ InferenceService $DEPLOYMENT_NAME does not exist - nothing to clean up"
            exit 0
          else
            echo "✗ InferenceService $DEPLOYMENT_NAME not found"
            exit 1
          fi
        fi

        # Delete InferenceService
        echo "Deleting InferenceService..."
        oc delete inferenceservice "$DEPLOYMENT_NAME" -n "$(params.NAMESPACE)"

        # Delete ServingRuntime
        echo "Deleting ServingRuntime..."
        oc delete servingruntime "$DEPLOYMENT_NAME" -n "$(params.NAMESPACE)" 2>/dev/null || true

        if [ "$(params.WAIT_FOR_DELETION)" = "true" ]; then
          echo "Waiting for resources to be deleted..."
          oc wait --for=delete inferenceservice/"$DEPLOYMENT_NAME" -n "$(params.NAMESPACE)" --timeout=300s 2>/dev/null || true
        fi

        echo ""
        echo "✓ Cleanup completed successfully!"
