apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: deploy-rhaiis
  labels:
    app.kubernetes.io/version: "0.1"
  annotations:
    tekton.dev/displayName: "Deploy Model (RHAIIS/vLLM)"
    tekton.dev/tags: model, deploy, rhaiis, vllm
    tekton.dev/platforms: "linux/amd64"
spec:
  description: >-
    Deploy a model using KServe ServingRuntime and InferenceService with RHAIIS vLLM image.
    Creates ServingRuntime + InferenceService. Uses PVC for model storage.

    Default image: registry.redhat.io/rhaiis/vllm-cuda-rhel9:3.2.3

  params:
    - name: MODEL_NAME
      description: HuggingFace model identifier
      type: string

    - name: NAMESPACE
      description: Namespace for deployment
      type: string

    - name: TP
      description: Tensor parallelism size (number of GPUs)
      type: string
      default: "1"

    - name: VLLM_ARGS
      description: Additional vLLM arguments as array
      type: array
      default: []

    - name: IMAGE
      description: vLLM container image (default RHAIIS, can override to vllm/vllm-openai:latest)
      type: string
      default: "registry.redhat.io/rhaiis/vllm-cuda-rhel9:3.2.3"

    - name: REPLICAS
      description: Number of replicas
      type: string
      default: "1"

    - name: SKIP_IF_EXISTS
      description: Skip deployment if InferenceService already exists
      type: string
      default: "true"

    - name: MODEL_PVC
      description: PVC name for model storage
      type: string
      default: "models-storage"

    - name: CACHE_DIR
      description: Base directory on PVC where models are stored
      type: string
      default: "/models"

    - name: CREATE_ROUTE
      description: Create OpenShift Route (not used for KServe, kept for compatibility)
      type: string
      default: "true"

  workspaces:
    - name: models-storage
      description: PVC containing downloaded models

  results:
    - name: ENDPOINT_URL
      description: Internal endpoint URL for the deployed model

  steps:
    - name: deploy-kserve
      image: registry.redhat.io/openshift4/ose-cli:latest
      workingDir: /tmp
      args:
        - $(params.VLLM_ARGS[*])
      script: |
        #!/bin/bash
        set -e

        # Generate deployment name from model name
        # Logic: lowercase | replace / with - | replace . with empty | trim suffix - | truncate to 42 chars
        DEPLOYMENT_NAME=$(echo "$(params.MODEL_NAME)" | tr '[:upper:]' '[:lower:]' | sed 's/\//-/g' | sed 's/\.//g' | sed 's/-$//' | cut -c1-42)

        echo "Deployment: $DEPLOYMENT_NAME"
        echo "Namespace: $(params.NAMESPACE)"
        echo "Model: $(params.MODEL_NAME)"
        echo "Image: $(params.IMAGE)"
        echo ""

        if [ "$(params.SKIP_IF_EXISTS)" = "true" ]; then
          if oc get inferenceservice "$DEPLOYMENT_NAME" -n "$(params.NAMESPACE)" 2>/dev/null; then
            echo "✓ InferenceService $DEPLOYMENT_NAME already exists - skipping"
            echo "  To force update, set SKIP_IF_EXISTS=false"

            # Still output the endpoint URL
            ENDPOINT_URL="http://${DEPLOYMENT_NAME}-predictor.$(params.NAMESPACE).svc.cluster.local:8080"
            echo "  Endpoint: $ENDPOINT_URL"
            echo -n "$ENDPOINT_URL" | tee $(results.ENDPOINT_URL.path)
            exit 0
          fi
        fi

        MODEL_DIR_NAME=$(echo "$(params.MODEL_NAME)" | sed 's/\//-/g')
        MODEL_PATH="$(params.CACHE_DIR)/${MODEL_DIR_NAME}"

        echo "Configuration:"
        echo "  Model: $(params.MODEL_NAME)"
        echo "  Model Path: /mnt/models${MODEL_PATH}"
        echo "  TP (Tensor Parallel / GPU Count): $(params.TP)"
        echo "  PVC: $(params.MODEL_PVC)"
        echo "  Replicas: $(params.REPLICAS)"
        echo ""

        # Build vLLM args array from positional parameters
        VLLM_ARGS_YAML=""
        for arg in "$@"; do
          if [ -n "$arg" ]; then
            VLLM_ARGS_YAML="${VLLM_ARGS_YAML}
            - \"${arg}\""
          fi
        done

        # Generate ServingRuntime YAML
        cat > /tmp/servingruntime.yaml <<EOF
        apiVersion: serving.kserve.io/v1alpha1
        kind: ServingRuntime
        metadata:
          name: $DEPLOYMENT_NAME
          namespace: $(params.NAMESPACE)
          labels:
            opendatahub.io/dashboard: "true"
            app: llm-d-bench
            deployment-mode: rhaiis-kserve
          annotations:
            opendatahub.io/template-display-name: ServingRuntime for vLLM | llm-d-bench
        spec:
          builtInAdapter:
            modelLoadingTimeoutMillis: 300000
          containers:
          - name: kserve-container
            image: $(params.IMAGE)
            command:
            - python
            - -m
            - vllm.entrypoints.openai.api_server
            args:
            - --model=/mnt/models
            - --served-model-name=$(params.MODEL_NAME)
            - --port=8080
            - --tensor-parallel-size=$(params.TP)
        ${VLLM_ARGS_YAML}
            env:
            - name: HF_HUB_OFFLINE
              value: "0"
            ports:
            - containerPort: 8080
              protocol: TCP
          multiModel: false
          supportedModelFormats:
          - autoSelect: true
            name: pytorch
        EOF

        echo "Generated ServingRuntime manifest:"
        echo "========================================="
        cat /tmp/servingruntime.yaml
        echo "========================================="
        echo ""

        # Apply ServingRuntime
        echo "Creating ServingRuntime..."
        oc apply -f /tmp/servingruntime.yaml

        # Generate InferenceService YAML
        cat > /tmp/inferenceservice.yaml <<EOF
        apiVersion: serving.kserve.io/v1beta1
        kind: InferenceService
        metadata:
          name: $DEPLOYMENT_NAME
          namespace: $(params.NAMESPACE)
          labels:
            opendatahub.io/dashboard: "true"
            app: llm-d-bench
            deployment-mode: rhaiis-kserve
          annotations:
            serving.kserve.io/deploymentMode: RawDeployment
            serving.kserve.io/enable-prometheus-scraping: "true"
            prometheus.io/scrape: "true"
            prometheus.io/path: "/metrics"
            prometheus.io/port: "8080"
        spec:
          predictor:
            minReplicas: $(params.REPLICAS)
            model:
              modelFormat:
                name: pytorch
              runtime: $DEPLOYMENT_NAME
              storageUri: pvc://$(params.MODEL_PVC)${MODEL_PATH}
              resources:
                limits:
                  nvidia.com/gpu: "$(params.TP)"
                requests:
                  nvidia.com/gpu: "$(params.TP)"
        EOF

        echo "Generated InferenceService manifest:"
        echo "========================================="
        cat /tmp/inferenceservice.yaml
        echo "========================================="
        echo ""

        # Apply InferenceService
        echo "Creating InferenceService..."
        oc apply -f /tmp/inferenceservice.yaml

        # Calculate endpoint URL
        ENDPOINT_URL="http://${DEPLOYMENT_NAME}-predictor.$(params.NAMESPACE).svc.cluster.local:8080"

        echo ""
        echo "✓ Deployment created successfully!"
        echo "  ServingRuntime: $DEPLOYMENT_NAME"
        echo "  InferenceService: $DEPLOYMENT_NAME"
        echo "  Namespace: $(params.NAMESPACE)"
        echo "  Endpoint: $ENDPOINT_URL"
        echo ""
        echo "Use 'oc get inferenceservice $DEPLOYMENT_NAME -n $(params.NAMESPACE)' to check status"

        # Output endpoint URL as result
        echo -n "$ENDPOINT_URL" | tee $(results.ENDPOINT_URL.path)
