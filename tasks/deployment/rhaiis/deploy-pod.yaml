apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: deploy-rhaiis-pod
  labels:
    app.kubernetes.io/version: "0.1"
  annotations:
    tekton.dev/displayName: "Deploy Model as Pod (RHAIIS/vLLM)"
    tekton.dev/tags: model, deploy, rhaiis, vllm, pod
    tekton.dev/platforms: "linux/amd64"
spec:
  description: >-
    Deploy a model as a simple Pod using RHAIIS vLLM image or raw vLLM.
    Creates Pod + Service (+ optional Route). No CRDs required.

    Default image: registry.redhat.io/rhaiis/vllm-cuda-rhel9:3.2.3

    For raw vLLM deployment: Set IMAGE=vllm/vllm-openai:latest

  params:
    - name: MODEL_NAME
      description: HuggingFace model identifier
      type: string

    - name: NAMESPACE
      description: Namespace for deployment
      type: string

    - name: TP
      description: Tensor parallelism size (number of GPUs)
      type: string
      default: "1"

    - name: VLLM_ARGS
      description: Additional vLLM arguments as array
      type: array
      default: []

    - name: IMAGE
      description: vLLM container image (default RHAIIS, can override to vllm/vllm-openai:latest)
      type: string
      default: "registry.redhat.io/rhaiis/vllm-cuda-rhel9:3.2.3"

    - name: REPLICAS
      description: Number of replicas (currently only 1 supported for Pod deployment)
      type: string
      default: "1"

    - name: SKIP_IF_EXISTS
      description: Skip deployment if Pod already exists
      type: string
      default: "true"

    - name: MODEL_PVC
      description: PVC name for model storage
      type: string
      default: "models-storage"

    - name: CACHE_DIR
      description: Base directory on PVC where models are stored
      type: string
      default: "/models"

    - name: CREATE_ROUTE
      description: Create OpenShift Route to expose service externally
      type: string
      default: "true"

  workspaces:
    - name: models-storage
      description: PVC containing downloaded models

  steps:
    - name: deploy-pod
      image: registry.redhat.io/openshift4/ose-cli:latest
      workingDir: /tmp
      args:
        - $(params.VLLM_ARGS[*])
      script: |
        #!/bin/bash
        set -e

        # Generate deployment name from model name
        # Logic: lowercase | replace / with - | replace . with empty | trim suffix - | truncate to 42 chars
        DEPLOYMENT_NAME=$(echo "$(params.MODEL_NAME)" | tr '[:upper:]' '[:lower:]' | sed 's/\//-/g' | sed 's/\.//g' | sed 's/-$//' | cut -c1-42)

        echo "Deployment: $DEPLOYMENT_NAME"
        echo "Namespace: $(params.NAMESPACE)"
        echo "Model: $(params.MODEL_NAME)"
        echo "Image: $(params.IMAGE)"
        echo ""

        if [ "$(params.SKIP_IF_EXISTS)" = "true" ]; then
          if oc get pod "$DEPLOYMENT_NAME" -n "$(params.NAMESPACE)" 2>/dev/null; then
            echo "✓ Pod $DEPLOYMENT_NAME already exists - skipping"
            echo "  To force update, set SKIP_IF_EXISTS=false"
            exit 0
          fi
        fi

        MODEL_DIR_NAME=$(echo "$(params.MODEL_NAME)" | sed 's/\//-/g')
        MODEL_PATH="$(params.CACHE_DIR)/${MODEL_DIR_NAME}"

        echo "Configuration:"
        echo "  Model: $(params.MODEL_NAME)"
        echo "  Model Path: /mnt${MODEL_PATH}"
        echo "  TP (Tensor Parallel / GPU Count): $(params.TP)"
        echo "  PVC: $(params.MODEL_PVC)"
        echo ""

        # Build vLLM args array from positional parameters
        VLLM_ARGS_YAML=""
        for arg in "$@"; do
          if [ -n "$arg" ]; then
            VLLM_ARGS_YAML="${VLLM_ARGS_YAML}
            - \"${arg}\""
          fi
        done

        # Generate Pod YAML
        cat > /tmp/pod.yaml <<EOF
        apiVersion: v1
        kind: Pod
        metadata:
          name: $DEPLOYMENT_NAME
          namespace: $(params.NAMESPACE)
          labels:
            app: vllm-inference
            model: $DEPLOYMENT_NAME
            deployment-mode: rhaiis
        spec:
          containers:
          - name: main
            image: $(params.IMAGE)
            command: ["python", "-m", "vllm.entrypoints.openai.api_server"]
            args:
            - "--port=8000"
            - "--host=0.0.0.0"
            - "--model=/mnt/models${MODEL_PATH}"
            - "--served-model-name=$(params.MODEL_NAME)"
            - "--tensor-parallel-size=$(params.TP)"
        ${VLLM_ARGS_YAML}
            env:
            - name: HF_HUB_OFFLINE
              value: "1"
            ports:
            - containerPort: 8000
              name: http
              protocol: TCP
            resources:
              limits:
                nvidia.com/gpu: "$(params.TP)"
              requests:
                nvidia.com/gpu: "$(params.TP)"
            volumeMounts:
            - name: models-storage
              mountPath: /mnt/models
              readOnly: true
          volumes:
          - name: models-storage
            persistentVolumeClaim:
              claimName: $(params.MODEL_PVC)
          restartPolicy: Always
        EOF

        echo "Generated Pod manifest:"
        echo "========================================="
        cat /tmp/pod.yaml
        echo "========================================="
        echo ""

        # Apply Pod
        echo "Creating Pod..."
        oc apply -f /tmp/pod.yaml

        # Generate Service YAML
        cat > /tmp/service.yaml <<EOF
        apiVersion: v1
        kind: Service
        metadata:
          name: $DEPLOYMENT_NAME
          namespace: $(params.NAMESPACE)
          labels:
            app: vllm-inference
            model: $DEPLOYMENT_NAME
        spec:
          selector:
            app: vllm-inference
            model: $DEPLOYMENT_NAME
          ports:
          - name: http
            port: 8000
            targetPort: 8000
            protocol: TCP
          type: ClusterIP
        EOF

        echo "Generated Service manifest:"
        echo "========================================="
        cat /tmp/service.yaml
        echo "========================================="
        echo ""

        # Apply Service
        echo "Creating Service..."
        oc apply -f /tmp/service.yaml

        # Create Route if requested
        if [ "$(params.CREATE_ROUTE)" = "true" ]; then
          cat > /tmp/route.yaml <<EOF
        apiVersion: route.openshift.io/v1
        kind: Route
        metadata:
          name: $DEPLOYMENT_NAME
          namespace: $(params.NAMESPACE)
          labels:
            app: vllm-inference
            model: $DEPLOYMENT_NAME
        spec:
          to:
            kind: Service
            name: $DEPLOYMENT_NAME
          port:
            targetPort: http
          tls:
            termination: edge
            insecureEdgeTerminationPolicy: Redirect
        EOF

          echo "Generated Route manifest:"
          echo "========================================="
          cat /tmp/route.yaml
          echo "========================================="
          echo ""

          echo "Creating Route..."
          oc apply -f /tmp/route.yaml
        fi

        echo ""
        echo "✓ Deployment created successfully!"
        echo "  Pod: $DEPLOYMENT_NAME"
        echo "  Service: $DEPLOYMENT_NAME"
        if [ "$(params.CREATE_ROUTE)" = "true" ]; then
          echo "  Route: $DEPLOYMENT_NAME"
        fi
        echo "  Namespace: $(params.NAMESPACE)"
        echo ""
        echo "Use 'oc get pod $DEPLOYMENT_NAME -n $(params.NAMESPACE)' to check status"
