apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup-rhaiis-deployment
  labels:
    app.kubernetes.io/version: "0.1"
  annotations:
    tekton.dev/displayName: "Cleanup RHAIIS Pod Deployment"
    tekton.dev/tags: cleanup, rhaiis, pod
    tekton.dev/platforms: "linux/amd64"
spec:
  description: >-
    Cleanup RHAIIS Pod deployment by deleting Route, Service, and Pod resources.
    This task removes all resources created by deploy-rhaiis-pod task.

  params:
    - name: MODEL_NAME
      description: HuggingFace model identifier (used to derive deployment name)
      type: string

    - name: NAMESPACE
      description: Namespace where resources are deployed
      type: string

    - name: WAIT_FOR_DELETION
      description: Wait for resources to be fully deleted
      type: string
      default: "true"

    - name: SKIP_IF_NOT_EXISTS
      description: Skip if resources don't exist (no error)
      type: string
      default: "true"

  steps:
    - name: cleanup
      image: registry.redhat.io/openshift4/ose-cli:latest
      script: |
        #!/bin/bash
        set -e

        # Generate deployment name using same logic as deploy task
        DEPLOYMENT_NAME=$(echo "$(params.MODEL_NAME)" | tr '[:upper:]' '[:lower:]' | sed 's/\//-/g' | sed 's/\.//g' | sed 's/-$//' | cut -c1-42)

        echo "Cleaning up RHAIIS deployment"
        echo "  Deployment: $DEPLOYMENT_NAME"
        echo "  Namespace: $(params.NAMESPACE)"
        echo ""

        # Check if resources exist
        POD_EXISTS=false
        SERVICE_EXISTS=false
        ROUTE_EXISTS=false

        if oc get pod "$DEPLOYMENT_NAME" -n "$(params.NAMESPACE)" &>/dev/null; then
          POD_EXISTS=true
        fi

        if oc get service "$DEPLOYMENT_NAME" -n "$(params.NAMESPACE)" &>/dev/null; then
          SERVICE_EXISTS=true
        fi

        if oc get route "$DEPLOYMENT_NAME" -n "$(params.NAMESPACE)" &>/dev/null; then
          ROUTE_EXISTS=true
        fi

        # Exit early if nothing exists and SKIP_IF_NOT_EXISTS is true
        if [ "$(params.SKIP_IF_NOT_EXISTS)" = "true" ]; then
          if [ "$POD_EXISTS" = "false" ] && [ "$SERVICE_EXISTS" = "false" ] && [ "$ROUTE_EXISTS" = "false" ]; then
            echo "✓ No resources found - nothing to clean up"
            exit 0
          fi
        fi

        # Delete Route first (if exists)
        if [ "$ROUTE_EXISTS" = "true" ]; then
          echo "Deleting Route $DEPLOYMENT_NAME..."
          oc delete route "$DEPLOYMENT_NAME" -n "$(params.NAMESPACE)" --ignore-not-found=true
          echo "✓ Route deleted"
        else
          echo "Route $DEPLOYMENT_NAME not found (skipping)"
        fi

        # Delete Service
        if [ "$SERVICE_EXISTS" = "true" ]; then
          echo "Deleting Service $DEPLOYMENT_NAME..."
          oc delete service "$DEPLOYMENT_NAME" -n "$(params.NAMESPACE)" --ignore-not-found=true
          echo "✓ Service deleted"
        else
          echo "Service $DEPLOYMENT_NAME not found (skipping)"
        fi

        # Delete Pod
        if [ "$POD_EXISTS" = "true" ]; then
          echo "Deleting Pod $DEPLOYMENT_NAME..."
          oc delete pod "$DEPLOYMENT_NAME" -n "$(params.NAMESPACE)" --ignore-not-found=true
          echo "✓ Pod deletion initiated"
        else
          echo "Pod $DEPLOYMENT_NAME not found (skipping)"
        fi

        # Wait for deletion if requested
        if [ "$(params.WAIT_FOR_DELETION)" = "true" ] && [ "$POD_EXISTS" = "true" ]; then
          echo ""
          echo "Waiting for Pod to be fully deleted..."
          TIMEOUT=300  # 5 minutes
          INTERVAL=5
          ELAPSED=0

          while [ $ELAPSED -lt $TIMEOUT ]; do
            if ! oc get pod "$DEPLOYMENT_NAME" -n "$(params.NAMESPACE)" &>/dev/null; then
              echo "✓ Pod fully deleted (${ELAPSED}s)"
              break
            fi

            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
            echo "  Still deleting... (${ELAPSED}s elapsed)"
          done

          if [ $ELAPSED -ge $TIMEOUT ]; then
            echo "WARNING: Timeout waiting for deletion, but continuing"
          fi
        fi

        echo ""
        echo "✓ Cleanup complete!"
        echo "  All resources for deployment '$DEPLOYMENT_NAME' removed"
