apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: deploy-rhoai-model
  labels:
    app.kubernetes.io/version: "0.1"
  annotations:
    tekton.dev/displayName: "Deploy Model as LLMInferenceService"
    tekton.dev/tags: model, deploy, kserve, vllm
    tekton.dev/platforms: "linux/amd64"
spec:
  description: >-
    Deploy a model from PVC as a KServe LLMInferenceService using vLLM.
    This task generates and applies the LLMInferenceService YAML manifest.
    Requires the deploy-model-sa service account to have permissions for LLMInferenceService resources.

    Supports 3 routing modes:
    - direct: KServe SVC only (no EPP, direct service access)
    - prefix-estimation: EPP with kv-cache-utilization-scorer (estimates prefix cache from vLLM metrics)
    - prefix-precise: EPP with prefix-cache-scorer (hash-based precise prefix matching)

  params:
    - name: MODEL_NAME
      description: HuggingFace model identifier
      type: string

    - name: NAMESPACE
      description: Namespace for deployment
      type: string

    - name: TP
      description: Tensor parallelism size (number of GPUs)
      type: string
      default: "1"

    - name: VLLM_ARGS
      description: Additional vLLM arguments as array
      type: array
      default: []

    - name: SKIP_IF_EXISTS
      description: Skip deployment if LLMInferenceService already exists
      type: string
      default: "true"

    - name: ENABLE_AUTH
      description: Enable authentication on the service
      type: string
      default: "false"

    - name: REPLICAS
      description: Number of replicas
      type: string
      default: "1"

    - name: CACHE_DIR
      description: Base directory on PVC where models are stored
      type: string
      default: "/models"

    - name: KUEUE_QUEUE_NAME
      description: Kueue LocalQueue name for GPU scheduling (optional)
      type: string
      default: ""

    - name: RUN_UUID
      description: Pipeline run UUID for tracking/correlation
      type: string
      default: ""

    - name: ROUTING_MODE
      description: |
        Routing mode for the LLMInferenceService:
        - direct: KServe SVC only, no EPP (default)
        - prefix-estimation: EPP with kv-cache-utilization-scorer (estimates prefix cache from metrics)
        - prefix-precise: EPP with prefix-cache-scorer (hash-based precise prefix matching)
      type: string
      default: "direct"

    - name: GATEWAY_NAME
      description: Name of the Gateway for EPP routing (required for prefix-* modes)
      type: string
      default: "openshift-ai-inference"

    - name: GATEWAY_NAMESPACE
      description: Namespace of the Gateway for EPP routing
      type: string
      default: "openshift-ingress"

  workspaces:
    - name: models-storage
      description: PVC containing downloaded models

  steps:
    - name: deploy-rhoai-model
      image: registry.redhat.io/openshift4/ose-cli:latest
      workingDir: /tmp
      args:
        - $(params.VLLM_ARGS[*])
      script: |
        #!/bin/bash
        set -e

        # Generate deployment name from model name
        # Logic: lowercase | replace / with - | replace . with empty | trim suffix - | truncate to 42 chars
        DEPLOYMENT_NAME=$(echo "$(params.MODEL_NAME)" | tr '[:upper:]' '[:lower:]' | sed 's/\//-/g' | sed 's/\.//g' | sed 's/-$//' | cut -c1-42)

        echo "Deployment: $DEPLOYMENT_NAME"
        echo "Namespace: $(params.NAMESPACE)"
        echo "Model: $(params.MODEL_NAME)"
        echo ""

        if [ "$(params.SKIP_IF_EXISTS)" = "true" ]; then
          if oc get llminferenceservice "$DEPLOYMENT_NAME" -n "$(params.NAMESPACE)" 2>/dev/null; then
            echo "✓ LLMInferenceService $DEPLOYMENT_NAME already exists - skipping"
            echo "  To force update, set SKIP_IF_EXISTS=false"
            exit 0
          fi
        fi

        MODEL_DIR_NAME=$(echo "$(params.MODEL_NAME)" | sed 's/\//-/g')
        MODEL_URI="pvc://models-storage$(params.CACHE_DIR)/${MODEL_DIR_NAME}"

        echo "Configuration:"
        echo "  Model: $(params.MODEL_NAME)"
        echo "  Model URI: $MODEL_URI"
        echo "  TP (Tensor Parallel / GPU Count): $(params.TP)"
        echo "  Replicas: $(params.REPLICAS)"
        echo "  Routing Mode: $(params.ROUTING_MODE)"
        if [ "$(params.ROUTING_MODE)" != "direct" ]; then
          echo "  Gateway: $(params.GATEWAY_NAME).$(params.GATEWAY_NAMESPACE)"
        fi
        echo ""

        # Format VLLM_ARGS array as YAML list from positional parameters
        VLLM_ARGS_YAML=""
        for arg in "$@"; do
          if [ -n "$arg" ]; then
            VLLM_ARGS_YAML="${VLLM_ARGS_YAML}
                - \"${arg}\""
          fi
        done

        # Build optional labels (only add if parameter is set)
        EXTRA_LABELS=""
        POD_EXTRA_LABELS=""

        if [ -n "$(params.KUEUE_QUEUE_NAME)" ]; then
          EXTRA_LABELS="${EXTRA_LABELS}
            kueue.x-k8s.io/queue-name: $(params.KUEUE_QUEUE_NAME)"
          POD_EXTRA_LABELS="${POD_EXTRA_LABELS}
                kueue.x-k8s.io/queue-name: $(params.KUEUE_QUEUE_NAME)"
        fi

        if [ -n "$(params.RUN_UUID)" ]; then
          EXTRA_LABELS="${EXTRA_LABELS}
            deployment_uuid: $(params.RUN_UUID)"
          POD_EXTRA_LABELS="${POD_EXTRA_LABELS}
                deployment_uuid: $(params.RUN_UUID)"
        fi

        # Generate router configuration based on ROUTING_MODE
        ROUTING_MODE="$(params.ROUTING_MODE)"
        echo "Routing Mode: $ROUTING_MODE"

        case "$ROUTING_MODE" in
          "direct")
            # KServe SVC only, no EPP
            ROUTER_CONFIG="router:
            route: {}
            gateway: {}
            scheduler: {}"
            ;;
          "prefix-estimation")
            # EPP with kv-cache-utilization-scorer (estimates from vLLM metrics)
            ROUTER_CONFIG="router:
            scheduler:
              template:
                containers:
                  - name: main
                    args:
                      - '-v=4'
                      - '--cert-path'
                      - /var/run/kserve/tls
                      - '--pool-group'
                      - inference.networking.x-k8s.io
                      - '--pool-name'
                      - '{{ ChildName .ObjectMeta.Name \`-inference-pool\` }}'
                      - '--pool-namespace'
                      - '{{ .ObjectMeta.Namespace }}'
                      - '--zap-encoder'
                      - json
                      - '--grpc-port'
                      - '9002'
                      - '--grpc-health-port'
                      - '9003'
                      - '--secure-serving'
                      - '--model-server-metrics-scheme'
                      - https
                      - '--config-text'
                      - |
                        apiVersion: inference.networking.x-k8s.io/v1alpha1
                        kind: EndpointPickerConfig
                        plugins:
                        - type: single-profile-handler
                        - type: queue-scorer
                        - type: kv-cache-utilization-scorer
                        schedulingProfiles:
                        - name: default
                          plugins:
                          - pluginRef: queue-scorer
                            weight: 1
                          - pluginRef: kv-cache-utilization-scorer
                            weight: 2
            route: {}
            gateway:
              gatewayRef:
                name: $(params.GATEWAY_NAME)
                namespace: $(params.GATEWAY_NAMESPACE)"
            ;;
          "prefix-precise")
            # EPP with prefix-cache-scorer (hash-based precise prefix matching)
            ROUTER_CONFIG="router:
            scheduler:
              template:
                containers:
                  - name: main
                    args:
                      - '-v=4'
                      - '--cert-path'
                      - /var/run/kserve/tls
                      - '--pool-group'
                      - inference.networking.x-k8s.io
                      - '--pool-name'
                      - '{{ ChildName .ObjectMeta.Name \`-inference-pool\` }}'
                      - '--pool-namespace'
                      - '{{ .ObjectMeta.Namespace }}'
                      - '--zap-encoder'
                      - json
                      - '--grpc-port'
                      - '9002'
                      - '--grpc-health-port'
                      - '9003'
                      - '--secure-serving'
                      - '--model-server-metrics-scheme'
                      - https
                      - '--config-text'
                      - |
                        apiVersion: inference.networking.x-k8s.io/v1alpha1
                        kind: EndpointPickerConfig
                        plugins:
                        - type: single-profile-handler
                        - type: queue-scorer
                        - type: prefix-cache-scorer
                        schedulingProfiles:
                        - name: default
                          plugins:
                          - pluginRef: queue-scorer
                            weight: 1
                          - pluginRef: prefix-cache-scorer
                            weight: 3
            route: {}
            gateway:
              gatewayRef:
                name: $(params.GATEWAY_NAME)
                namespace: $(params.GATEWAY_NAMESPACE)"
            ;;
          *)
            echo "ERROR: Unknown ROUTING_MODE: $ROUTING_MODE"
            echo "Valid options: direct, prefix-estimation, prefix-precise"
            exit 1
            ;;
        esac

        # Generate LLMInferenceService YAML
        cat > /tmp/llm-inference-service.yaml <<EOF
        apiVersion: serving.kserve.io/v1alpha1
        kind: LLMInferenceService
        metadata:
          name: $DEPLOYMENT_NAME
          namespace: $(params.NAMESPACE)
          labels:
            app: vllm-inference
            model: $DEPLOYMENT_NAME
            deployment-mode: rhoai${EXTRA_LABELS}
          annotations:
            security.opendatahub.io/enable-auth: "$(params.ENABLE_AUTH)"
            llm-d-bench/routing-mode: "$ROUTING_MODE"
        spec:
          model:
            name: $(params.MODEL_NAME)
            uri: ${MODEL_URI}
          replicas: $(params.REPLICAS)
          ${ROUTER_CONFIG}
          template:
            metadata:
              labels:
                app: vllm-inference
                model: $DEPLOYMENT_NAME${POD_EXTRA_LABELS}
            containers:
            - name: main
              command: ["python3", "-m", "vllm.entrypoints.openai.api_server"]
              args:
                - "--port=8000"
                - "--host=0.0.0.0"
                - "--model=/mnt/models"
                - "--served-model-name=$(params.MODEL_NAME)"
                - "--tensor-parallel-size=$(params.TP)"
                - "--enable-ssl-refresh"
                - "--ssl-certfile=/var/run/kserve/tls/tls.crt"
                - "--ssl-keyfile=/var/run/kserve/tls/tls.key"
        ${VLLM_ARGS_YAML}
              resources:
                limits:
                  nvidia.com/gpu: "$(params.TP)"
                requests:
                  nvidia.com/gpu: "$(params.TP)"
              livenessProbe:
                httpGet:
                  path: /health
                  port: 8000
                  scheme: HTTPS
                initialDelaySeconds: 400
                periodSeconds: 10
                timeoutSeconds: 10
                successThreshold: 1
                failureThreshold: 3
        EOF

        echo "Generated LLMInferenceService manifest:"
        echo "========================================="
        cat /tmp/llm-inference-service.yaml
        echo "========================================="
        echo ""

        # Apply the manifest
        echo "Applying manifest..."
        oc apply -f /tmp/llm-inference-service.yaml

        echo ""
        echo "✓ Deployment created successfully!"
        echo "  Service: $DEPLOYMENT_NAME"
        echo "  Namespace: $(params.NAMESPACE)"
        echo "  Routing Mode: $ROUTING_MODE"
        echo ""
        if [ "$ROUTING_MODE" = "direct" ]; then
          echo "Endpoint (direct SVC):"
          echo "  https://${DEPLOYMENT_NAME}-kserve-workload-svc.$(params.NAMESPACE).svc.cluster.local/v1/chat/completions"
        else
          echo "Endpoint (via EPP Gateway):"
          echo "  http://$(params.GATEWAY_NAME).$(params.GATEWAY_NAMESPACE).svc.cluster.local/$(params.NAMESPACE)/${DEPLOYMENT_NAME}/v1/chat/completions"
        fi
        echo ""
        echo "Use 'oc get llminferenceservice $DEPLOYMENT_NAME -n $(params.NAMESPACE)' to check status"
