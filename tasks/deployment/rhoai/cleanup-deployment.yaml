apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup-rhoai-deployment
  labels:
    app.kubernetes.io/version: "0.1"
  annotations:
    tekton.dev/displayName: "Cleanup Model Deployment"
    tekton.dev/tags: cleanup, deploy, kserve
    tekton.dev/platforms: "linux/amd64"
spec:
  description: >-
    Delete a LLMInferenceService deployment. This task removes the deployment
    but preserves the model files on the PVC for future use.
    Requires the deploy-model-sa service account to have permissions for LLMInferenceService resources.

  params:
    - name: MODEL_NAME
      description: HuggingFace model identifier
      type: string

    - name: NAMESPACE
      description: Namespace containing the deployment
      type: string

    - name: WAIT_FOR_DELETION
      description: Wait for resource to be fully deleted before completing
      type: string
      default: "true"

    - name: TIMEOUT_SECONDS
      description: Maximum time to wait for deletion (in seconds)
      type: string
      default: "300"

    - name: SKIP_IF_NOT_EXISTS
      description: Don't fail if deployment doesn't exist (idempotency control)
      type: string
      default: "true"

    - name: RUN_UUID
      description: Unique run identifier (first 5 chars appended to deployment name)
      type: string
      default: ""

  steps:
    - name: cleanup-rhoai-deployment
      image: registry.redhat.io/openshift4/ose-cli:latest
      workingDir: /tmp
      script: |
        #!/bin/bash
        set -e

        # Generate deployment name from model name
        # Logic: lowercase | replace / with - | replace . with empty | trim suffix - | truncate to 42 chars
        BASE_NAME=$(echo "$(params.MODEL_NAME)" | tr '[:upper:]' '[:lower:]' | sed 's/\//-/g' | sed 's/\.//g' | sed 's/-$//' | cut -c1-42)

        # Append first 5 chars of RUN_UUID if provided for unique deployments
        RUN_UUID="$(params.RUN_UUID)"
        if [ -n "$RUN_UUID" ]; then
          UUID_SUFFIX=$(echo "$RUN_UUID" | cut -c1-5)
          DEPLOYMENT_NAME="${BASE_NAME}-${UUID_SUFFIX}"
        else
          DEPLOYMENT_NAME="$BASE_NAME"
        fi

        echo "Cleanup target:"
        echo "  Deployment: $DEPLOYMENT_NAME"
        echo "  Namespace: $(params.NAMESPACE)"
        echo ""

        # Check if deployment exists
        if ! oc get llminferenceservice "$DEPLOYMENT_NAME" -n "$(params.NAMESPACE)" 2>/dev/null; then
          if [ "$(params.SKIP_IF_NOT_EXISTS)" = "true" ]; then
            echo "✓ LLMInferenceService $DEPLOYMENT_NAME does not exist - nothing to clean"
            exit 0
          else
            echo "ERROR: LLMInferenceService $DEPLOYMENT_NAME not found in namespace $(params.NAMESPACE)"
            exit 1
          fi
        fi

        echo "Deleting LLMInferenceService: $DEPLOYMENT_NAME"
        oc delete llminferenceservice "$DEPLOYMENT_NAME" -n "$(params.NAMESPACE)"

        # Wait for deletion if requested
        if [ "$(params.WAIT_FOR_DELETION)" = "true" ]; then
          echo ""
          echo "Waiting for resource deletion (timeout: $(params.TIMEOUT_SECONDS)s)..."

          START_TIME=$(date +%s)
          END_TIME=$((START_TIME + $(params.TIMEOUT_SECONDS)))

          while oc get llminferenceservice "$DEPLOYMENT_NAME" -n "$(params.NAMESPACE)" 2>/dev/null; do
            CURRENT_TIME=$(date +%s)
            if [ $CURRENT_TIME -ge $END_TIME ]; then
              echo ""
              echo "ERROR: Timeout waiting for deletion after $(params.TIMEOUT_SECONDS)s"
              exit 1
            fi

            ELAPSED=$((CURRENT_TIME - START_TIME))
            echo "  Still deleting... (${ELAPSED}s elapsed)"
            sleep 5
          done

          echo ""
          echo "✓ Resource successfully deleted!"
        fi

        echo ""
        echo "Cleanup complete!"
        echo ""
        echo "Note: Model files remain on the models-storage PVC and can be reused."
        echo "      To remove models, manually delete directories from the PVC."
