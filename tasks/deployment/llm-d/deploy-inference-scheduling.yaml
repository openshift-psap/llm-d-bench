apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: deploy-llm-d-inference-scheduling
  labels:
    app.kubernetes.io/version: "0.8"
  annotations:
    tekton.dev/displayName: "Deploy llm-d Model with Inference Scheduling"
    tekton.dev/tags: model, deploy, helm, helmfile, llm-d, gitops
    tekton.dev/platforms: "linux/amd64"
spec:
  description: >-
    Deploy a model using GitOps approach with the llm-d inference-scheduling guide.
    This task expects the llm-d repository to be already cloned in the workspace,
    patches values.yaml with yq, deploys using the upstream helmfile, and creates
    the HTTPRoute. Use with git-clone task to clone https://github.com/llm-d/llm-d first.

  params:
    # Core Model Configuration
    - name: MODEL_NAME
      description: HuggingFace model identifier (e.g., meta-llama/Llama-3.1-8B)
      type: string

    - name: MODEL_REVISION
      description: Model revision/branch to deploy
      type: string
      default: "main"

    # Deployment Configuration
    - name: RELEASE_NAME
      description: Unique release name postfix
      type: string

    - name: NAMESPACE
      description: Namespace for deployment
      type: string

    - name: GATEWAY_PROVIDER
      description: "Gateway provider: istio (default), kgateway, standalone, gke"
      type: string
      default: "istio"

    # Scaling & Resources
    - name: REPLICAS
      description: Number of vLLM worker replicas
      type: string
      default: "1"

    - name: PREFILL_REPLICAS
      description: Number of prefill worker replicas for P/D disaggregation (not supported by this task)
      type: string
      default: ""

    - name: DECODE_REPLICAS
      description: Number of decode worker replicas for P/D disaggregation (not supported by this task)
      type: string
      default: ""

    - name: TP
      description: Tensor parallelism size (GPUs per pod)
      type: string
      default: "1"

    # Storage & Authentication
    - name: MODEL_PVC
      description: PVC name for model storage
      type: string
      default: "models-storage"

    - name: HF_TOKEN_SECRET
      description: Secret name containing HuggingFace token
      type: string
      default: "huggingface-token"

    # Advanced Configuration
    - name: VLLM_ARGS
      description: Additional vLLM arguments as newline-delimited string or array (from merge-configs)
      type: string
      default: ""

    # Control Flags
    - name: SKIP_IF_EXISTS
      description: Skip deployment if release already exists
      type: string
      default: "true"

    - name: PIPELINE_RUN_NAME
      description: PipelineRun name for pod labeling
      type: string
      default: ""

  workspaces:
    - name: source
      description: Workspace containing cloned llm-d repository (at llm-d-repo/)
    - name: manifests-storage
      description: Workspace for storing rendered manifests
      optional: true

  steps:
    # Step 1: Patch Values with yq
    - name: patch-values
      image: ghcr.io/helmfile/helmfile:latest
      workingDir: $(workspaces.source.path)/llm-d-repo/guides/inference-scheduling
      env:
        - name: HOME
          value: /tmp
        - name: VLLM_ARGS_INPUT
          value: $(params.VLLM_ARGS)
      script: |
        #!/bin/bash
        set -e

        echo "=== Step 1: Patching Values with yq ==="

        # Validate P/D disaggregation parameters
        if [ -n "$(params.PREFILL_REPLICAS)" ] || [ -n "$(params.DECODE_REPLICAS)" ]; then
          echo "WARNING: PREFILL_REPLICAS and DECODE_REPLICAS are not supported by this task"
          echo "  This task uses standard mode deployment (single worker pool)."
          echo "  For P/D disaggregation mode, use deploy-llm-d-pd-disaggregation task instead."
          echo "  These parameters will be ignored. Using REPLICAS=$(params.REPLICAS) instead."
          echo ""
        fi

        if [ ! -d "$(workspaces.source.path)/llm-d-repo/guides/inference-scheduling" ]; then
          echo "ERROR: llm-d repository not found at $(workspaces.source.path)/llm-d-repo/guides/inference-scheduling"
          exit 1
        fi

        # Install yq (mikefarah/yq v4.x)
        YQ_VERSION="v4.40.5"
        if ! wget -qO /tmp/yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"; then
          echo "ERROR: Failed to download yq"
          exit 1
        fi
        chmod +x /tmp/yq

        VALUES_FILE="ms-inference-scheduling/values.yaml"

        # Verify values file exists
        if [ ! -f "$VALUES_FILE" ]; then
          echo "ERROR: values.yaml not found at $VALUES_FILE"
          exit 1
        fi

        # Sanitize model name for PVC path (replace / with -)
        MODEL_NAME_SANITIZED=$(echo "$(params.MODEL_NAME)" | sed 's|/|-|g')

        # 1. Model Artifacts Configuration
        /tmp/yq -i '.modelArtifacts.name = "$(params.MODEL_NAME)"' $VALUES_FILE
        /tmp/yq -i '.modelArtifacts.uri = "pvc://$(params.MODEL_PVC)/models/'"$MODEL_NAME_SANITIZED"'"' $VALUES_FILE
        /tmp/yq -i '.modelArtifacts.authSecretName = "$(params.HF_TOKEN_SECRET)"' $VALUES_FILE

        # 2. Replicas
        /tmp/yq -i '.decode.replicas = $(params.REPLICAS)' $VALUES_FILE

        # 3. Tensor Parallelism
        # Set parallelism.tensor so chart calculates GPU resources correctly
        # With modelCommand: custom, this won't trigger auto-arg generation
        TP=$(params.TP)
        echo "  Configuring TP=$TP..."

        # Set parallelism.tensor - chart will use this to calculate GPU resources
        /tmp/yq -i '.decode.parallelism.tensor = '"$TP" $VALUES_FILE

        # Set CUDA_VISIBLE_DEVICES based on TP
        if [ "$TP" -gt 1 ]; then
          CUDA_DEVICES=$(seq -s, 0 $((TP-1)))
        else
          CUDA_DEVICES="0"
        fi
        echo "  Setting CUDA_VISIBLE_DEVICES=$CUDA_DEVICES"

        # Initialize env array if null/empty, remove existing CUDA_VISIBLE_DEVICES, then add new one
        /tmp/yq -i '.decode.containers[0].env |= . // []' $VALUES_FILE
        /tmp/yq -i '.decode.containers[0].env = [.decode.containers[0].env[] | select(.name != "CUDA_VISIBLE_DEVICES")]' $VALUES_FILE
        /tmp/yq -i '.decode.containers[0].env += [{"name": "CUDA_VISIBLE_DEVICES", "value": "'"$CUDA_DEVICES"'"}]' $VALUES_FILE

        # 3.5. Override ModelService image
        echo "  Setting ModelService image to ghcr.io/llm-d/llm-d-cuda-dev:sha-3222272"
        /tmp/yq -i '.decode.containers[0].image = "ghcr.io/llm-d/llm-d-cuda-dev:sha-3222272"' $VALUES_FILE

        # 3.6. Set modelCommand to custom and provide our own command/args
        # This prevents the chart from auto-generating args from modelArtifacts.name and parallelism.tensor
        /tmp/yq -i '.decode.containers[0].modelCommand = "custom"' $VALUES_FILE
        /tmp/yq -i '.decode.containers[0].command = ["vllm", "serve"]' $VALUES_FILE

        # 4. Build complete args array (prevents duplicates and ensures user precedence)
        echo "  Building vLLM arguments array..."

        # Initialize empty args array (will replace any chart defaults)
        VLLM_ARGS_ARRAY='[]'

        # Add model path as first arg (required positional argument for vllm serve)
        MODEL_PATH="/model-cache/models/$MODEL_NAME_SANITIZED"
        VLLM_ARGS_ARRAY=$(echo "$VLLM_ARGS_ARRAY" | jq --arg path "$MODEL_PATH" '. += [$path]')

        # Add port (8200 is routing.proxy.targetPort from guide template)
        VLLM_ARGS_ARRAY=$(echo "$VLLM_ARGS_ARRAY" | jq '. += ["--port", "8200"]')

        # Add tensor-parallel-size (mapped from TP parameter)
        VLLM_ARGS_ARRAY=$(echo "$VLLM_ARGS_ARRAY" | jq --arg tp "$TP" '. += ["--tensor-parallel-size", $tp]')

        # Add served-model-name
        VLLM_ARGS_ARRAY=$(echo "$VLLM_ARGS_ARRAY" | jq --arg model "$(params.MODEL_NAME)" '. += ["--served-model-name", $model]')

        # Add revision (if not main)
        if [ "$(params.MODEL_REVISION)" != "main" ]; then
          VLLM_ARGS_ARRAY=$(echo "$VLLM_ARGS_ARRAY" | jq --arg rev "$(params.MODEL_REVISION)" '. += ["--revision", $rev]')
        fi

        # Add user VLLM_ARGS from ConfigMap (takes precedence over defaults)
        if [ -n "$VLLM_ARGS_INPUT" ]; then
          echo "  Adding vLLM arguments from configuration..."
          while IFS= read -r arg; do
            if [ -n "$arg" ]; then
              echo "    - $arg"
              VLLM_ARGS_ARRAY=$(echo "$VLLM_ARGS_ARRAY" | jq --arg a "$arg" '. += [$a]')
            fi
          done <<< "$VLLM_ARGS_INPUT"
        fi

        # Set complete args array (replaces any chart defaults)
        echo "  Setting vLLM args array..."
        # Write JSON array to temp file and use yq to read it
        echo "$VLLM_ARGS_ARRAY" > /tmp/vllm_args.json
        /tmp/yq -i ".decode.containers[0].args = $(cat /tmp/vllm_args.json)" $VALUES_FILE

        # Verify args were set correctly
        echo "  Configured vLLM args:"
        /tmp/yq '.decode.containers[0].args' $VALUES_FILE

        # Validate patched ModelService YAML
        if ! /tmp/yq eval '.' $VALUES_FILE > /dev/null; then
          echo "ERROR: Patched values.yaml is not valid YAML"
          exit 1
        fi

        echo "ModelService values patched successfully"

        # 7. Patch GAIE values for EPP verbosity (COMMENTED OUT - for reference only)
        # GAIE_VALUES_FILE="gaie-inference-scheduling/values.yaml"
        # if [ -f "$GAIE_VALUES_FILE" ]; then
        #   echo ""
        #   echo "Patching GAIE values ($GAIE_VALUES_FILE)..."
        #
        #   # EPP Verbosity (zap log level 10 = debug)
        #   echo "  Setting EPP verbosity to level 10..."
        #   /tmp/yq -i '.inferenceExtension.flags.v = "10"' $GAIE_VALUES_FILE
        #
        #   # Validate patched GAIE YAML
        #   if ! /tmp/yq eval '.' $GAIE_VALUES_FILE > /dev/null; then
        #     echo "ERROR: Patched $GAIE_VALUES_FILE is not valid YAML"
        #     exit 1
        #   fi
        #
        #   echo "GAIE values patched successfully"
        # else
        #   echo "WARNING: GAIE values file not found at $GAIE_VALUES_FILE, skipping EPP verbosity configuration"
        # fi

    # Step 2: Capture Rendered Manifests
    - name: capture-manifests
      image: ghcr.io/helmfile/helmfile:latest
      workingDir: $(workspaces.source.path)/llm-d-repo/guides/inference-scheduling
      env:
        - name: HOME
          value: /tmp
      script: |
        #!/bin/bash
        set -e

        echo "=== Step 2: Capturing Rendered Manifests ==="

        # Check if manifests-storage workspace is bound
        if [ ! -d "$(workspaces.manifests-storage.path)" ]; then
          echo "Manifests storage workspace not bound - skipping manifest capture"
          exit 0
        fi

        mkdir -p $(workspaces.manifests-storage.path)/rendered

        # Determine environment flag based on gateway provider
        ENV_FLAG=""
        case "$(params.GATEWAY_PROVIDER)" in
          istio)
            ENV_FLAG=""
            ;;
          kgateway)
            ENV_FLAG="-e kgateway"
            ;;
          standalone)
            ENV_FLAG="-e standalone"
            ;;
          gke)
            ENV_FLAG="-e gke"
            ;;
        esac

        NAMESPACE=$(params.NAMESPACE)

        echo "Rendering manifests with helmfile template..."
        helmfile template $ENV_FLAG -n $NAMESPACE > $(workspaces.manifests-storage.path)/rendered/manifests.yaml 2>/dev/null || {
          echo "WARNING: helmfile template failed - manifests will not be captured"
          exit 0
        }

        # Copy the patched values file
        cp ms-inference-scheduling/values.yaml $(workspaces.manifests-storage.path)/rendered/values.yaml || true

        echo "✓ Manifests captured successfully"
        echo "  - Rendered manifests: $(workspaces.manifests-storage.path)/rendered/manifests.yaml"
        echo "  - Values file: $(workspaces.manifests-storage.path)/rendered/values.yaml"

    # Step 4: Deploy with Helmfile
    - name: deploy-llm-d-helmfile
      image: ghcr.io/helmfile/helmfile:latest
      workingDir: $(workspaces.source.path)/llm-d-repo/guides/inference-scheduling
      env:
        - name: HOME
          value: /tmp
        - name: HELM_CACHE_HOME
          value: /tmp/.cache/helm
        - name: HELM_CONFIG_HOME
          value: /tmp/.config/helm
      script: |
        #!/bin/bash
        set -e

        echo "=== Step 2: Deploying with Helmfile ==="

        NAMESPACE=$(params.NAMESPACE)
        RELEASE_NAME=$(params.RELEASE_NAME)
        GATEWAY_PROVIDER=$(params.GATEWAY_PROVIDER)

        # Check for existing releases (idempotency)
        if [ "$(params.SKIP_IF_EXISTS)" = "true" ]; then
          if helm list -n $NAMESPACE 2>/dev/null | grep -q "ms-.*$RELEASE_NAME"; then
            echo "Release already exists - skipping deployment"
            exit 0
          fi
        fi

        # Check helm is accessible
        if ! helm version > /dev/null 2>&1; then
          echo "ERROR: helm command not available"
          exit 1
        fi

        # Initialize helmfile plugins
        if ! helmfile init --force > /dev/null 2>&1; then
          echo "ERROR: Failed to initialize helmfile"
          exit 1
        fi

        # Determine environment flag based on gateway provider
        ENV_FLAG=""
        case "$GATEWAY_PROVIDER" in
          istio)
            ENV_FLAG=""  # Default is istio
            ;;
          kgateway)
            ENV_FLAG="-e kgateway"
            ;;
          standalone)
            ENV_FLAG="-e standalone"
            ;;
          gke)
            ENV_FLAG="-e gke"
            ;;
          *)
            echo "WARNING: Unknown gateway provider: $GATEWAY_PROVIDER, using default (istio)"
            ;;
        esac

        # Set release name postfix environment variable for helmfile
        export RELEASE_NAME_POSTFIX="$RELEASE_NAME"

        # Add PipelineRun labels to pod template for artifact collection
        # Labels are added to decode.template.metadata.labels (pod template level)
        if [ -n "$(params.PIPELINE_RUN_NAME)" ]; then
          echo "Adding PipelineRun labels to pod template..."
          
          # Install yq if not already available
          if [ ! -f /tmp/yq ]; then
            YQ_VERSION="v4.40.5"
            wget -qO /tmp/yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
            chmod +x /tmp/yq
          fi
          
          /tmp/yq -i '.decode.template.metadata.labels."tekton.dev/pipelineRun" = "$(params.PIPELINE_RUN_NAME)"' ms-inference-scheduling/values.yaml
          /tmp/yq -i '.decode.template.metadata.labels."llm-d-bench/managed-by" = "pipeline"' ms-inference-scheduling/values.yaml
          /tmp/yq -i '.decode.template.metadata.labels."llm-d-bench/release" = "$RELEASE_NAME"' ms-inference-scheduling/values.yaml
          echo "  Labels added to decode.template.metadata.labels"
        fi

        # Deploy with helmfile
        set +e
        helmfile apply $ENV_FLAG -n $NAMESPACE --skip-deps=false --suppress-secrets
        HELMFILE_EXIT_CODE=$?
        set -e

        if [ $HELMFILE_EXIT_CODE -ne 0 ]; then
          echo "ERROR: helmfile apply failed with exit code $HELMFILE_EXIT_CODE"
          exit $HELMFILE_EXIT_CODE
        fi

        echo "Deployment complete!"

    # Step 5: Create HTTPRoute
    - name: create-httproute
      image: ghcr.io/helmfile/helmfile:latest
      script: |
        #!/bin/bash
        set -e

        echo "=== Step 3: Creating HTTPRoute ==="

        NAMESPACE=$(params.NAMESPACE)
        RELEASE_NAME=$(params.RELEASE_NAME)

        # Create HTTPRoute
        cat <<EOF | kubectl apply -f - -n $NAMESPACE
        apiVersion: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        metadata:
          name: llm-d-$RELEASE_NAME
        spec:
          parentRefs:
          - group: gateway.networking.k8s.io
            kind: Gateway
            name: infra-$RELEASE_NAME-inference-gateway
          rules:
            - backendRefs:
              - group: inference.networking.x-k8s.io
                kind: InferencePool
                name: gaie-$RELEASE_NAME
                port: 8000
                weight: 1
              matches:
              - path:
                  type: PathPrefix
                  value: /
        EOF

        echo "HTTPRoute created successfully"

    # Step 6: Verify Deployment
    - name: verify-deployment
      image: ghcr.io/helmfile/helmfile:latest
      script: |
        #!/bin/bash
        set -e

        echo "=== Step 4: Verifying Deployment ==="

        NAMESPACE=$(params.NAMESPACE)
        RELEASE_NAME=$(params.RELEASE_NAME)
        TIMEOUT=900  # 15 minutes
        INTERVAL=10  # Check every 10 seconds

        # Function to check pod status
        check_pods() {
          local label=$1
          local component_name=$2

          local ready_count=$(kubectl get pods -n $NAMESPACE -l "$label" -o jsonpath='{.items[*].status.containerStatuses[*].ready}' 2>/dev/null | grep -o "true" | wc -l || echo 0)
          local total_count=$(kubectl get pods -n $NAMESPACE -l "$label" --no-headers 2>/dev/null | wc -l || echo 0)

          echo "  $component_name: $ready_count/$total_count ready"

          if [ "$total_count" -gt 0 ] && [ "$ready_count" -eq "$total_count" ]; then
            return 0
          fi
          return 1
        }

        START_TIME=$(date +%s)
        END_TIME=$((START_TIME + TIMEOUT))

        echo "Waiting for pods to be ready (timeout: ${TIMEOUT}s)..."
        echo ""

        while true; do
          CURRENT_TIME=$(date +%s)

          if [ $CURRENT_TIME -ge $END_TIME ]; then
            echo "ERROR: Timeout waiting for deployment to be ready"
            echo ""
            echo "=== Diagnostic Information ==="
            echo ""
            echo "Helm Releases:"
            helm list -n $NAMESPACE || true
            echo ""
            echo "Pods:"
            kubectl get pods -n $NAMESPACE || true
            echo ""
            echo "Gateway Status:"
            kubectl get gateway -n $NAMESPACE || echo "No gateway found"
            echo ""
            echo "InferencePool Status:"
            kubectl get inferencepool -n $NAMESPACE || echo "No inferencepool found"
            exit 1
          fi

          # Check EPP (External Processing Pod) - GAIE
          EPP_READY=false
          if check_pods "inferencepool=gaie-$RELEASE_NAME-epp" "EPP"; then
            EPP_READY=true
          fi

          # Check Gateway
          GATEWAY_READY=false
          if kubectl get gateway -n $NAMESPACE infra-$RELEASE_NAME-inference-gateway &>/dev/null; then
            GATEWAY_READY=true
            echo "  Gateway: Found"
          else
            echo "  Gateway: Not found"
          fi

          # Check ModelService pods (try both label formats for backward compatibility)
          MS_READY=false
          if check_pods "llm-d.ai/inference-serving=true" "ModelService"; then
            MS_READY=true
          elif check_pods "llm-d.ai/inferenceServing=true" "ModelService (legacy label)"; then
            MS_READY=true
          fi

          echo ""

          # Check if all components are ready
          if [ "$EPP_READY" = "true" ] && [ "$GATEWAY_READY" = "true" ] && [ "$MS_READY" = "true" ]; then
            ELAPSED=$((CURRENT_TIME - START_TIME))
            echo "All components ready! (${ELAPSED}s)"
            exit 0
          fi

          ELAPSED=$((CURRENT_TIME - START_TIME))
          REMAINING=$((TIMEOUT - ELAPSED))
          echo "Waiting for all components (${ELAPSED}s elapsed, ${REMAINING}s remaining)..."
          sleep $INTERVAL
        done
