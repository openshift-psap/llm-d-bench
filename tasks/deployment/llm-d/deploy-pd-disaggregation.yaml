apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: deploy-llm-d-pd-disaggregation
  labels:
    app.kubernetes.io/version: "0.1"
  annotations:
    tekton.dev/displayName: "Deploy llm-d Model with PD Disaggregation"
    tekton.dev/tags: model, deploy, helm, helmfile, llm-d, gitops, pd-disaggregation
    tekton.dev/platforms: "linux/amd64"
spec:
  description: >-
    Deploy a model using PD (Prefill/Decode) Disaggregation with llm-d.
    This task separates prefill and decode workloads into specialized worker pools for
    improved throughput/latency trade-offs on large models (70B+).
    Requires minimum 8 GPUs and RDMA networking (InfiniBand or RoCE).
    This task expects the llm-d repository to be already cloned in the workspace.

  params:
    # Core Model Configuration
    - name: MODEL_NAME
      description: HuggingFace model identifier (e.g., meta-llama/Llama-3.1-70B-Instruct)
      type: string

    - name: MODEL_REVISION
      description: Model revision/branch to deploy
      type: string
      default: "main"

    # Deployment Configuration
    - name: RELEASE_NAME
      description: Unique release name postfix
      type: string

    - name: NAMESPACE
      description: Namespace for deployment
      type: string

    - name: GATEWAY_PROVIDER
      description: "Gateway provider: istio (default), kgateway, standalone, gke"
      type: string
      default: "istio"

    # Replica Configuration
    - name: REPLICAS
      description: Number of replicas (not used for P/D disaggregation, use PREFILL_REPLICAS and DECODE_REPLICAS instead)
      type: string
      default: ""

    # Prefill Worker Configuration
    - name: PREFILL_REPLICAS
      description: Number of prefill worker replicas (recommend 4+ for horizontal scaling)
      type: string
      default: "4"

    - name: PREFILL_TP
      description: Tensor parallelism for prefill workers (recommend 1)
      type: string
      default: "1"

    # Decode Worker Configuration
    - name: DECODE_REPLICAS
      description: Number of decode worker replicas (recommend 1-2)
      type: string
      default: "1"

    - name: DECODE_TP
      description: Tensor parallelism for decode workers (recommend 4+)
      type: string
      default: "4"

    # PD-Specific Configuration
    - name: PD_THRESHOLD
      description: Selective PD threshold (0 = always disaggregate)
      type: string
      default: "0"

    - name: HASH_BLOCK_SIZE
      description: Hash block size for PD profiling in GAIE
      type: string
      default: "5"

    # Storage & Authentication
    - name: MODEL_PVC
      description: PVC name for model storage
      type: string
      default: "models-storage"

    - name: HF_TOKEN_SECRET
      description: Secret name containing HuggingFace token
      type: string
      default: "huggingface-token"

    # Advanced Configuration
    - name: VLLM_ARGS
      description: Additional vLLM arguments as newline-delimited string or array (from merge-configs)
      type: string
      default: ""

    # Networking Configuration
    - name: ENABLE_RDMA
      description: Enable RDMA/InfiniBand networking (requires rdma/ib resources on nodes)
      type: string
      default: "true"

    # Control Flags
    - name: SKIP_IF_EXISTS
      description: Skip deployment if release already exists
      type: string
      default: "true"

  workspaces:
    - name: source
      description: Workspace containing cloned llm-d repository (at llm-d-repo/)

  steps:
    # Step 1: Validate GPU Requirements
    - name: validate-gpu-requirements
      image: ghcr.io/helmfile/helmfile:latest
      script: |
        #!/bin/bash
        set -e

        echo "=== Step 1: Validating GPU Requirements ==="

        # Validate P/D disaggregation parameters
        if [ -z "$(params.PREFILL_REPLICAS)" ] || [ -z "$(params.DECODE_REPLICAS)" ]; then
          echo "ERROR: P/D disaggregation mode requires both PREFILL_REPLICAS and DECODE_REPLICAS"
          echo "  PREFILL_REPLICAS: $(params.PREFILL_REPLICAS)"
          echo "  DECODE_REPLICAS: $(params.DECODE_REPLICAS)"
          echo ""
          echo "For standard mode deployments (without P/D disaggregation), use deploy-llm-d-helmfile task instead."
          exit 1
        fi

        # Warn if REPLICAS is provided
        if [ -n "$(params.REPLICAS)" ]; then
          echo "⚠ WARNING: REPLICAS parameter is not used for P/D disaggregation mode"
          echo "  This task uses PREFILL_REPLICAS and DECODE_REPLICAS instead."
          echo "  REPLICAS=$(params.REPLICAS) will be ignored."
          echo ""
        fi

        PREFILL_REPLICAS=$(params.PREFILL_REPLICAS)
        PREFILL_TP=$(params.PREFILL_TP)
        DECODE_REPLICAS=$(params.DECODE_REPLICAS)
        DECODE_TP=$(params.DECODE_TP)

        TOTAL_GPUS=$((PREFILL_REPLICAS * PREFILL_TP + DECODE_REPLICAS * DECODE_TP))

        echo "Configuration:"
        echo "  Prefill: ${PREFILL_REPLICAS} replicas × ${PREFILL_TP} TP = $((PREFILL_REPLICAS * PREFILL_TP)) GPUs"
        echo "  Decode:  ${DECODE_REPLICAS} replicas × ${DECODE_TP} TP = $((DECODE_REPLICAS * DECODE_TP)) GPUs"
        echo "  Total:   ${TOTAL_GPUS} GPUs"
        echo ""

        if [ $TOTAL_GPUS -lt 8 ]; then
          echo "ERROR: PD disaggregation requires minimum 8 GPUs (current: ${TOTAL_GPUS})"
          echo ""
          echo "Typical configurations:"
          echo "  - 8 GPUs:  4 prefill (TP=1) + 1 decode (TP=4)"
          echo "  - 16 GPUs: 8 prefill (TP=1) + 2 decode (TP=4)"
          echo "  - 16 GPUs: 4 prefill (TP=2) + 2 decode (TP=4)"
          exit 1
        fi

        echo "✓ GPU requirements validated"

    # Step 2: Patch Values with yq
    - name: patch-values
      image: ghcr.io/helmfile/helmfile:latest
      workingDir: $(workspaces.source.path)/llm-d-repo/guides/pd-disaggregation
      env:
        - name: HOME
          value: /tmp
        - name: VLLM_ARGS_INPUT
          value: $(params.VLLM_ARGS)
      script: |
        #!/bin/bash
        set -e

        echo "=== Step 2: Patching Values with yq ==="

        if [ ! -d "$(workspaces.source.path)/llm-d-repo/guides/pd-disaggregation" ]; then
          echo "ERROR: llm-d repository not found at $(workspaces.source.path)/llm-d-repo/guides/pd-disaggregation"
          exit 1
        fi

        # Install yq (mikefarah/yq v4.x)
        YQ_VERSION="v4.40.5"
        if ! wget -qO /tmp/yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"; then
          echo "ERROR: Failed to download yq"
          exit 1
        fi
        chmod +x /tmp/yq

        MS_VALUES_FILE="ms-pd/values.yaml"
        GAIE_VALUES_FILE="gaie-pd/values.yaml"

        # Verify values files exist
        if [ ! -f "$MS_VALUES_FILE" ]; then
          echo "ERROR: values.yaml not found at $MS_VALUES_FILE"
          exit 1
        fi
        if [ ! -f "$GAIE_VALUES_FILE" ]; then
          echo "ERROR: values.yaml not found at $GAIE_VALUES_FILE"
          exit 1
        fi

        # Sanitize model name for PVC path (replace / with -)
        MODEL_NAME_SANITIZED=$(echo "$(params.MODEL_NAME)" | sed 's|/|-|g')

        echo "Patching ModelService values ($MS_VALUES_FILE)..."

        # 1. Model Artifacts Configuration
        /tmp/yq -i '.modelArtifacts.name = "$(params.MODEL_NAME)"' $MS_VALUES_FILE
        /tmp/yq -i '.modelArtifacts.uri = "pvc://$(params.MODEL_PVC)/models/'"$MODEL_NAME_SANITIZED"'"' $MS_VALUES_FILE
        /tmp/yq -i '.modelArtifacts.authSecretName = "$(params.HF_TOKEN_SECRET)"' $MS_VALUES_FILE

        # 2. Prefill Worker Configuration
        echo "  Configuring prefill workers: $(params.PREFILL_REPLICAS) replicas, TP=$(params.PREFILL_TP)..."
        /tmp/yq -i '.prefill.replicas = $(params.PREFILL_REPLICAS)' $MS_VALUES_FILE
        /tmp/yq -i '.prefill.parallelism.tensor = $(params.PREFILL_TP)' $MS_VALUES_FILE

        # Set CUDA_VISIBLE_DEVICES for prefill workers
        PREFILL_TP=$(params.PREFILL_TP)
        if [ "$PREFILL_TP" -gt 1 ]; then
          PREFILL_CUDA=$(seq -s, 0 $((PREFILL_TP-1)))
        else
          PREFILL_CUDA="0"
        fi
        echo "    Setting prefill CUDA_VISIBLE_DEVICES=$PREFILL_CUDA"
        /tmp/yq -i '(.prefill.containers[0].env[] | select(.name == "CUDA_VISIBLE_DEVICES")).value = "'"$PREFILL_CUDA"'"' $MS_VALUES_FILE

        # 2.5. Override prefill ModelService image
        echo "  Setting prefill ModelService image to ghcr.io/llm-d/llm-d-cuda-dev:sha-3222272"
        /tmp/yq -i '.prefill.containers[0].image = "ghcr.io/llm-d/llm-d-cuda-dev:sha-3222272"' $MS_VALUES_FILE

        # 3. Decode Worker Configuration
        echo "  Configuring decode workers: $(params.DECODE_REPLICAS) replicas, TP=$(params.DECODE_TP)..."
        /tmp/yq -i '.decode.replicas = $(params.DECODE_REPLICAS)' $MS_VALUES_FILE
        /tmp/yq -i '.decode.parallelism.tensor = $(params.DECODE_TP)' $MS_VALUES_FILE

        # Set CUDA_VISIBLE_DEVICES for decode workers
        DECODE_TP=$(params.DECODE_TP)
        if [ "$DECODE_TP" -gt 1 ]; then
          DECODE_CUDA=$(seq -s, 0 $((DECODE_TP-1)))
        else
          DECODE_CUDA="0"
        fi
        echo "    Setting decode CUDA_VISIBLE_DEVICES=$DECODE_CUDA"
        /tmp/yq -i '(.decode.containers[0].env[] | select(.name == "CUDA_VISIBLE_DEVICES")).value = "'"$DECODE_CUDA"'"' $MS_VALUES_FILE

        # 3.5. Override decode ModelService image
        echo "  Setting decode ModelService image to ghcr.io/llm-d/llm-d-cuda-dev:sha-3222272"
        /tmp/yq -i '.decode.containers[0].image = "ghcr.io/llm-d/llm-d-cuda-dev:sha-3222272"' $MS_VALUES_FILE

        # 4. Served Model Name (apply to both prefill and decode)
        /tmp/yq -i '.prefill.containers[0].args += ["--served-model-name", "$(params.MODEL_NAME)"]' $MS_VALUES_FILE
        /tmp/yq -i '.decode.containers[0].args += ["--served-model-name", "$(params.MODEL_NAME)"]' $MS_VALUES_FILE

        # 5. Model Revision (if not main)
        if [ "$(params.MODEL_REVISION)" != "main" ]; then
          /tmp/yq -i '.prefill.containers[0].args += ["--revision", "$(params.MODEL_REVISION)"]' $MS_VALUES_FILE
          /tmp/yq -i '.decode.containers[0].args += ["--revision", "$(params.MODEL_REVISION)"]' $MS_VALUES_FILE
        fi

        # 6. Additional vLLM Args (apply to both prefill and decode, parse from newline-delimited string)
        if [ -n "$VLLM_ARGS_INPUT" ]; then
          echo "  Adding vLLM arguments from configuration..."
          while IFS= read -r arg; do
            if [ -n "$arg" ]; then
              echo "    - $arg"
              /tmp/yq -i '.prefill.containers[0].args += ["'"$arg"'"]' $MS_VALUES_FILE
              /tmp/yq -i '.decode.containers[0].args += ["'"$arg"'"]' $MS_VALUES_FILE
            fi
          done <<< "$VLLM_ARGS_INPUT"
        fi

        # 7. RDMA Configuration
        if [ "$(params.ENABLE_RDMA)" != "true" ]; then
          echo "  Disabling RDMA/InfiniBand resources..."
          # Remove rdma/ib from prefill resources
          /tmp/yq -i 'del(.prefill.containers[0].resources.limits."rdma/ib")' $MS_VALUES_FILE
          /tmp/yq -i 'del(.prefill.containers[0].resources.requests."rdma/ib")' $MS_VALUES_FILE
          # Remove rdma/ib from decode resources
          /tmp/yq -i 'del(.decode.containers[0].resources.limits."rdma/ib")' $MS_VALUES_FILE
          /tmp/yq -i 'del(.decode.containers[0].resources.requests."rdma/ib")' $MS_VALUES_FILE
          echo "    ✓ RDMA resources removed from prefill and decode workers"
        fi

        # Validate patched ModelService YAML
        if ! /tmp/yq eval '.' $MS_VALUES_FILE > /dev/null; then
          echo "ERROR: Patched $MS_VALUES_FILE is not valid YAML"
          exit 1
        fi

        echo "Patching GAIE values ($GAIE_VALUES_FILE)..."

        # 7. GAIE PD Configuration
        echo "  Configuring PD handler: threshold=$(params.PD_THRESHOLD), hashBlockSize=$(params.HASH_BLOCK_SIZE)..."

        # Update pd-profile-handler parameters in the YAML string
        /tmp/yq -i '.inferenceExtension.pluginsCustomConfig."pd-config.yaml" |= sub("threshold: [0-9]+", "threshold: $(params.PD_THRESHOLD)")' $GAIE_VALUES_FILE
        /tmp/yq -i '.inferenceExtension.pluginsCustomConfig."pd-config.yaml" |= sub("hashBlockSize: [0-9]+", "hashBlockSize: $(params.HASH_BLOCK_SIZE)")' $GAIE_VALUES_FILE

        # Also update queue-scorer hashBlockSize
        /tmp/yq -i '.inferenceExtension.pluginsCustomConfig."pd-config.yaml" |= sub("(- type: queue-scorer.*?hashBlockSize:) [0-9]+", "${1} $(params.HASH_BLOCK_SIZE)")' $GAIE_VALUES_FILE

        # Validate patched GAIE YAML
        if ! /tmp/yq eval '.' $GAIE_VALUES_FILE > /dev/null; then
          echo "ERROR: Patched $GAIE_VALUES_FILE is not valid YAML"
          exit 1
        fi

        echo "✓ Values patched successfully"

    # Step 3: Deploy with Helmfile
    - name: deploy-llm-d-helmfile
      image: ghcr.io/helmfile/helmfile:latest
      workingDir: $(workspaces.source.path)/llm-d-repo/guides/pd-disaggregation
      env:
        - name: HOME
          value: /tmp
        - name: HELM_CACHE_HOME
          value: /tmp/.cache/helm
        - name: HELM_CONFIG_HOME
          value: /tmp/.config/helm
      script: |
        #!/bin/bash
        set -e

        echo "=== Step 3: Deploying with Helmfile ==="

        NAMESPACE=$(params.NAMESPACE)
        RELEASE_NAME=$(params.RELEASE_NAME)
        GATEWAY_PROVIDER=$(params.GATEWAY_PROVIDER)

        # Check for existing releases (idempotency)
        if [ "$(params.SKIP_IF_EXISTS)" = "true" ]; then
          if helm list -n $NAMESPACE 2>/dev/null | grep -q "ms-.*$RELEASE_NAME"; then
            echo "✓ Release already exists - skipping deployment"
            exit 0
          fi
        fi

        # Check helm is accessible
        if ! helm version > /dev/null 2>&1; then
          echo "ERROR: helm command not available"
          exit 1
        fi

        # Initialize helmfile plugins
        if ! helmfile init --force > /dev/null 2>&1; then
          echo "ERROR: Failed to initialize helmfile"
          exit 1
        fi

        # Determine environment flag based on gateway provider
        ENV_FLAG=""
        case "$GATEWAY_PROVIDER" in
          istio)
            ENV_FLAG=""  # Default is istio
            ;;
          kgateway)
            ENV_FLAG="-e kgateway"
            ;;
          standalone)
            ENV_FLAG="-e standalone"
            ;;
          gke)
            ENV_FLAG="-e gke"
            ;;
          *)
            echo "WARNING: Unknown gateway provider: $GATEWAY_PROVIDER, using default (istio)"
            ;;
        esac

        # Set release name postfix environment variable for helmfile
        export RELEASE_NAME_POSTFIX="$RELEASE_NAME"

        # Deploy with helmfile
        set +e
        helmfile apply $ENV_FLAG -n $NAMESPACE --skip-deps=false --suppress-secrets
        HELMFILE_EXIT_CODE=$?
        set -e

        if [ $HELMFILE_EXIT_CODE -ne 0 ]; then
          echo "ERROR: helmfile apply failed with exit code $HELMFILE_EXIT_CODE"
          exit $HELMFILE_EXIT_CODE
        fi

        echo "✓ Deployment complete!"

    # Step 4: Create HTTPRoute
    - name: create-httproute
      image: ghcr.io/helmfile/helmfile:latest
      script: |
        #!/bin/bash
        set -e

        echo "=== Step 4: Creating HTTPRoute ==="

        NAMESPACE=$(params.NAMESPACE)
        RELEASE_NAME=$(params.RELEASE_NAME)

        # Create HTTPRoute
        cat <<EOF | kubectl apply -f - -n $NAMESPACE
        apiVersion: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        metadata:
          name: llm-d-$RELEASE_NAME
        spec:
          parentRefs:
          - group: gateway.networking.k8s.io
            kind: Gateway
            name: infra-$RELEASE_NAME-inference-gateway
          rules:
            - backendRefs:
              - group: inference.networking.k8s.io
                kind: InferencePool
                name: gaie-$RELEASE_NAME
                port: 8000
                weight: 1
              timeouts:
                backendRequest: 0s
                request: 0s
              matches:
              - path:
                  type: PathPrefix
                  value: /
        EOF

        echo "✓ HTTPRoute created successfully"

    # Step 5: Verify Deployment
    - name: verify-deployment
      image: ghcr.io/helmfile/helmfile:latest
      script: |
        #!/bin/bash
        set -e

        echo "=== Step 5: Verifying Deployment ==="

        NAMESPACE=$(params.NAMESPACE)
        RELEASE_NAME=$(params.RELEASE_NAME)
        TIMEOUT=600  # 10 minutes
        INTERVAL=10  # Check every 10 seconds

        # Function to check pod status
        check_pods() {
          local label=$1
          local component_name=$2

          local ready_count=$(kubectl get pods -n $NAMESPACE -l "$label" -o jsonpath='{.items[*].status.containerStatuses[*].ready}' 2>/dev/null | grep -o "true" | wc -l || echo 0)
          local total_count=$(kubectl get pods -n $NAMESPACE -l "$label" --no-headers 2>/dev/null | wc -l || echo 0)

          echo "  $component_name: $ready_count/$total_count ready"

          if [ "$total_count" -gt 0 ] && [ "$ready_count" -eq "$total_count" ]; then
            return 0
          fi
          return 1
        }

        START_TIME=$(date +%s)
        END_TIME=$((START_TIME + TIMEOUT))

        echo "Waiting for pods to be ready (timeout: ${TIMEOUT}s)..."
        echo ""

        while true; do
          CURRENT_TIME=$(date +%s)

          if [ $CURRENT_TIME -ge $END_TIME ]; then
            echo "ERROR: Timeout waiting for deployment to be ready"
            echo ""
            echo "=== Diagnostic Information ==="
            echo ""
            echo "Helm Releases:"
            helm list -n $NAMESPACE || true
            echo ""
            echo "All Pods:"
            kubectl get pods -n $NAMESPACE || true
            echo ""
            echo "Gateway Status:"
            kubectl get gateway -n $NAMESPACE || echo "No gateway found"
            echo ""
            echo "InferencePool Status:"
            kubectl get inferencepool -n $NAMESPACE || echo "No inferencepool found"
            exit 1
          fi

          # Check EPP (External Processing Pod) - GAIE
          EPP_READY=false
          if check_pods "inferencepool=gaie-$RELEASE_NAME-epp" "EPP"; then
            EPP_READY=true
          fi

          # Check Gateway
          GATEWAY_READY=false
          if kubectl get gateway -n $NAMESPACE infra-$RELEASE_NAME-inference-gateway &>/dev/null; then
            GATEWAY_READY=true
            echo "  Gateway: Found"
          else
            echo "  Gateway: Not found"
          fi

          # Check ModelService pods (both prefill and decode)
          # Using generic label that should match all inference serving pods (try both formats)
          MS_READY=false
          if check_pods "llm-d.ai/inference-serving=true" "ModelService (all workers)"; then
            MS_READY=true
          elif check_pods "llm-d.ai/inferenceServing=true" "ModelService (all workers, legacy label)"; then
            MS_READY=true
          fi

          echo ""

          # Check if all components are ready
          if [ "$EPP_READY" = "true" ] && [ "$GATEWAY_READY" = "true" ] && [ "$MS_READY" = "true" ]; then
            ELAPSED=$((CURRENT_TIME - START_TIME))
            echo "✓ All components ready! (${ELAPSED}s)"
            echo ""
            echo "=== Deployment Summary ==="
            echo "Prefill workers: $(params.PREFILL_REPLICAS) replicas × $(params.PREFILL_TP) TP"
            echo "Decode workers:  $(params.DECODE_REPLICAS) replicas × $(params.DECODE_TP) TP"
            echo "PD threshold:    $(params.PD_THRESHOLD)"
            exit 0
          fi

          ELAPSED=$((CURRENT_TIME - START_TIME))
          REMAINING=$((TIMEOUT - ELAPSED))
          echo "Waiting for all components (${ELAPSED}s elapsed, ${REMAINING}s remaining)..."
          sleep $INTERVAL
        done
