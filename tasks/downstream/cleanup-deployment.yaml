apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup-deployment
  labels:
    app.kubernetes.io/version: "0.1"
  annotations:
    tekton.dev/displayName: "Cleanup Model Deployment"
    tekton.dev/tags: cleanup, deploy, kserve
    tekton.dev/platforms: "linux/amd64"
spec:
  description: >-
    Delete a LLMInferenceService deployment. This task removes the deployment
    but preserves the model files on the PVC for future use.
    Requires the deploy-model-sa service account to have permissions for LLMInferenceService resources.

  params:
    - name: DEPLOYMENT_NAME
      description: Name of the LLMInferenceService to delete
      type: string

    - name: NAMESPACE
      description: Namespace containing the deployment
      type: string

    - name: WAIT_FOR_DELETION
      description: Wait for resource to be fully deleted before completing
      type: string
      default: "true"

    - name: TIMEOUT_SECONDS
      description: Maximum time to wait for deletion (in seconds)
      type: string
      default: "300"

    - name: SKIP_IF_NOT_EXISTS
      description: Don't fail if deployment doesn't exist (idempotency control)
      type: string
      default: "true"

  steps:
    - name: cleanup-deployment
      image: registry.redhat.io/openshift4/ose-cli:latest
      workingDir: /tmp
      script: |
        #!/bin/bash
        set -e

        echo "Cleanup target:"
        echo "  Deployment: $(params.DEPLOYMENT_NAME)"
        echo "  Namespace: $(params.NAMESPACE)"
        echo ""

        # Check if deployment exists
        if ! oc get llminferenceservice "$(params.DEPLOYMENT_NAME)" -n "$(params.NAMESPACE)" 2>/dev/null; then
          if [ "$(params.SKIP_IF_NOT_EXISTS)" = "true" ]; then
            echo "✓ LLMInferenceService $(params.DEPLOYMENT_NAME) does not exist - nothing to clean"
            exit 0
          else
            echo "ERROR: LLMInferenceService $(params.DEPLOYMENT_NAME) not found in namespace $(params.NAMESPACE)"
            exit 1
          fi
        fi

        echo "Deleting LLMInferenceService: $(params.DEPLOYMENT_NAME)"
        oc delete llminferenceservice "$(params.DEPLOYMENT_NAME)" -n "$(params.NAMESPACE)"

        # Wait for deletion if requested
        if [ "$(params.WAIT_FOR_DELETION)" = "true" ]; then
          echo ""
          echo "Waiting for resource deletion (timeout: $(params.TIMEOUT_SECONDS)s)..."

          START_TIME=$(date +%s)
          END_TIME=$((START_TIME + $(params.TIMEOUT_SECONDS)))

          while oc get llminferenceservice "$(params.DEPLOYMENT_NAME)" -n "$(params.NAMESPACE)" 2>/dev/null; do
            CURRENT_TIME=$(date +%s)
            if [ $CURRENT_TIME -ge $END_TIME ]; then
              echo ""
              echo "ERROR: Timeout waiting for deletion after $(params.TIMEOUT_SECONDS)s"
              exit 1
            fi

            ELAPSED=$((CURRENT_TIME - START_TIME))
            echo "  Still deleting... (${ELAPSED}s elapsed)"
            sleep 5
          done

          echo ""
          echo "✓ Resource successfully deleted!"
        fi

        echo ""
        echo "Cleanup complete!"
        echo ""
        echo "Note: Model files remain on the models-storage PVC and can be reused."
        echo "      To remove models, manually delete directories from the PVC."
