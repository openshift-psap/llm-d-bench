apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: merge-configs
  labels:
    app.kubernetes.io/version: "0.1"
  annotations:
    tekton.dev/displayName: "Merge Configuration Profiles"
    tekton.dev/tags: config, merge, profiles
    tekton.dev/platforms: "linux/amd64"
spec:
  description: >-
    Merge configuration profiles from ConfigMaps.
    Reads vLLM, deployment, benchmark, and EPP ConfigMaps and merges their data
    fields into a single JSON object. Pipeline parameters take precedence over
    ConfigMap values (left-to-right merge).

  params:
    # Profile references
    - name: VLLM_CONFIG
      description: vLLM profile ConfigMap name (e.g., "vllm-standard")
      type: string
      default: ""

    - name: DEPLOYMENT_CONFIG
      description: Deployment profile ConfigMap name (e.g., "deployment-llm-d-inference-scheduling")
      type: string
      default: ""

    - name: BENCHMARK_CONFIG
      description: Benchmark profile ConfigMap name (e.g., "guidellm-high-concurrency")
      type: string
      default: ""

    - name: EPP_CONFIG
      description: EPP/GAIE scheduler profile ConfigMap name (e.g., "scheduler-precise-prefix-cache")
      type: string
      default: ""

    - name: NAMESPACE
      description: Namespace where ConfigMaps are located
      type: string
      default: "llm-d-bench"

    # Pass-through params from PipelineRun (these override ConfigMap values)
    - name: MODEL_NAME
      description: Model name (overrides ConfigMap)
      type: string
      default: ""

    - name: MODEL_REVISION
      description: Model revision (overrides ConfigMap)
      type: string
      default: "main"

    - name: TP
      description: Tensor parallelism (overrides ConfigMap)
      type: string
      default: "1"

    - name: REPLICAS
      description: Number of replicas (overrides ConfigMap)
      type: string
      default: "1"

    - name: ACCELERATOR
      description: GPU accelerator type (overrides ConfigMap)
      type: string
      default: ""

    - name: RELEASE_NAME
      description: Release name (overrides ConfigMap)
      type: string
      default: ""

    - name: MLFLOW_EXPERIMENT_NAME
      description: MLflow experiment name (overrides ConfigMap)
      type: string
      default: ""

    - name: GATEWAY_PROVIDER
      description: Gateway provider for computing TARGET_URL
      type: string
      default: "istio"

    - name: TARGET
      description: Override TARGET_URL (if provided, computation is skipped)
      type: string
      default: ""

    - name: IMAGE
      description: Benchmark image (used as fallback if profile doesn't specify GUIDELLM_IMAGE)
      type: string
      default: ""

    - name: LLM_D_REPO_REF
      description: llm-d repository branch/tag/commit (overrides ConfigMap)
      type: string
      default: "main"

  results:
    - name: merged-config
      description: JSON object with merged configuration
    - name: vllm-args
      description: Merged vLLM arguments as newline-delimited string
    - name: deployment-mode
      description: Deployment mode extracted from config
    - name: epp-profile
      description: EPP profile name if EPP_CONFIG was specified
    - name: target-url
      description: Computed or provided target endpoint URL
    - name: guidellm-processor
      description: GuideLLM processor/tokenizer model
    - name: guidellm-backend-type
      description: GuideLLM backend type
    - name: guidellm-rate-type
      description: GuideLLM rate type
    - name: guidellm-rate
      description: GuideLLM rate values
    - name: guidellm-data
      description: GuideLLM data profile
    - name: guidellm-max-seconds
      description: GuideLLM max seconds
    - name: guidellm-max-requests
      description: GuideLLM max requests
    - name: replicas
      description: Number of replicas (standard or inferred from deployment mode)
    - name: prefill-replicas
      description: Number of prefill replicas (PD mode only)
    - name: decode-replicas
      description: Number of decode replicas (PD mode only)
    - name: guidellm-image
      description: GuideLLM benchmark image
    - name: llm-d-repo-ref
      description: llm-d repository branch/tag/commit to use for git-clone
    - name: release-name
      description: Release name (provided or auto-derived from MODEL_NAME)
    - name: block-size
      description: KV cache block size for prefix caching
    - name: hash-seed
      description: Python hash seed for consistent hashing
    - name: zmq-port
      description: ZMQ port for KV-events communication
    - name: scheduler-verbosity
      description: Scheduler logging verbosity level
    - name: enable-cache-metrics
      description: Enable KV cache metrics logging
    - name: cache-scorer-weight
      description: Weight for precise-prefix-cache-scorer
    - name: load-scorer-weight
      description: Weight for load-aware-scorer

  steps:
    - name: merge
      image: docker.io/bitnami/kubectl:latest
      script: |
        #!/bin/bash
        set -e

        echo "=== Configuration Profile Merger ==="
        echo ""

        # Initialize merged config with pipeline params (these take precedence)
        MERGED='{}'

        # Add pass-through params if provided
        if [ -n "$(params.MODEL_NAME)" ]; then
          MERGED=$(echo "$MERGED" | jq --arg val "$(params.MODEL_NAME)" '. + {MODEL_NAME: $val}')
        fi

        if [ -n "$(params.MODEL_REVISION)" ]; then
          MERGED=$(echo "$MERGED" | jq --arg val "$(params.MODEL_REVISION)" '. + {MODEL_REVISION: $val}')
        fi

        if [ -n "$(params.TP)" ]; then
          MERGED=$(echo "$MERGED" | jq --arg val "$(params.TP)" '. + {TP: $val}')
        fi

        if [ -n "$(params.REPLICAS)" ]; then
          MERGED=$(echo "$MERGED" | jq --arg val "$(params.REPLICAS)" '. + {REPLICAS: $val}')
        fi

        if [ -n "$(params.ACCELERATOR)" ]; then
          MERGED=$(echo "$MERGED" | jq --arg val "$(params.ACCELERATOR)" '. + {ACCELERATOR: $val}')
        fi

        if [ -n "$(params.RELEASE_NAME)" ]; then
          MERGED=$(echo "$MERGED" | jq --arg val "$(params.RELEASE_NAME)" '. + {RELEASE_NAME: $val}')
        fi

        if [ -n "$(params.MLFLOW_EXPERIMENT_NAME)" ]; then
          MERGED=$(echo "$MERGED" | jq --arg val "$(params.MLFLOW_EXPERIMENT_NAME)" '. + {MLFLOW_EXPERIMENT_NAME: $val}')
        fi

        if [ -n "$(params.LLM_D_REPO_REF)" ]; then
          MERGED=$(echo "$MERGED" | jq --arg val "$(params.LLM_D_REPO_REF)" '. + {LLM_D_REPO_REF: $val}')
        fi

        # Merge vLLM config
        if [ -n "$(params.VLLM_CONFIG)" ]; then
          echo "Loading vLLM profile: $(params.VLLM_CONFIG)"
          VLLM_DATA=$(kubectl get cm $(params.VLLM_CONFIG) -n $(params.NAMESPACE) -o json | jq '.data')

          if [ "$VLLM_DATA" = "null" ] || [ -z "$VLLM_DATA" ]; then
            echo "ERROR: ConfigMap $(params.VLLM_CONFIG) not found or has no data"
            exit 1
          fi

          MERGED=$(echo "$MERGED $VLLM_DATA" | jq -s '.[0] * .[1]')
          echo "  ✓ Merged vLLM profile"
        fi

        # Merge deployment config
        if [ -n "$(params.DEPLOYMENT_CONFIG)" ]; then
          echo "Loading deployment profile: $(params.DEPLOYMENT_CONFIG)"
          DEPLOY_DATA=$(kubectl get cm $(params.DEPLOYMENT_CONFIG) -n $(params.NAMESPACE) -o json | jq '.data')

          if [ "$DEPLOY_DATA" = "null" ] || [ -z "$DEPLOY_DATA" ]; then
            echo "ERROR: ConfigMap $(params.DEPLOYMENT_CONFIG) not found or has no data"
            exit 1
          fi

          MERGED=$(echo "$MERGED $DEPLOY_DATA" | jq -s '.[0] * .[1]')
          echo "  ✓ Merged deployment profile"
        fi

        # Merge benchmark config
        if [ -n "$(params.BENCHMARK_CONFIG)" ]; then
          echo "Loading benchmark profile: $(params.BENCHMARK_CONFIG)"
          BENCH_DATA=$(kubectl get cm $(params.BENCHMARK_CONFIG) -n $(params.NAMESPACE) -o json | jq '.data')

          if [ "$BENCH_DATA" = "null" ] || [ -z "$BENCH_DATA" ]; then
            echo "ERROR: ConfigMap $(params.BENCHMARK_CONFIG) not found or has no data"
            exit 1
          fi

          MERGED=$(echo "$MERGED $BENCH_DATA" | jq -s '.[0] * .[1]')
          echo "  ✓ Merged benchmark profile"
        fi

        # Merge EPP config (optional, for llm-d only)
        if [ -n "$(params.EPP_CONFIG)" ]; then
          echo "Loading EPP scheduler profile: $(params.EPP_CONFIG)"
          EPP_DATA=$(kubectl get cm $(params.EPP_CONFIG) -n $(params.NAMESPACE) -o json | jq '.data')

          if [ "$EPP_DATA" = "null" ] || [ -z "$EPP_DATA" ]; then
            echo "ERROR: ConfigMap $(params.EPP_CONFIG) not found or has no data"
            exit 1
          fi

          MERGED=$(echo "$MERGED $EPP_DATA" | jq -s '.[0] * .[1]')
          echo "  ✓ Merged EPP scheduler profile"

          # Set EPP profile result
          EPP_PROFILE=$(echo "$EPP_DATA" | jq -r '.EPP_PROFILE // "custom"')
          echo -n "$EPP_PROFILE" > $(results.epp-profile.path)
        else
          echo -n "default" > $(results.epp-profile.path)
        fi

        echo ""
        echo "=== Merged Configuration Summary ==="
        echo "$MERGED" | jq -r 'to_entries | .[] | "  \(.key): \(.value | if type == "string" and (. | contains("\n")) then "..." else . end)"'
        echo ""

        # Write full merged config
        echo "$MERGED" | tee $(results.merged-config.path)

        # Extract specific results
        # vLLM args (convert newline-delimited to array if needed)
        VLLM_ARGS=$(echo "$MERGED" | jq -r '.VLLM_ARGS // ""')
        echo -n "$VLLM_ARGS" > $(results.vllm-args.path)

        # Deployment mode
        DEPLOYMENT_MODE=$(echo "$MERGED" | jq -r '.DEPLOYMENT_MODE // "inference-scheduling"')
        echo -n "$DEPLOYMENT_MODE" > $(results.deployment-mode.path)

        # llm-d repository reference (branch/tag/commit for git-clone)
        LLM_D_REPO_REF=$(echo "$MERGED" | jq -r '.LLM_D_REPO_REF // "main"')
        echo -n "$LLM_D_REPO_REF" > $(results.llm-d-repo-ref.path)

        # GuideLLM benchmark parameters
        # Use profile IMAGE if available, otherwise fall back to pipeline param
        IMAGE_VALUE=$(echo "$MERGED" | jq -r '.IMAGE // ""')
        if [ -z "$IMAGE_VALUE" ] && [ -n "$(params.IMAGE)" ]; then
          IMAGE_VALUE="$(params.IMAGE)"
          echo "Using fallback IMAGE from pipeline parameter: $IMAGE_VALUE"
        fi
        echo -n "$IMAGE_VALUE" > $(results.guidellm-image.path)
        echo -n "$(echo "$MERGED" | jq -r '.GUIDELLM_PROCESSOR // ""')" > $(results.guidellm-processor.path)
        echo -n "$(echo "$MERGED" | jq -r '.GUIDELLM_BACKEND_TYPE // ""')" > $(results.guidellm-backend-type.path)
        echo -n "$(echo "$MERGED" | jq -r '.GUIDELLM_RATE_TYPE // ""')" > $(results.guidellm-rate-type.path)
        echo -n "$(echo "$MERGED" | jq -r '.GUIDELLM_RATE // ""')" > $(results.guidellm-rate.path)
        echo -n "$(echo "$MERGED" | jq -r '.GUIDELLM_DATA // ""')" > $(results.guidellm-data.path)
        echo -n "$(echo "$MERGED" | jq -r '.GUIDELLM_MAX_SECONDS // ""')" > $(results.guidellm-max-seconds.path)
        echo -n "$(echo "$MERGED" | jq -r '.GUIDELLM_MAX_REQUESTS // ""')" > $(results.guidellm-max-requests.path)

        # Replica parameters
        echo -n "$(echo "$MERGED" | jq -r '.REPLICAS // "1"')" > $(results.replicas.path)
        echo -n "$(echo "$MERGED" | jq -r '.PREFILL_REPLICAS // "N/A"')" > $(results.prefill-replicas.path)
        echo -n "$(echo "$MERGED" | jq -r '.DECODE_REPLICAS // "N/A"')" > $(results.decode-replicas.path)

        # Compute TARGET_URL
        if [ -n "$(params.TARGET)" ]; then
          echo "Using provided TARGET: $(params.TARGET)"
          echo -n "$(params.TARGET)" > $(results.target-url.path)
        else
          # Get deployment type from merged config
          DEPLOYMENT_TYPE=$(echo "$MERGED" | jq -r '.DEPLOYMENT_TYPE // ""')
          NAMESPACE="$(params.NAMESPACE)"

          case "$DEPLOYMENT_TYPE" in
            rhoai)
              # RHOAI: KServe workload service based on sanitized MODEL_NAME
              # Pattern: https://{deployment-name}-kserve-workload-svc.{namespace}.svc.cluster.local:8000
              MODEL_NAME="$(params.MODEL_NAME)"
              DEPLOYMENT_NAME=$(echo "$MODEL_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/\//-/g' | sed 's/\.//g' | sed 's/-$//' | cut -c1-42)
              TARGET_URL="https://${DEPLOYMENT_NAME}-kserve-workload-svc.${NAMESPACE}.svc.cluster.local:8000"
              echo "Computed TARGET_URL for RHOAI: $TARGET_URL"
              ;;

            rhaiis)
              # RHAIIS: Direct service based on MODEL_NAME
              MODEL_NAME="$(params.MODEL_NAME)"
              DEPLOYMENT_NAME=$(echo "$MODEL_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/\//-/g' | cut -c1-63)
              TARGET_URL="http://${DEPLOYMENT_NAME}.${NAMESPACE}.svc.cluster.local:8000"
              echo "Computed TARGET_URL for RHAIIS: $TARGET_URL"
              ;;

            llm-d|*)
              # llm-d: Use GATEWAY_PROVIDER and RELEASE_NAME
              GATEWAY_PROVIDER="$(params.GATEWAY_PROVIDER)"
              RELEASE_NAME="$(params.RELEASE_NAME)"

              case "$GATEWAY_PROVIDER" in
                istio)
                  TARGET_URL="http://infra-${RELEASE_NAME}-inference-gateway-istio.${NAMESPACE}.svc.cluster.local:80"
                  ;;
                kgateway)
                  TARGET_URL="http://infra-${RELEASE_NAME}-inference-gateway.${NAMESPACE}.svc.cluster.local:80"
                  ;;
                standalone)
                  TARGET_URL="http://ms-${RELEASE_NAME}.${NAMESPACE}.svc.cluster.local:8000"
                  ;;
                gke)
                  TARGET_URL="http://infra-${RELEASE_NAME}-inference-gateway.${NAMESPACE}.svc.cluster.local:80"
                  ;;
                *)
                  echo "ERROR: Unknown GATEWAY_PROVIDER: $GATEWAY_PROVIDER"
                  exit 1
                  ;;
              esac
              echo "Computed TARGET_URL for llm-d ($GATEWAY_PROVIDER): $TARGET_URL"
              ;;
          esac

          echo -n "$TARGET_URL" > $(results.target-url.path)
        fi

        # Emit release-name result
        if [ -n "$(params.RELEASE_NAME)" ]; then
          echo -n "$(params.RELEASE_NAME)" > $(results.release-name.path)
        else
          # Auto-derive from MODEL_NAME (same logic as RHOAI/RHAIIS deploy tasks)
          DERIVED_NAME=$(echo "$(params.MODEL_NAME)" | tr '[:upper:]' '[:lower:]' | sed 's/\//-/g' | sed 's/\.//g' | sed 's/-$//' | cut -c1-42)
          echo -n "$DERIVED_NAME" > $(results.release-name.path)
        fi
        echo "  Release Name: $(cat $(results.release-name.path))"

        # Prefix cache parameters (with defaults)
        echo -n "$(echo "$MERGED" | jq -r '.BLOCK_SIZE // "64"')" > $(results.block-size.path)
        echo -n "$(echo "$MERGED" | jq -r '.HASH_SEED // "42"')" > $(results.hash-seed.path)
        echo -n "$(echo "$MERGED" | jq -r '.ZMQ_PORT // "5557"')" > $(results.zmq-port.path)
        echo -n "$(echo "$MERGED" | jq -r '.SCHEDULER_VERBOSITY // "4"')" > $(results.scheduler-verbosity.path)
        echo -n "$(echo "$MERGED" | jq -r '.ENABLE_CACHE_METRICS // "true"')" > $(results.enable-cache-metrics.path)
        echo -n "$(echo "$MERGED" | jq -r '.CACHE_SCORER_WEIGHT // "2.0"')" > $(results.cache-scorer-weight.path)
        echo -n "$(echo "$MERGED" | jq -r '.LOAD_SCORER_WEIGHT // "1.0"')" > $(results.load-scorer-weight.path)

        echo "✓ Configuration merge completed successfully"
