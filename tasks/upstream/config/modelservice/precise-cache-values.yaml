# Precise Cache-Aware ModelService Configuration
# Model artifacts configuration
modelArtifacts:
  name: "{{ .Values.modelName }}"
  labels:
    llm-d.ai/inferenceServing: "true"
    llm-d.ai/model: "{{ .Values.modelName | replace \"/\" \"_\" }}"
  uri: "pvc://{{ .Values.modelPvc }}/models/{{ .Values.modelName | replace \"/\" \"-\" }}"
  authSecretName: "{{ .Values.hfTokenSecret }}"
  mountPath: /model-cache

# Decode pod configuration with prefix caching enabled
decode:
  create: true
  replicas: "{{ .Values.replicas }}"
  containers:
    - name: vllm
      image: vllm/vllm-openai:v0.6.3
      modelCommand: vllmServe
      args:
        - "--model"
        - "/model-cache"
        - "--tensor-parallel-size"
        - "{{ .Values.tp }}"
        - "--served-model-name"
        - "{{ .Values.modelName }}"
        - "--enable-prefix-caching"
        - "--kv-cache-dtype"
        - "auto"
      mountModelVolume: true
      resources:
        limits:
          nvidia.com/gpu: "{{ .Values.tp }}"
        requests:
          nvidia.com/gpu: "{{ .Values.tp }}"

# Prefill pod configuration (disabled for this profile)
prefill:
  create: false

# Routing configuration
routing:
  servicePort: 8000
  proxy:
    enabled: true
