# Infrastructure (Gateway) Configuration
gateway:
  enabled: true

  replicas: 1

  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "2"
      memory: "2Gi"

# Istio Gateway Configuration
istio:
  enabled: true
  gateway:
    name: "llm-d-gateway"
    selector:
      istio: ingressgateway
    servers:
      - port:
          number: 80
          name: http
          protocol: HTTP
        hosts:
          - "*"

monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s
