# GAIE (Gateway API Inference Extension) Configuration
inferenceExtension:
  replicas: 1
  image:
    hub: registry.k8s.io/gateway-api-inference-extension
    name: epp
    tag: v1.2.0
    pullPolicy: Always

inferencePool:
  # REQUIRED: Labels to match model server pods
  modelServers:
    matchLabels:
      llm-d.ai/inferenceServing: "true"
  targetPorts:
    - number: 8000
  modelServerType: vllm

# Gateway provider configuration
provider:
  name: istio
