apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: deploy-helmfile
  labels:
    app.kubernetes.io/version: "0.7"
  annotations:
    tekton.dev/displayName: "Deploy Upstream Model with llm-d GitOps"
    tekton.dev/tags: model, deploy, helm, helmfile, upstream, gitops
    tekton.dev/platforms: "linux/amd64"
spec:
  description: >-
    Deploy a model using GitOps approach with the llm-d inference-scheduling guide.
    This task expects the llm-d repository to be already cloned in the workspace,
    patches values.yaml with yq, deploys using the upstream helmfile, and creates
    the HTTPRoute. Use with git-clone task to clone https://github.com/llm-d/llm-d first.

  params:
    # Core Model Configuration
    - name: MODEL_NAME
      description: HuggingFace model identifier (e.g., meta-llama/Llama-3.1-8B)
      type: string

    - name: MODEL_REVISION
      description: Model revision/branch to deploy
      type: string
      default: "main"

    # Deployment Configuration
    - name: RELEASE_NAME
      description: Unique release name postfix
      type: string

    - name: NAMESPACE
      description: Namespace for deployment
      type: string

    - name: GATEWAY_PROVIDER
      description: "Gateway provider: istio (default), kgateway, standalone, gke"
      type: string
      default: "istio"

    # Scaling & Resources
    - name: MODEL_REPLICAS
      description: Number of vLLM worker replicas
      type: string
      default: "1"

    - name: TP
      description: Tensor parallelism size (GPUs per pod)
      type: string
      default: "1"

    # Storage & Authentication
    - name: MODEL_PVC
      description: PVC name for model storage
      type: string
      default: "models-storage"

    - name: HF_TOKEN_SECRET
      description: Secret name containing HuggingFace token
      type: string
      default: "huggingface-token"

    # Advanced Configuration
    - name: VLLM_ARGS
      description: Additional vLLM arguments as array
      type: array
      default: []

    # Control Flags
    - name: SKIP_IF_EXISTS
      description: Skip deployment if release already exists
      type: string
      default: "true"

  workspaces:
    - name: source
      description: Workspace containing cloned llm-d repository (at llm-d-repo/)

  steps:
    # Step 1: Patch Values with yq
    - name: patch-values
      image: ghcr.io/helmfile/helmfile:latest
      workingDir: $(workspaces.source.path)/llm-d-repo/guides/inference-scheduling
      env:
        - name: HOME
          value: /tmp
      args:
        - $(params.VLLM_ARGS[*])
      script: |
        #!/bin/bash
        set -e

        echo "=== Step 1: Patching Values with yq ==="
        echo ""

        # Verify llm-d repository was cloned
        if [ ! -d "$(workspaces.source.path)/llm-d-repo/guides/inference-scheduling" ]; then
          echo "ERROR: llm-d repository not found or incomplete"
          echo "Expected path: $(workspaces.source.path)/llm-d-repo/guides/inference-scheduling"
          echo ""
          echo "Contents of workspace:"
          ls -la $(workspaces.source.path)/
          exit 1
        fi

        echo "✓ Found llm-d repository at $(workspaces.source.path)/llm-d-repo"
        echo ""

        # Install yq (mikefarah/yq v4.x)
        echo "Installing yq..."
        YQ_VERSION="v4.40.5"
        if ! wget -qO /tmp/yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"; then
          echo "ERROR: Failed to download yq"
          exit 1
        fi
        chmod +x /tmp/yq

        VALUES_FILE="ms-inference-scheduling/values.yaml"

        # Verify values file exists
        if [ ! -f "$VALUES_FILE" ]; then
          echo "ERROR: values.yaml not found at $VALUES_FILE"
          echo "Directory contents:"
          ls -la ms-inference-scheduling/
          exit 1
        fi

        echo "Original values.yaml:"
        echo "---"
        cat $VALUES_FILE
        echo "---"
        echo ""

        echo "Applying patches..."
        echo "  Model: $(params.MODEL_NAME)"
        echo "  Replicas: $(params.MODEL_REPLICAS)"
        echo "  TP: $(params.TP)"
        echo "  PVC: $(params.MODEL_PVC)"
        echo ""

        # Sanitize model name for PVC path (replace / with -)
        MODEL_NAME_SANITIZED=$(echo "$(params.MODEL_NAME)" | sed 's|/|-|g')

        # 1. Model Artifacts Configuration
        /tmp/yq -i '.modelArtifacts.name = "$(params.MODEL_NAME)"' $VALUES_FILE
        /tmp/yq -i '.modelArtifacts.uri = "pvc://$(params.MODEL_PVC)/models/'"$MODEL_NAME_SANITIZED"'"' $VALUES_FILE
        /tmp/yq -i '.modelArtifacts.authSecretName = "$(params.HF_TOKEN_SECRET)"' $VALUES_FILE

        # 2. Replicas
        /tmp/yq -i '.decode.replicas = $(params.MODEL_REPLICAS)' $VALUES_FILE

        # 3. Tensor Parallelism and GPU Resources
        TP=$(params.TP)
        if [ "$TP" -gt 1 ]; then
          echo "  Configuring TP=$TP..."
          /tmp/yq -i '.decode.containers[0].args += ["--tensor-parallel-size", "'"$TP"'"]' $VALUES_FILE
          /tmp/yq -i '.decode.containers[0].resources.limits."nvidia.com/gpu" = '"$TP" $VALUES_FILE
          /tmp/yq -i '.decode.containers[0].resources.requests."nvidia.com/gpu" = '"$TP" $VALUES_FILE
        else
          echo "  Configuring single GPU..."
          /tmp/yq -i '.decode.containers[0].resources.limits."nvidia.com/gpu" = 1' $VALUES_FILE
          /tmp/yq -i '.decode.containers[0].resources.requests."nvidia.com/gpu" = 1' $VALUES_FILE
        fi

        # 4. Served Model Name
        /tmp/yq -i '.decode.containers[0].args += ["--served-model-name", "$(params.MODEL_NAME)"]' $VALUES_FILE

        # 5. Model Revision (if not main)
        if [ "$(params.MODEL_REVISION)" != "main" ]; then
          echo "  Setting model revision: $(params.MODEL_REVISION)"
          /tmp/yq -i '.decode.containers[0].args += ["--revision", "$(params.MODEL_REVISION)"]' $VALUES_FILE
        fi

        # 6. Additional vLLM Args
        echo "  Processing additional vLLM args..."
        for arg in "$@"; do
          if [ -n "$arg" ]; then
            echo "    Adding arg: $arg"
            /tmp/yq -i '.decode.containers[0].args += ["'"$arg"'"]' $VALUES_FILE
          fi
        done

        # Validate patched YAML
        if ! /tmp/yq eval '.' $VALUES_FILE > /dev/null; then
          echo "ERROR: Patched values.yaml is not valid YAML"
          echo "This may indicate a yq version incompatibility"
          cat $VALUES_FILE
          exit 1
        fi

        echo ""
        echo "✓ Values patched successfully"
        echo ""
        echo "Patched values.yaml:"
        echo "---"
        cat $VALUES_FILE
        echo "---"

    # Step 2: Deploy with Helmfile
    - name: deploy-helmfile
      image: ghcr.io/helmfile/helmfile:latest
      workingDir: $(workspaces.source.path)/llm-d-repo/guides/inference-scheduling
      env:
        - name: HOME
          value: /tmp
        - name: HELM_CACHE_HOME
          value: /tmp/.cache/helm
        - name: HELM_CONFIG_HOME
          value: /tmp/.config/helm
      script: |
        #!/bin/bash
        set -e

        echo "=== Step 2: Deploying with Helmfile ==="
        echo ""

        NAMESPACE=$(params.NAMESPACE)
        RELEASE_NAME=$(params.RELEASE_NAME)
        GATEWAY_PROVIDER=$(params.GATEWAY_PROVIDER)

        echo "Deployment Configuration:"
        echo "  Namespace: $NAMESPACE"
        echo "  Release Postfix: $RELEASE_NAME"
        echo "  Gateway Provider: $GATEWAY_PROVIDER"
        echo ""

        # Check for existing releases (idempotency)
        if [ "$(params.SKIP_IF_EXISTS)" = "true" ]; then
          if helm list -n $NAMESPACE 2>/dev/null | grep -q "ms-.*$RELEASE_NAME"; then
            echo "✓ Release already exists - skipping deployment"
            echo ""
            echo "Existing releases:"
            helm list -n $NAMESPACE | grep "$RELEASE_NAME" || true
            exit 0
          fi
        fi

        # Check helm is accessible
        if ! helm version; then
          echo "ERROR: helm command not available"
          echo "Container image may be incorrect"
          exit 1
        fi

        # Initialize helmfile plugins
        echo "Initializing helmfile..."
        if ! helmfile init --force; then
          echo "ERROR: Failed to initialize helmfile"
          exit 1
        fi

        # Determine environment flag based on gateway provider
        ENV_FLAG=""
        case "$GATEWAY_PROVIDER" in
          istio)
            ENV_FLAG=""  # Default is istio
            ;;
          kgateway)
            ENV_FLAG="-e kgateway"
            ;;
          standalone)
            ENV_FLAG="-e standalone"
            ;;
          gke)
            ENV_FLAG="-e gke"
            ;;
          *)
            echo "WARNING: Unknown gateway provider: $GATEWAY_PROVIDER, using default (istio)"
            ;;
        esac

        # Set release name postfix environment variable for helmfile
        export RELEASE_NAME_POSTFIX="$RELEASE_NAME"

        # Deploy with helmfile
        echo "Running helmfile apply..."
        echo "  Command: helmfile apply $ENV_FLAG -n $NAMESPACE --skip-deps=false --suppress-secrets"
        echo ""

        set +e
        helmfile apply $ENV_FLAG -n $NAMESPACE --skip-deps=false --suppress-secrets
        HELMFILE_EXIT_CODE=$?
        set -e

        if [ $HELMFILE_EXIT_CODE -ne 0 ]; then
          echo "ERROR: helmfile apply failed with exit code $HELMFILE_EXIT_CODE"
          echo ""
          echo "Checking Helm releases:"
          helm list -n $NAMESPACE || true
          echo ""
          echo "Checking pods:"
          kubectl get pods -n $NAMESPACE || true
          exit $HELMFILE_EXIT_CODE
        fi

        echo ""
        echo "✓ Deployment complete!"
        echo "  Infrastructure: infra-inference-scheduling-$RELEASE_NAME"
        echo "  GAIE Pool: gaie-inference-scheduling-$RELEASE_NAME"
        echo "  Model Service: ms-inference-scheduling-$RELEASE_NAME"
        echo ""
        echo "Deployed releases:"
        helm list -n $NAMESPACE | grep "$RELEASE_NAME" || true

    # Step 3: Create HTTPRoute
    - name: create-httproute
      image: ghcr.io/helmfile/helmfile:latest
      script: |
        #!/bin/bash
        set -e

        echo "=== Step 3: Creating HTTPRoute ==="
        echo ""

        NAMESPACE=$(params.NAMESPACE)
        RELEASE_NAME=$(params.RELEASE_NAME)

        echo "HTTPRoute Configuration:"
        echo "  Name: llm-d-$RELEASE_NAME"
        echo "  Gateway: infra-$RELEASE_NAME-inference-gateway"
        echo "  InferencePool: gaie-$RELEASE_NAME"
        echo ""

        # Create HTTPRoute
        cat <<EOF | kubectl apply -f - -n $NAMESPACE
        apiVersion: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        metadata:
          name: llm-d-$RELEASE_NAME
        spec:
          parentRefs:
          - group: gateway.networking.k8s.io
            kind: Gateway
            name: infra-$RELEASE_NAME-inference-gateway
          rules:
            - backendRefs:
              - group: inference.networking.k8s.io
                kind: InferencePool
                name: gaie-$RELEASE_NAME
                port: 8000
                weight: 1
              timeouts:
                backendRequest: 0s
                request: 0s
              matches:
              - path:
                  type: PathPrefix
                  value: /
        EOF

        echo ""
        echo "✓ HTTPRoute created successfully"
        echo ""

    # Step 4: Verify Deployment
    - name: verify-deployment
      image: ghcr.io/helmfile/helmfile:latest
      script: |
        #!/bin/bash
        set -e

        echo "=== Step 4: Verifying Deployment ==="
        echo ""

        NAMESPACE=$(params.NAMESPACE)
        RELEASE_NAME=$(params.RELEASE_NAME)
        TIMEOUT=600  # 10 minutes
        INTERVAL=10  # Check every 10 seconds

        echo "Verification Configuration:"
        echo "  Namespace: $NAMESPACE"
        echo "  Release: $RELEASE_NAME"
        echo "  Timeout: ${TIMEOUT}s"
        echo ""

        # Function to check pod status
        check_pods() {
          local label=$1
          local component_name=$2

          local ready_count=$(kubectl get pods -n $NAMESPACE -l "$label" -o jsonpath='{.items[*].status.containerStatuses[*].ready}' 2>/dev/null | grep -o "true" | wc -l || echo 0)
          local total_count=$(kubectl get pods -n $NAMESPACE -l "$label" --no-headers 2>/dev/null | wc -l || echo 0)

          echo "  $component_name: $ready_count/$total_count ready"

          if [ "$total_count" -gt 0 ] && [ "$ready_count" -eq "$total_count" ]; then
            return 0
          fi
          return 1
        }

        START_TIME=$(date +%s)
        END_TIME=$((START_TIME + TIMEOUT))

        echo "Waiting for pods to be ready (timeout: ${TIMEOUT}s)..."
        echo ""

        while true; do
          CURRENT_TIME=$(date +%s)

          if [ $CURRENT_TIME -ge $END_TIME ]; then
            echo "ERROR: Timeout waiting for deployment to be ready"
            echo ""
            echo "=== Diagnostic Information ==="
            echo ""
            echo "Helm Releases:"
            helm list -n $NAMESPACE || true
            echo ""
            echo "Pods:"
            kubectl get pods -n $NAMESPACE || true
            echo ""
            echo "Gateway Status:"
            kubectl get gateway -n $NAMESPACE || echo "No gateway found"
            echo ""
            echo "InferencePool Status:"
            kubectl get inferencepool -n $NAMESPACE || echo "No inferencepool found"
            exit 1
          fi

          # Check EPP (External Processing Pod) - GAIE
          EPP_READY=false
          if check_pods "app.kubernetes.io/name=epp" "EPP"; then
            EPP_READY=true
          fi

          # Check Gateway
          GATEWAY_READY=false
          if kubectl get gateway -n $NAMESPACE inference-gateway &>/dev/null; then
            GATEWAY_READY=true
            echo "  Gateway: Found"
          else
            echo "  Gateway: Not found"
          fi

          # Check ModelService pods
          MS_READY=false
          if check_pods "llm-d.ai/inferenceServing=true" "ModelService"; then
            MS_READY=true
          fi

          echo ""

          # Check if all components are ready
          if [ "$EPP_READY" = "true" ] && [ "$GATEWAY_READY" = "true" ] && [ "$MS_READY" = "true" ]; then
            ELAPSED=$((CURRENT_TIME - START_TIME))
            echo "✓ All components ready! (${ELAPSED}s)"
            echo ""
            echo "=== Deployment Summary ==="
            echo ""
            echo "Pods:"
            kubectl get pods -n $NAMESPACE || true
            echo ""
            echo "Gateway:"
            kubectl get gateway -n $NAMESPACE || true
            echo ""
            echo "InferencePool:"
            kubectl get inferencepool -n $NAMESPACE || true
            exit 0
          fi

          ELAPSED=$((CURRENT_TIME - START_TIME))
          REMAINING=$((TIMEOUT - ELAPSED))
          echo "Waiting for all components (${ELAPSED}s elapsed, ${REMAINING}s remaining)..."
          sleep $INTERVAL
        done
