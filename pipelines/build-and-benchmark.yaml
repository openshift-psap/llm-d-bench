apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: build-and-benchmark
  labels:
    app.kubernetes.io/version: "0.1"
  annotations:
    tekton.dev/displayName: "Build Image and Run Benchmark"
    tekton.dev/tags: image-build, benchmark, llm
spec:
  description: >-
    Complete workflow that clones source, builds the custom GuideLLM image,
    and then runs a benchmark. Useful for development and testing when the
    image needs to be updated before running benchmarks.

  params:
    # Git parameters
    - name: GIT_URL
      description: Git repository URL
      type: string
      default: "https://github.com/openshift-psap/llm-d-bench.git"

    - name: GIT_REVISION
      description: Git revision to checkout (branch, tag, sha, ref)
      type: string
      default: "main"

    # Build parameters
    - name: IMAGE_NAME
      description: Name of the image to build
      type: string
      default: "guidellm-custom"

    - name: IMAGE_TAG
      description: Tag for the built image
      type: string
      default: "latest"

    - name: REGISTRY
      description: Container registry URL
      type: string
      default: "image-registry.openshift-image-registry.svc:5000"

    - name: NAMESPACE
      description: Namespace where image will be pushed
      type: string
      default: "downstream-llm-d"

    - name: GUIDELLM_VERSION
      description: GuideLLM base image version
      type: string
      default: "v0.3.1"

    # Benchmark parameters
    - name: TARGET
      description: Target inference endpoint URL
      type: string

    - name: MODEL
      description: Model name/identifier
      type: string

    - name: PROCESSOR
      description: Tokenizer/processor model name (optional)
      type: string
      default: ""

    - name: BACKEND_TYPE
      description: Backend type for the inference server
      type: string
      default: "openai_http"

    - name: RATE_TYPE
      description: Rate strategy (concurrent or synchronous)
      type: string
      default: "concurrent"

    - name: RATE
      description: Comma-separated list of rates to test
      type: string

    - name: DATA
      description: Request data profile
      type: string
      default: "prompt_tokens=1000,output_tokens=1000"

    - name: MAX_SECONDS
      description: Maximum duration per rate in seconds
      type: string
      default: "600"

    - name: MAX_REQUESTS
      description: Maximum number of requests per rate (optional)
      type: string
      default: ""

    - name: ACCELERATOR
      description: Accelerator type tag
      type: string
      default: ""

    - name: EXPERIMENT_NAME
      description: MLflow experiment name
      type: string
      default: "guidellm-benchmarks"

    - name: MLFLOW_ENABLED
      description: Enable MLflow tracking
      type: string
      default: "false"

    - name: MLFLOW_TRACKING_URI
      description: MLflow tracking server URI
      type: string
      default: ""

    - name: TAGS
      description: Additional tags as JSON object
      type: string
      default: "{}"

    - name: SKIP_HEALTH_CHECK
      description: Skip waiting for endpoint health check
      type: string
      default: "false"

    - name: HEALTH_CHECK_TIMEOUT
      description: Health check timeout in seconds
      type: string
      default: "3600"

    - name: VERSION
      description: Version identifier for visualization reports (e.g., RHOAI-3.0)
      type: string
      default: ""

    - name: TP
      description: Tensor parallelism size for visualization reports
      type: string
      default: "1"

  workspaces:
    - name: source
      description: Workspace for source code and build context

    - name: results
      description: Workspace for storing benchmark results (optional)
      optional: true

  results:
    - name: IMAGE_DIGEST
      description: Digest of the built image
      value: $(tasks.build-image.results.IMAGE_DIGEST)

    - name: IMAGE_URL
      description: Full URL of the built image
      value: $(tasks.build-image.results.IMAGE_URL)

    - name: COMMIT
      description: The precise commit SHA that was built
      value: $(tasks.git-clone.results.COMMIT)

  tasks:
    - name: git-clone
      taskRef:
        name: git-clone
      params:
        - name: URL
          value: $(params.GIT_URL)
        - name: REVISION
          value: $(params.GIT_REVISION)
      workspaces:
        - name: output
          workspace: source

    - name: build-image
      runAfter:
        - git-clone
      taskRef:
        name: buildah-build
      params:
        - name: IMAGE_NAME
          value: $(params.IMAGE_NAME)
        - name: IMAGE_TAG
          value: $(params.IMAGE_TAG)
        - name: REGISTRY
          value: $(params.REGISTRY)
        - name: NAMESPACE
          value: $(params.NAMESPACE)
        - name: GUIDELLM_VERSION
          value: $(params.GUIDELLM_VERSION)
      workspaces:
        - name: source
          workspace: source

    - name: wait-for-endpoint
      when:
        - input: "$(params.SKIP_HEALTH_CHECK)"
          operator: in
          values: ["false"]
      runAfter:
        - build-image
      taskRef:
        name: wait-for-endpoint
      params:
        - name: TARGET_URL
          value: $(params.TARGET)
        - name: ENDPOINT_PATH
          value: "/v1/models"
        - name: TIMEOUT_SECONDS
          value: $(params.HEALTH_CHECK_TIMEOUT)
        - name: RETRY_INTERVAL
          value: "10"
        - name: VERIFY_TLS
          value: "false"

    - name: run-benchmark
      runAfter:
        - wait-for-endpoint
      taskRef:
        name: run-benchmark
      params:
        - name: IMAGE
          value: $(tasks.build-image.results.IMAGE_URL)
        - name: TARGET
          value: $(params.TARGET)
        - name: MODEL
          value: $(params.MODEL)
        - name: PROCESSOR
          value: $(params.PROCESSOR)
        - name: BACKEND_TYPE
          value: $(params.BACKEND_TYPE)
        - name: RATE_TYPE
          value: $(params.RATE_TYPE)
        - name: RATE
          value: $(params.RATE)
        - name: DATA
          value: $(params.DATA)
        - name: MAX_SECONDS
          value: $(params.MAX_SECONDS)
        - name: MAX_REQUESTS
          value: $(params.MAX_REQUESTS)
        - name: ACCELERATOR
          value: $(params.ACCELERATOR)
        - name: EXPERIMENT_NAME
          value: $(params.EXPERIMENT_NAME)
        - name: MLFLOW_ENABLED
          value: $(params.MLFLOW_ENABLED)
        - name: MLFLOW_TRACKING_URI
          value: $(params.MLFLOW_TRACKING_URI)
        - name: TAGS
          value: $(params.TAGS)
        - name: VERSION
          value: $(params.VERSION)
        - name: TP
          value: $(params.TP)
      workspaces:
        - name: results
          workspace: results
