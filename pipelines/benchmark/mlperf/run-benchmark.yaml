apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: mlperf-run-benchmark-pipeline
  labels:
    app.kubernetes.io/version: "0.1"
  annotations:
    tekton.dev/displayName: "Run MLPerf Benchmark"
    tekton.dev/tags: benchmark, llm, mlperf
spec:
  description: >-
    Run an MLPerf benchmark against an LLM inference endpoint. This pipeline
    assumes the custom MLPerf image already exists and datasets are uploaded.
    It optionally waits for the endpoint to be ready, then executes the benchmark.


  params:
    # Common parameters
    - name: IMAGE
      description: |
        Full URL of the MLPerf custom image.
        Example: image-registry.openshift-image-registry.svc:5000/<namespace>/mlperf-custom:latest
      type: string
      default: "image-registry.openshift-image-registry.svc:5000/llm-d-bench/mlperf-custom:latest"

    - name: TARGET
      description: Target inference endpoint URL
      type: string

    - name: MODEL
      description: Model name/identifier
      type: string

    - name: EXPERIMENT_NAME
      description: MLflow experiment name
      type: string
      default: "mlperf-benchmarks"

    - name: MLFLOW_ENABLED
      description: Enable MLflow tracking
      type: string
      default: "false"

    - name: TAGS
      description: Additional tags as array of key=value pairs
      type: array
      default: []

    - name: VERSION
      description: Version identifier for visualization reports
      type: string
      default: ""

    - name: TP
      description: Tensor parallelism size
      type: string
      default: "1"

    - name: ACCELERATOR
      description: Accelerator type tag
      type: string
      default: ""

    - name: BENCHMARK_ENV_VARS
      description: Additional environment variables
      type: array
      default: []

    # MLPerf-specific parameters
    - name: MLPERF_DATASET_NAME
      description: Dataset filename (MLPerf only)
      type: string
      default: "cnn_eval.json"

    - name: MLPERF_SCENARIO
      description: MLPerf scenario (MLPerf only)
      type: string
      default: "Offline"

    - name: MLPERF_TEST_MODE
      description: MLPerf test mode (MLPerf only)
      type: string
      default: "accuracy"

    - name: MLPERF_BATCH_SIZE
      description: Batch size (MLPerf only)
      type: string
      default: ""

    - name: MLPERF_NUM_SAMPLES
      description: Number of samples (MLPerf only)
      type: string
      default: "4388"

    - name: MLPERF_OUTPUT_DIR
      description: Output directory (MLPerf only)
      type: string
      default: "./test-run"

    - name: MLPERF_SERVER_TARGET_QPS
      description: Target QPS for Server scenario (MLPerf only)
      type: string
      default: "10"

    # Pipeline control parameters
    - name: SKIP_HEALTH_CHECK
      description: Skip waiting for endpoint health check
      type: string
      default: "false"

    - name: HEALTH_CHECK_TIMEOUT
      description: Health check timeout in seconds
      type: string
      default: "3600"

  workspaces:
    - name: models-storage
      description: PVC containing datasets at /datasets/ subdirectory

    - name: results
      description: Workspace for storing benchmark results (optional)
      optional: true

  tasks:
    - name: wait-for-endpoint
      when:
        - input: "$(params.SKIP_HEALTH_CHECK)"
          operator: in
          values: ["false"]
      taskRef:
        name: wait-for-endpoint
      params:
        - name: TARGET_URL
          value: $(params.TARGET)
        - name: ENDPOINT_PATH
          value: "/v1/models"
        - name: TIMEOUT_SECONDS
          value: $(params.HEALTH_CHECK_TIMEOUT)
        - name: RETRY_INTERVAL
          value: "10"
        - name: VERIFY_TLS
          value: "false"

    - name: run-mlperf-benchmark
      runAfter:
        - wait-for-endpoint
      timeout: "2h"
      taskRef:
        name: run-mlperf-benchmark
      params:
        - name: IMAGE
          value: $(params.IMAGE)
        - name: TARGET
          value: $(params.TARGET)
        - name: MODEL
          value: $(params.MODEL)
        - name: EXPERIMENT_NAME
          value: $(params.EXPERIMENT_NAME)
        - name: MLFLOW_ENABLED
          value: $(params.MLFLOW_ENABLED)
        - name: TAGS
          value: $(params.TAGS[*])
        - name: VERSION
          value: $(params.VERSION)
        - name: TP
          value: $(params.TP)
        - name: ACCELERATOR
          value: $(params.ACCELERATOR)
        - name: BENCHMARK_ENV_VARS
          value: $(params.BENCHMARK_ENV_VARS[*])
        - name: MLPERF_DATASET_NAME
          value: $(params.MLPERF_DATASET_NAME)
        - name: MLPERF_SCENARIO
          value: $(params.MLPERF_SCENARIO)
        - name: MLPERF_TEST_MODE
          value: $(params.MLPERF_TEST_MODE)
        - name: MLPERF_BATCH_SIZE
          value: $(params.MLPERF_BATCH_SIZE)
        - name: MLPERF_NUM_SAMPLES
          value: $(params.MLPERF_NUM_SAMPLES)
        - name: MLPERF_OUTPUT_DIR
          value: $(params.MLPERF_OUTPUT_DIR)
        - name: MLPERF_SERVER_TARGET_QPS
          value: $(params.MLPERF_SERVER_TARGET_QPS)
      workspaces:
        - name: models-storage
          workspace: models-storage
        - name: results
          workspace: results
