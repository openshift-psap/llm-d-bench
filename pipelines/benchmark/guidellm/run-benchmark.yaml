apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: guidellm-run-benchmark-pipeline
  labels:
    app.kubernetes.io/version: "0.1"
  annotations:
    tekton.dev/displayName: "Run GuideLLM Benchmark"
    tekton.dev/tags: benchmark, llm
spec:
  description: >-
    Run a GuideLLM benchmark against an LLM inference endpoint. This pipeline
    assumes the custom GuideLLM image already exists. It optionally waits for
    the endpoint to be ready, then executes the benchmark.


  params:
    - name: IMAGE
      description: |
        Full URL of the GuideLLM custom image.
        The namespace portion (/llm-d-bench/) should match the namespace where the image was built.
        If building in a different namespace, override this parameter accordingly.
        Example: image-registry.openshift-image-registry.svc:5000/<your-namespace>/guidellm-custom:latest
      type: string
      default: "image-registry.openshift-image-registry.svc:5000/llm-d-bench/guidellm-custom:latest"

    - name: TARGET
      description: Target inference endpoint URL
      type: string

    - name: MODEL
      description: Model name/identifier
      type: string

    - name: GUIDELLM_PROCESSOR
      description: Tokenizer/processor model name (GuideLLM only, optional)
      type: string
      default: ""

    - name: GUIDELLM_BACKEND_TYPE
      description: Backend type for the inference server (GuideLLM only)
      type: string
      default: "openai_http"

    - name: GUIDELLM_RATE_TYPE
      description: Rate strategy - concurrent or synchronous (GuideLLM only)
      type: string
      default: "concurrent"

    - name: GUIDELLM_RATE
      description: Comma-separated list of rates to test (GuideLLM only)
      type: string
      default: ""

    - name: GUIDELLM_DATA
      description: Request data profile (GuideLLM only)
      type: string
      default: "prompt_tokens=1000,output_tokens=1000"

    - name: GUIDELLM_MAX_SECONDS
      description: Maximum duration per rate in seconds (GuideLLM only)
      type: string
      default: "600"

    - name: GUIDELLM_MAX_REQUESTS
      description: Maximum number of requests per rate (GuideLLM only, optional)
      type: string
      default: ""

    - name: ACCELERATOR
      description: Accelerator type tag
      type: string
      default: ""

    - name: EXPERIMENT_NAME
      description: MLflow experiment name
      type: string
      default: "guidellm-benchmarks"

    - name: MLFLOW_ENABLED
      description: Enable MLflow tracking
      type: string
      default: "false"

    - name: MLFLOW_TRACKING_URI
      description: MLflow tracking server URI
      type: string
      default: ""

    - name: TAGS
      description: Additional tags as JSON object
      type: string
      default: "{}"

    - name: SKIP_HEALTH_CHECK
      description: Skip waiting for endpoint health check
      type: string
      default: "false"

    - name: HEALTH_CHECK_TIMEOUT
      description: Health check timeout in seconds
      type: string
      default: "3600"

    - name: VERSION
      description: Version identifier for visualization reports (e.g., RHOAI-3.0)
      type: string
      default: ""

    - name: TP
      description: Tensor parallelism size for visualization reports
      type: string
      default: "1"

  workspaces:
    - name: results
      description: Workspace for storing benchmark results (optional, only for PVC mode)
      optional: true

  tasks:
    - name: wait-for-endpoint
      when:
        - input: "$(params.SKIP_HEALTH_CHECK)"
          operator: in
          values: ["false"]
      taskRef:
        name: wait-for-endpoint
      params:
        - name: TARGET_URL
          value: $(params.TARGET)
        - name: ENDPOINT_PATH
          value: "/v1/models"
        - name: TIMEOUT_SECONDS
          value: $(params.HEALTH_CHECK_TIMEOUT)
        - name: RETRY_INTERVAL
          value: "10"
        - name: VERIFY_TLS
          value: "false"

    - name: guidellm-run-benchmark-pipeline
      runAfter:
        - wait-for-endpoint
      timeout: "2h"
      taskRef:
        name: guidellm-run-benchmark-pipeline
      params:
        - name: IMAGE
          value: $(params.IMAGE)
        - name: TARGET
          value: $(params.TARGET)
        - name: MODEL
          value: $(params.MODEL)
        - name: GUIDELLM_PROCESSOR
          value: $(params.GUIDELLM_PROCESSOR)
        - name: GUIDELLM_BACKEND_TYPE
          value: $(params.GUIDELLM_BACKEND_TYPE)
        - name: GUIDELLM_RATE_TYPE
          value: $(params.GUIDELLM_RATE_TYPE)
        - name: GUIDELLM_RATE
          value: $(params.GUIDELLM_RATE)
        - name: GUIDELLM_DATA
          value: $(params.GUIDELLM_DATA)
        - name: GUIDELLM_MAX_SECONDS
          value: $(params.GUIDELLM_MAX_SECONDS)
        - name: GUIDELLM_MAX_REQUESTS
          value: $(params.GUIDELLM_MAX_REQUESTS)
        - name: ACCELERATOR
          value: $(params.ACCELERATOR)
        - name: EXPERIMENT_NAME
          value: $(params.EXPERIMENT_NAME)
        - name: MLFLOW_ENABLED
          value: $(params.MLFLOW_ENABLED)
        - name: MLFLOW_TRACKING_URI
          value: $(params.MLFLOW_TRACKING_URI)
        - name: TAGS
          value: $(params.TAGS)
        - name: VERSION
          value: $(params.VERSION)
        - name: TP
          value: $(params.TP)
      workspaces:
        - name: results
          workspace: results
