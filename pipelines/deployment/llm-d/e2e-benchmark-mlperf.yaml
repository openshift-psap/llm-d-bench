apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: llm-d-end-to-end-benchmark-mlperf
  labels:
    app.kubernetes.io/version: "0.2"
  annotations:
    tekton.dev/displayName: "llm-d End-to-End Benchmark (MLPerf)"
    tekton.dev/tags: benchmark, llm, lifecycle, llm-d, helmfile, mlperf
spec:
  description: >-
    Complete llm-d model lifecycle pipeline with MLPerf benchmarking: download model from HuggingFace,
    deploy using Helmfile (llm-d infrastructure + GAIE + model service), run MLPerf benchmark,
    and cleanup deployment. Each stage can be optionally skipped via parameters.

  params:
    # Model Configuration
    - name: MODEL_NAME
      description: HuggingFace model identifier (e.g., meta-llama/Llama-3.1-8B)
      type: string

    - name: MODEL_REVISION
      description: Model revision to download (git branch/tag/commit)
      type: string
      default: "main"

    # Deployment Configuration
    - name: RELEASE_NAME
      description: Unique release name for this deployment
      type: string

    - name: NAMESPACE
      description: Namespace for deployment
      type: string

    - name: GATEWAY_PROVIDER
      description: "Gateway provider: istio (default), kgateway, standalone, gke"
      type: string
      default: "istio"

    - name: MODEL_REPLICAS
      description: Number of model replicas
      type: string
      default: "1"

    - name: HF_TOKEN_SECRET
      description: Secret name containing HuggingFace token
      type: string
      default: "huggingface-token"

    - name: VLLM_ARGS
      description: Additional vLLM arguments as array
      type: array
      default: []

    # llm-d Repository Configuration
    - name: LLM_D_REPO_URL
      description: llm-d repository URL (for testing forks)
      type: string
      default: "https://github.com/llm-d/llm-d.git"

    - name: LLM_D_REPO_REF
      description: llm-d repository branch/tag/commit
      type: string
      default: "main"

    # Benchmark Configuration
    - name: IMAGE
      description: |
        Full URL of the MLPerf custom image.
        The namespace portion should match the namespace where the image was built.
        Example: image-registry.openshift-image-registry.svc:5000/<your-namespace>/mlperf-custom:latest
      type: string
      default: "image-registry.openshift-image-registry.svc:5000/llm-d-bench/mlperf-custom:latest"

    - name: TARGET
      description: Target inference endpoint URL
      type: string

    - name: ACCELERATOR
      description: Accelerator type tag
      type: string
      default: ""

    - name: EXPERIMENT_NAME
      description: MLflow experiment name
      type: string
      default: "mlperf-benchmarks-llm-d"

    - name: MLFLOW_ENABLED
      description: Enable MLflow tracking
      type: string
      default: "false"

    - name: TAGS
      description: Additional tags as array of key=value pairs (e.g., ["version=3.0", "team=ai"])
      type: array
      default: []

    - name: VERSION
      description: Version identifier for visualization reports
      type: string
      default: ""

    - name: TP
      description: Tensor parallelism size (number of GPUs for deployment and benchmark)
      type: string
      default: "1"

    - name: BENCHMARK_ENV_VARS
      description: Additional environment variables for the benchmark container as array of name=value pairs
      type: array
      default: []

    # MLPerf-specific Benchmark Parameters
    - name: DATASET_NAME
      description: Dataset filename (e.g., "cnn_eval.json")
      type: string
      default: "cnn_eval.json"

    - name: SCENARIO
      description: MLPerf scenario (Offline, Server, SingleStream, MultiStream)
      type: string
      default: "Offline"

    - name: TEST_MODE
      description: MLPerf test mode (accuracy or performance)
      type: string
      default: "accuracy"

    - name: BATCH_SIZE
      description: Batch size for MLPerf
      type: string
      default: ""

    - name: NUM_SAMPLES
      description: Number of samples for MLPerf
      type: string
      default: "4388"

    - name: OUTPUT_DIR
      description: Output directory for MLPerf results
      type: string
      default: "./test-run"

    - name: SERVER_TARGET_QPS
      description: Target QPS for MLPerf Server scenario
      type: string
      default: "10"

    # GuideLLM parameters (unused but for compatibility)
    - name: PROCESSOR
      description: Unused by MLPerf
      type: string
      default: ""

    - name: BACKEND_TYPE
      description: Unused by MLPerf
      type: string
      default: ""

    - name: RATE_TYPE
      description: Unused by MLPerf
      type: string
      default: ""

    - name: RATE
      description: Unused by MLPerf
      type: string
      default: "1"

    - name: DATA
      description: Unused by MLPerf
      type: string
      default: ""

    - name: MAX_SECONDS
      description: Unused by MLPerf
      type: string
      default: ""

    - name: MAX_REQUESTS
      description: Unused by MLPerf
      type: string
      default: ""

    # Health Check Configuration
    - name: HEALTH_CHECK_TIMEOUT
      description: Endpoint health check timeout in seconds
      type: string
      default: "3600"

    # Stage Control Parameters
    - name: SKIP_DOWNLOAD
      description: Skip model download stage
      type: string
      default: "false"

    - name: SKIP_DEPLOY
      description: Skip model deployment stage
      type: string
      default: "false"

    - name: SKIP_BENCHMARK
      description: Skip benchmark execution stage
      type: string
      default: "false"

    - name: SKIP_CLEANUP
      description: Skip deployment cleanup stage
      type: string
      default: "false"

  workspaces:
    - name: models-storage
      description: PVC for model storage and datasets (required for download and benchmark stages)

    - name: source
      description: Workspace for cloning llm-d repository (required for deploy stage)

    - name: results
      description: PVC for benchmark results (optional, only for non-MLflow mode)
      optional: true

  tasks:
    # Stage 1: Download Model
    - name: download-model
      when:
        - input: "$(params.SKIP_DOWNLOAD)"
          operator: in
          values: ["false"]
      taskRef:
        name: download-model
      params:
        - name: MODEL_NAME
          value: $(params.MODEL_NAME)
        - name: MODEL_REVISION
          value: $(params.MODEL_REVISION)
        - name: SKIP_IF_EXISTS
          value: "true"
      workspaces:
        - name: models-storage
          workspace: models-storage

    # Stage 2a: Clone llm-d Repository
    - name: git-clone-llm-d
      when:
        - input: "$(params.SKIP_DEPLOY)"
          operator: in
          values: ["false"]
      taskRef:
        name: guidellm-git-clone
      params:
        - name: URL
          value: $(params.LLM_D_REPO_URL)
        - name: REVISION
          value: $(params.LLM_D_REPO_REF)
        - name: SUBDIRECTORY
          value: "llm-d-repo"
      workspaces:
        - name: output
          workspace: source

    # Stage 2b: Deploy with Helmfile (GitOps)
    - name: deploy-llm-d-helmfile
      runAfter:
        - download-model
        - git-clone-llm-d
      when:
        - input: "$(params.SKIP_DEPLOY)"
          operator: in
          values: ["false"]
      taskRef:
        name: deploy-llm-d-helmfile
      params:
        - name: MODEL_NAME
          value: $(params.MODEL_NAME)
        - name: MODEL_REVISION
          value: $(params.MODEL_REVISION)
        - name: RELEASE_NAME
          value: $(params.RELEASE_NAME)
        - name: NAMESPACE
          value: $(params.NAMESPACE)
        - name: GATEWAY_PROVIDER
          value: $(params.GATEWAY_PROVIDER)
        - name: MODEL_REPLICAS
          value: $(params.MODEL_REPLICAS)
        - name: TP
          value: $(params.TP)
        - name: HF_TOKEN_SECRET
          value: $(params.HF_TOKEN_SECRET)
        - name: VLLM_ARGS
          value: $(params.VLLM_ARGS[*])
        - name: SKIP_IF_EXISTS
          value: "true"
      workspaces:
        - name: source
          workspace: source

    # Stage 3: Wait for Endpoint
    - name: wait-for-endpoint
      runAfter:
        - deploy-llm-d-helmfile
      when:
        - input: "$(params.SKIP_BENCHMARK)"
          operator: in
          values: ["false"]
      taskRef:
        name: wait-for-endpoint
      params:
        - name: TARGET_URL
          value: $(params.TARGET)
        - name: ENDPOINT_PATH
          value: "/v1/models"
        - name: TIMEOUT_SECONDS
          value: $(params.HEALTH_CHECK_TIMEOUT)
        - name: RETRY_INTERVAL
          value: "10"
        - name: VERIFY_TLS
          value: "false"

    # Stage 4: Run MLPerf Benchmark
    - name: run-mlperf-benchmark
      runAfter:
        - wait-for-endpoint
      when:
        - input: "$(params.SKIP_BENCHMARK)"
          operator: in
          values: ["false"]
      timeout: "2h"
      taskRef:
        name: run-mlperf-benchmark
      params:
        - name: IMAGE
          value: $(params.IMAGE)
        - name: TARGET
          value: $(params.TARGET)
        - name: MODEL
          value: $(params.MODEL_NAME)
        - name: ACCELERATOR
          value: $(params.ACCELERATOR)
        - name: EXPERIMENT_NAME
          value: $(params.EXPERIMENT_NAME)
        - name: MLFLOW_ENABLED
          value: $(params.MLFLOW_ENABLED)
        - name: TAGS
          value: $(params.TAGS[*])
        - name: VERSION
          value: $(params.VERSION)
        - name: TP
          value: $(params.TP)
        - name: BENCHMARK_ENV_VARS
          value: $(params.BENCHMARK_ENV_VARS[*])
        - name: DATASET_NAME
          value: $(params.DATASET_NAME)
        - name: SCENARIO
          value: $(params.SCENARIO)
        - name: TEST_MODE
          value: $(params.TEST_MODE)
        - name: BATCH_SIZE
          value: $(params.BATCH_SIZE)
        - name: NUM_SAMPLES
          value: $(params.NUM_SAMPLES)
        - name: OUTPUT_DIR
          value: $(params.OUTPUT_DIR)
        - name: SERVER_TARGET_QPS
          value: $(params.SERVER_TARGET_QPS)
        - name: RATE
          value: $(params.RATE)
        - name: DATA
          value: $(params.DATA)
        - name: PROCESSOR
          value: $(params.PROCESSOR)
        - name: MAX_SECONDS
          value: $(params.MAX_SECONDS)
        - name: MAX_REQUESTS
          value: $(params.MAX_REQUESTS)
        - name: BACKEND_TYPE
          value: $(params.BACKEND_TYPE)
        - name: RATE_TYPE
          value: $(params.RATE_TYPE)
      workspaces:
        - name: models-storage
          workspace: models-storage
        - name: results
          workspace: results

    # Stage 5: Cleanup Deployment
    - name: cleanup-deployment
      runAfter:
        - run-mlperf-benchmark
      when:
        - input: "$(params.SKIP_CLEANUP)"
          operator: in
          values: ["false"]
      taskRef:
        name: cleanup-llm-d-deployment
      params:
        - name: RELEASE_NAME
          value: $(params.RELEASE_NAME)
        - name: NAMESPACE
          value: $(params.NAMESPACE)
        - name: WAIT_FOR_DELETION
          value: "true"
        - name: SKIP_IF_NOT_EXISTS
          value: "true"
