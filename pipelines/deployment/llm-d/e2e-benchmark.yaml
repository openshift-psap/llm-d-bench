apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: llm-d-end-to-end-benchmark
  labels:
    app.kubernetes.io/version: "0.2"
  annotations:
    tekton.dev/displayName: "llm-d End-to-End Benchmark"
    tekton.dev/tags: benchmark, llm, lifecycle, llm-d, helmfile
spec:
  description: >-
    Complete llm-d model lifecycle pipeline: download model from HuggingFace,
    deploy using Helmfile (llm-d infrastructure + GAIE + model service), run benchmark,
    and cleanup deployment. Each stage can be optionally skipped via parameters.

  params:
    # Model Configuration
    - name: MODEL_NAME
      description: HuggingFace model identifier (e.g., meta-llama/Llama-3.1-8B)
      type: string

    - name: MODEL_REVISION
      description: Model revision to download (git branch/tag/commit)
      type: string
      default: "main"

    # Deployment Configuration
    - name: DEPLOYMENT_MODE
      description: "Deployment mode: inference-scheduling (default) or pd-disaggregation"
      type: string
      default: "inference-scheduling"

    - name: RELEASE_NAME
      description: Unique release name for this deployment
      type: string

    - name: NAMESPACE
      description: Namespace for deployment
      type: string

    - name: GATEWAY_PROVIDER
      description: "Gateway provider: istio (default), kgateway, standalone, gke"
      type: string
      default: "istio"

    # Inference-Scheduling Mode Parameters (only used when DEPLOYMENT_MODE=inference-scheduling)
    - name: REPLICAS
      description: Number of model replicas (inference-scheduling mode only)
      type: string
      default: "1"

    - name: TP
      description: Tensor parallelism size (inference-scheduling mode and benchmark)
      type: string
      default: "1"

    # PD Disaggregation Mode Parameters (only used when DEPLOYMENT_MODE=pd-disaggregation)
    - name: PREFILL_REPLICAS
      description: Number of prefill worker replicas (pd-disaggregation mode only)
      type: string
      default: "4"

    - name: PREFILL_TP
      description: Tensor parallelism for prefill workers (pd-disaggregation mode only)
      type: string
      default: "1"

    - name: DECODE_REPLICAS
      description: Number of decode worker replicas (pd-disaggregation mode only)
      type: string
      default: "1"

    - name: DECODE_TP
      description: Tensor parallelism for decode workers (pd-disaggregation mode only)
      type: string
      default: "4"

    - name: PD_THRESHOLD
      description: Selective PD threshold (pd-disaggregation mode only, 0 = always disaggregate)
      type: string
      default: "0"

    - name: HASH_BLOCK_SIZE
      description: Hash block size for PD profiling in GAIE (pd-disaggregation mode only)
      type: string
      default: "5"

    - name: ENABLE_RDMA
      description: Enable RDMA/InfiniBand networking (pd-disaggregation mode only, requires rdma/ib resources)
      type: string
      default: "true"

    # Common Parameters
    - name: HF_TOKEN_SECRET
      description: Secret name containing HuggingFace token
      type: string
      default: "huggingface-token"

    - name: VLLM_ARGS
      description: Additional vLLM arguments as array
      type: array
      default: []

    # llm-d Repository Configuration
    - name: LLM_D_REPO_URL
      description: llm-d repository URL (for testing forks)
      type: string
      default: "https://github.com/llm-d/llm-d.git"

    - name: LLM_D_REPO_REF
      description: llm-d repository branch/tag/commit
      type: string
      default: "main"

    # Benchmark Configuration
    - name: IMAGE
      description: |
        Full URL of the GuideLLM custom image.
        The namespace portion (/llm-d-bench/) should match the namespace where the image was built.
        If building in a different namespace, override this parameter accordingly.
        Example: image-registry.openshift-image-registry.svc:5000/<your-namespace>/guidellm-custom:latest
      type: string
      default: "image-registry.openshift-image-registry.svc:5000/llm-d-bench/guidellm-custom:latest"

    - name: TARGET
      description: Target inference endpoint URL
      type: string

    # GuideLLM-specific Parameters (all optional)
    - name: GUIDELLM_PROCESSOR
      description: Tokenizer/processor model name (GuideLLM only, optional)
      type: string
      default: ""

    - name: GUIDELLM_BACKEND_TYPE
      description: Backend type for the inference server (GuideLLM only)
      type: string
      default: ""

    - name: GUIDELLM_RATE_TYPE
      description: Rate strategy - concurrent or synchronous (GuideLLM only)
      type: string
      default: ""

    - name: GUIDELLM_RATE
      description: Comma-separated list of rates to test (GuideLLM only)
      type: string
      default: ""

    - name: GUIDELLM_DATA
      description: Request data profile (GuideLLM only)
      type: string
      default: ""

    - name: GUIDELLM_MAX_SECONDS
      description: Maximum duration per rate in seconds (GuideLLM only)
      type: string
      default: ""

    - name: GUIDELLM_MAX_REQUESTS
      description: Maximum number of requests per rate (GuideLLM only, optional)
      type: string
      default: ""

    - name: ACCELERATOR
      description: Accelerator type tag
      type: string
      default: ""

    - name: MLFLOW_EXPERIMENT_NAME
      description: MLflow experiment name
      type: string
      default: "guidellm-benchmarks-llm-d"

    - name: MLFLOW_ENABLED
      description: Enable MLflow tracking
      type: string
      default: "false"

    - name: MLFLOW_TAGS
      description: Additional tags as array of key=value pairs (e.g., ["version=3.0", "team=ai"])
      type: array
      default: []

    - name: VERSION
      description: Version identifier for visualization reports
      type: string
      default: ""

    - name: BENCHMARK_ENV_VARS
      description: Additional environment variables for the benchmark container as array of name=value pairs
      type: array
      default: []

    # MLPerf-specific Parameters (all optional)
    - name: MLPERF_DATASET_NAME
      description: Dataset filename (MLPerf only, e.g., "cnn_eval.json")
      type: string
      default: ""

    - name: MLPERF_SCENARIO
      description: MLPerf scenario - Offline, Server, SingleStream, MultiStream (MLPerf only)
      type: string
      default: ""

    - name: MLPERF_TEST_MODE
      description: MLPerf test mode - accuracy or performance (MLPerf only)
      type: string
      default: ""

    - name: MLPERF_BATCH_SIZE
      description: Batch size for inference (MLPerf only)
      type: string
      default: ""

    - name: MLPERF_NUM_SAMPLES
      description: Number of samples to process (MLPerf only)
      type: string
      default: ""

    - name: MLPERF_OUTPUT_DIR
      description: Output directory for results (MLPerf only)
      type: string
      default: ""

    - name: MLPERF_SERVER_TARGET_QPS
      description: Target QPS for Server scenario (MLPerf only)
      type: string
      default: ""

    # Health Check Configuration
    - name: HEALTH_CHECK_TIMEOUT
      description: Endpoint health check timeout in seconds
      type: string
      default: "3600"

    # Stage Control Parameters
    - name: SKIP_DOWNLOAD
      description: Skip model download stage
      type: string
      default: "false"

    - name: SKIP_DEPLOY
      description: Skip model deployment stage
      type: string
      default: "false"

    - name: SKIP_BENCHMARK
      description: Skip benchmark execution stage
      type: string
      default: "false"

    - name: SKIP_CLEANUP
      description: Skip deployment cleanup stage
      type: string
      default: "false"

  workspaces:
    - name: models-storage
      description: PVC for model storage (required for download stage)

    - name: source
      description: Workspace for cloning llm-d repository (required for deploy stage)

    - name: results
      description: PVC for benchmark results (optional, only for non-MLflow mode)
      optional: true

  tasks:
    # Stage 1: Download Model
    - name: download-model
      when:
        - input: "$(params.SKIP_DOWNLOAD)"
          operator: in
          values: ["false"]
      taskRef:
        name: download-model
      params:
        - name: MODEL_NAME
          value: $(params.MODEL_NAME)
        - name: MODEL_REVISION
          value: $(params.MODEL_REVISION)
        - name: SKIP_IF_EXISTS
          value: "true"
      workspaces:
        - name: models-storage
          workspace: models-storage

    # Stage 2a: Clone llm-d Repository
    - name: git-clone-llm-d
      runAfter:
        - download-model
      when:
        - input: "$(params.SKIP_DEPLOY)"
          operator: in
          values: ["false"]
      taskRef:
        name: git-clone
      params:
        - name: URL
          value: $(params.LLM_D_REPO_URL)
        - name: REVISION
          value: $(params.LLM_D_REPO_REF)
        - name: SUBDIRECTORY
          value: "llm-d-repo"
      workspaces:
        - name: output
          workspace: source

    # Stage 2b: Deploy with Helmfile - Inference Scheduling Mode
    - name: deploy-llm-d-helmfile
      runAfter:
        - git-clone-llm-d
      when:
        - input: "$(params.SKIP_DEPLOY)"
          operator: in
          values: ["false"]
        - input: "$(params.DEPLOYMENT_MODE)"
          operator: in
          values: ["inference-scheduling"]
      taskRef:
        name: deploy-llm-d-helmfile
      params:
        - name: MODEL_NAME
          value: $(params.MODEL_NAME)
        - name: MODEL_REVISION
          value: $(params.MODEL_REVISION)
        - name: RELEASE_NAME
          value: $(params.RELEASE_NAME)
        - name: NAMESPACE
          value: $(params.NAMESPACE)
        - name: GATEWAY_PROVIDER
          value: $(params.GATEWAY_PROVIDER)
        - name: REPLICAS
          value: $(params.REPLICAS)
        - name: TP
          value: $(params.TP)
        - name: HF_TOKEN_SECRET
          value: $(params.HF_TOKEN_SECRET)
        - name: VLLM_ARGS
          value: $(params.VLLM_ARGS[*])
        - name: SKIP_IF_EXISTS
          value: "true"
      workspaces:
        - name: source
          workspace: source

    # Stage 2c: Deploy with Helmfile - PD Disaggregation Mode
    - name: deploy-llm-d-pd-disaggregation
      runAfter:
        - git-clone-llm-d
      when:
        - input: "$(params.SKIP_DEPLOY)"
          operator: in
          values: ["false"]
        - input: "$(params.DEPLOYMENT_MODE)"
          operator: in
          values: ["pd-disaggregation"]
      taskRef:
        name: deploy-llm-d-pd-disaggregation
      params:
        - name: MODEL_NAME
          value: $(params.MODEL_NAME)
        - name: MODEL_REVISION
          value: $(params.MODEL_REVISION)
        - name: RELEASE_NAME
          value: $(params.RELEASE_NAME)
        - name: NAMESPACE
          value: $(params.NAMESPACE)
        - name: GATEWAY_PROVIDER
          value: $(params.GATEWAY_PROVIDER)
        - name: PREFILL_REPLICAS
          value: $(params.PREFILL_REPLICAS)
        - name: PREFILL_TP
          value: $(params.PREFILL_TP)
        - name: DECODE_REPLICAS
          value: $(params.DECODE_REPLICAS)
        - name: DECODE_TP
          value: $(params.DECODE_TP)
        - name: PD_THRESHOLD
          value: $(params.PD_THRESHOLD)
        - name: HASH_BLOCK_SIZE
          value: $(params.HASH_BLOCK_SIZE)
        - name: ENABLE_RDMA
          value: $(params.ENABLE_RDMA)
        - name: HF_TOKEN_SECRET
          value: $(params.HF_TOKEN_SECRET)
        - name: VLLM_ARGS
          value: $(params.VLLM_ARGS[*])
        - name: SKIP_IF_EXISTS
          value: "true"
      workspaces:
        - name: source
          workspace: source

    # Stage 3: Wait for Endpoint
    - name: wait-for-endpoint
      runAfter:
        - deploy-llm-d-helmfile
        - deploy-llm-d-pd-disaggregation
      when:
        - input: "$(params.SKIP_BENCHMARK)"
          operator: in
          values: ["false"]
      taskRef:
        name: wait-for-endpoint
      params:
        - name: TARGET_URL
          value: $(params.TARGET)
        - name: ENDPOINT_PATH
          value: "/v1/models"
        - name: TIMEOUT_SECONDS
          value: $(params.HEALTH_CHECK_TIMEOUT)
        - name: RETRY_INTERVAL
          value: "10"
        - name: VERIFY_TLS
          value: "false"

    # Stage 3b: Detect Benchmark Type
    - name: detect-benchmark-type
      runAfter:
        - wait-for-endpoint
      when:
        - input: "$(params.SKIP_BENCHMARK)"
          operator: in
          values: ["false"]
      taskRef:
        name: detect-benchmark-type
      params:
        - name: IMAGE
          value: $(params.IMAGE)

    # Stage 4a: Run GuideLLM Benchmark (if IMAGE doesn't contain "mlperf")
    - name: run-guidellm-benchmark
      runAfter:
        - detect-benchmark-type
      when:
        - input: "$(params.SKIP_BENCHMARK)"
          operator: in
          values: ["false"]
        - input: "$(tasks.detect-benchmark-type.results.BENCHMARK_TYPE)"
          operator: in
          values: ["guidellm"]
      timeout: "2h"
      taskRef:
        name: run-guidellm-benchmark
      params:
        - name: IMAGE
          value: $(params.IMAGE)
        - name: TARGET
          value: $(params.TARGET)
        - name: MODEL
          value: $(params.MODEL_NAME)
        - name: GUIDELLM_PROCESSOR
          value: $(params.GUIDELLM_PROCESSOR)
        - name: GUIDELLM_BACKEND_TYPE
          value: $(params.GUIDELLM_BACKEND_TYPE)
        - name: GUIDELLM_RATE_TYPE
          value: $(params.GUIDELLM_RATE_TYPE)
        - name: GUIDELLM_RATE
          value: $(params.GUIDELLM_RATE)
        - name: GUIDELLM_DATA
          value: $(params.GUIDELLM_DATA)
        - name: GUIDELLM_MAX_SECONDS
          value: $(params.GUIDELLM_MAX_SECONDS)
        - name: GUIDELLM_MAX_REQUESTS
          value: $(params.GUIDELLM_MAX_REQUESTS)
        - name: ACCELERATOR
          value: $(params.ACCELERATOR)
        - name: MLFLOW_EXPERIMENT_NAME
          value: $(params.MLFLOW_EXPERIMENT_NAME)
        - name: MLFLOW_ENABLED
          value: $(params.MLFLOW_ENABLED)
        - name: MLFLOW_TAGS
          value: $(params.MLFLOW_TAGS[*])
        - name: VERSION
          value: $(params.VERSION)
        - name: TP
          value: $(params.TP)
        - name: REPLICAS
          value: $(params.REPLICAS)
        - name: PREFILL_REPLICAS
          value: $(params.PREFILL_REPLICAS)
        - name: DECODE_REPLICAS
          value: $(params.DECODE_REPLICAS)
        - name: BENCHMARK_ENV_VARS
          value: $(params.BENCHMARK_ENV_VARS[*])
      workspaces:
        - name: results
          workspace: results

    # Stage 4b: Run MLPerf Benchmark (if IMAGE contains "mlperf")
    - name: run-mlperf-benchmark
      runAfter:
        - detect-benchmark-type
      when:
        - input: "$(params.SKIP_BENCHMARK)"
          operator: in
          values: ["false"]
        - input: "$(tasks.detect-benchmark-type.results.BENCHMARK_TYPE)"
          operator: in
          values: ["mlperf"]
      timeout: "2h"
      taskRef:
        name: run-mlperf-benchmark
      params:
        - name: IMAGE
          value: $(params.IMAGE)
        - name: TARGET
          value: $(params.TARGET)
        - name: MODEL
          value: $(params.MODEL_NAME)
        - name: ACCELERATOR
          value: $(params.ACCELERATOR)
        - name: MLFLOW_EXPERIMENT_NAME
          value: $(params.MLFLOW_EXPERIMENT_NAME)
        - name: MLFLOW_ENABLED
          value: $(params.MLFLOW_ENABLED)
        - name: MLFLOW_TAGS
          value: $(params.MLFLOW_TAGS[*])
        - name: VERSION
          value: $(params.VERSION)
        - name: TP
          value: $(params.TP)
        - name: BENCHMARK_ENV_VARS
          value: $(params.BENCHMARK_ENV_VARS[*])
        - name: MLPERF_DATASET_NAME
          value: $(params.MLPERF_DATASET_NAME)
        - name: MLPERF_SCENARIO
          value: $(params.MLPERF_SCENARIO)
        - name: MLPERF_TEST_MODE
          value: $(params.MLPERF_TEST_MODE)
        - name: MLPERF_BATCH_SIZE
          value: $(params.MLPERF_BATCH_SIZE)
        - name: MLPERF_NUM_SAMPLES
          value: $(params.MLPERF_NUM_SAMPLES)
        - name: MLPERF_OUTPUT_DIR
          value: $(params.MLPERF_OUTPUT_DIR)
        - name: MLPERF_SERVER_TARGET_QPS
          value: $(params.MLPERF_SERVER_TARGET_QPS)
      workspaces:
        - name: models-storage
          workspace: models-storage
        - name: results
          workspace: results

    # Stage 5: Cleanup Deployment
    - name: cleanup-deployment
      runAfter:
        - run-guidellm-benchmark
        - run-mlperf-benchmark
      when:
        - input: "$(params.SKIP_CLEANUP)"
          operator: in
          values: ["false"]
      taskRef:
        name: cleanup-llm-d-deployment
      params:
        - name: RELEASE_NAME
          value: $(params.RELEASE_NAME)
        - name: NAMESPACE
          value: $(params.NAMESPACE)
        - name: WAIT_FOR_DELETION
          value: "true"
        - name: SKIP_IF_NOT_EXISTS
          value: "true"
