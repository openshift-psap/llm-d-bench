apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: rhaiis-end-to-end-benchmark
  labels:
    app.kubernetes.io/version: "0.1"
  annotations:
    tekton.dev/displayName: "RHAIIS End-to-End Benchmark"
    tekton.dev/tags: benchmark, llm, lifecycle, rhaiis
spec:
  description: >-
    Complete model lifecycle pipeline: download model from HuggingFace, deploy
    as KServe InferenceService using RHAIIS vLLM image, run benchmark, and cleanup deployment.
    Each stage can be optionally skipped via parameters.

  params:
    # Profile References
    - name: VLLM_CONFIG
      description: vLLM profile ConfigMap name (e.g., vllm-default, vllm-fp8-cache)
      type: string
      default: ""

    - name: DEPLOYMENT_CONFIG
      description: Deployment profile ConfigMap name (e.g., deployment-rhaiis-vllm-pod)
      type: string
      default: ""

    - name: BENCHMARK_CONFIG
      description: Benchmark profile ConfigMap name (e.g., concurrent-1k-1k, concurrent-8k-1k)
      type: string
      default: ""

    # Model Configuration
    - name: MODEL_NAME
      description: HuggingFace model identifier (e.g., meta-llama/Llama-3.1-8B)
      type: string

    - name: MODEL_REVISION
      description: Model revision to download (git branch/tag/commit)
      type: string
      default: "main"

    # Deployment Configuration
    - name: NAMESPACE
      description: Namespace for deployment
      type: string

    - name: VLLM_ARGS
      description: Additional vLLM arguments as array
      type: array
      default: []

    - name: DEPLOYMENT_IMAGE
      description: vLLM container image (default RHAIIS, can override to vllm/vllm-openai:latest for raw vLLM)
      type: string
      default: "registry.redhat.io/rhaiis/vllm-cuda-rhel9:3.2.3"

    - name: REPLICAS
      description: Number of replicas
      type: string
      default: "1"

    - name: MODEL_PVC
      description: PVC name for model storage
      type: string
      default: "models-storage"

    - name: CACHE_DIR
      description: Base directory on PVC where models are stored
      type: string
      default: "/models"

    # Benchmark Configuration
    - name: IMAGE
      description: |
        Full URL of the GuideLLM custom image.
        The namespace portion (/llm-d-bench/) should match the namespace where the image was built.
        If building in a different namespace, override this parameter accordingly.
        Example: image-registry.openshift-image-registry.svc:5000/<your-namespace>/guidellm-custom:latest
      type: string
      default: "image-registry.openshift-image-registry.svc:5000/llm-d-bench/guidellm-custom:latest"

    - name: GUIDELLM_PROCESSOR
      description: Tokenizer/processor model name (optional)
      type: string
      default: ""

    - name: GUIDELLM_BACKEND_TYPE
      description: Backend type for the inference server (GuideLLM only)
      type: string
      default: ""

    - name: GUIDELLM_RATE_TYPE
      description: Rate strategy - concurrent or synchronous (GuideLLM only)
      type: string
      default: ""

    - name: GUIDELLM_RATE
      description: Comma-separated list of rates to test (GuideLLM only)
      type: string
      default: ""

    - name: GUIDELLM_DATA
      description: Request data profile (GuideLLM only)
      type: string
      default: ""

    - name: GUIDELLM_MAX_SECONDS
      description: Maximum duration per rate in seconds (GuideLLM only)
      type: string
      default: ""

    - name: GUIDELLM_MAX_REQUESTS
      description: Maximum number of requests per rate (GuideLLM only, optional)
      type: string
      default: ""

    - name: ACCELERATOR
      description: Accelerator type tag
      type: string
      default: ""

    - name: MLFLOW_EXPERIMENT_NAME
      description: MLflow experiment name
      type: string
      default: "guidellm-benchmarks"

    - name: MLFLOW_ENABLED
      description: Enable MLflow tracking
      type: string
      default: "false"

    - name: MLFLOW_TAGS
      description: Additional tags as array of key=value pairs (e.g., ["version=3.0", "team=ai"])
      type: array
      default: []

    - name: VERSION
      description: Version identifier for visualization reports
      type: string
      default: ""

    - name: TP
      description: Tensor parallelism size (number of GPUs for deployment and benchmark)
      type: string
      default: "1"

    - name: BENCHMARK_ENV_VARS
      description: Additional environment variables for the benchmark container as array of name=value pairs
      type: array
      default: []

    # MLPerf-specific Parameters (all optional)
    - name: MLPERF_DATASET_NAME
      description: Dataset filename (MLPerf only, e.g., "cnn_eval.json")
      type: string
      default: ""

    - name: MLPERF_SCENARIO
      description: MLPerf scenario - Offline, Server, SingleStream, MultiStream (MLPerf only)
      type: string
      default: ""

    - name: MLPERF_TEST_MODE
      description: MLPerf test mode - accuracy or performance (MLPerf only)
      type: string
      default: ""

    - name: MLPERF_BATCH_SIZE
      description: Batch size for inference (MLPerf only)
      type: string
      default: ""

    - name: MLPERF_NUM_SAMPLES
      description: Number of samples to process (MLPerf only)
      type: string
      default: ""

    - name: MLPERF_OUTPUT_DIR
      description: Output directory for results (MLPerf only)
      type: string
      default: ""

    - name: MLPERF_SERVER_TARGET_QPS
      description: Target QPS for Server scenario (MLPerf only)
      type: string
      default: ""


    # Health Check Configuration
    - name: HEALTH_CHECK_TIMEOUT
      description: Endpoint health check timeout in seconds
      type: string
      default: "3600"

    # Stage Control Parameters
    - name: SKIP_DOWNLOAD
      description: Skip model download stage
      type: string
      default: "false"

    - name: SKIP_DEPLOY
      description: Skip model deployment stage
      type: string
      default: "false"

    - name: SKIP_BENCHMARK
      description: Skip benchmark execution stage
      type: string
      default: "false"

    - name: SKIP_CLEANUP
      description: Skip deployment cleanup stage
      type: string
      default: "false"

  workspaces:
    - name: models-storage
      description: PVC for model storage (required for download and deploy stages)

    - name: results
      description: PVC for benchmark results (optional, only for non-MLflow mode)
      optional: true

  tasks:
    # Stage 0: Merge Configuration Profiles
    - name: merge-configs
      taskRef:
        name: merge-configs
      params:
        - name: VLLM_CONFIG
          value: $(params.VLLM_CONFIG)
        - name: DEPLOYMENT_CONFIG
          value: $(params.DEPLOYMENT_CONFIG)
        - name: BENCHMARK_CONFIG
          value: $(params.BENCHMARK_CONFIG)
        - name: EPP_CONFIG
          value: ""
        - name: NAMESPACE
          value: $(params.NAMESPACE)
        - name: MODEL_NAME
          value: $(params.MODEL_NAME)
        - name: MODEL_REVISION
          value: $(params.MODEL_REVISION)
        - name: TP
          value: $(params.TP)
        - name: REPLICAS
          value: $(params.REPLICAS)
        - name: ACCELERATOR
          value: $(params.ACCELERATOR)
        - name: RELEASE_NAME
          value: ""
        - name: MLFLOW_EXPERIMENT_NAME
          value: $(params.MLFLOW_EXPERIMENT_NAME)

    # Stage 1: Download Model
    - name: download-model
      runAfter:
        - merge-configs
      when:
        - input: "$(params.SKIP_DOWNLOAD)"
          operator: in
          values: ["false"]
      taskRef:
        name: download-model
      params:
        - name: MODEL_NAME
          value: $(params.MODEL_NAME)
        - name: MODEL_REVISION
          value: $(params.MODEL_REVISION)
        - name: SKIP_IF_EXISTS
          value: "true"
      workspaces:
        - name: models-storage
          workspace: models-storage

    # Stage 2: Deploy Model with KServe
    - name: deploy-rhaiis
      runAfter:
        - download-model
      when:
        - input: "$(params.SKIP_DEPLOY)"
          operator: in
          values: ["false"]
      taskRef:
        name: deploy-rhaiis
      params:
        - name: MODEL_NAME
          value: $(params.MODEL_NAME)
        - name: NAMESPACE
          value: $(params.NAMESPACE)
        - name: TP
          value: $(params.TP)
        - name: VLLM_ARGS
          value: $(params.VLLM_ARGS[*])
        - name: SKIP_IF_EXISTS
          value: "true"
        - name: IMAGE
          value: $(params.DEPLOYMENT_IMAGE)
        - name: REPLICAS
          value: $(params.REPLICAS)
        - name: MODEL_PVC
          value: $(params.MODEL_PVC)
        - name: CACHE_DIR
          value: $(params.CACHE_DIR)
      workspaces:
        - name: models-storage
          workspace: models-storage

    # Stage 3: Wait for Endpoint
    - name: wait-for-endpoint
      runAfter:
        - deploy-rhaiis
      when:
        - input: "$(params.SKIP_BENCHMARK)"
          operator: in
          values: ["false"]
      taskRef:
        name: wait-for-endpoint
      params:
        - name: TARGET_URL
          value: $(tasks.deploy-rhaiis.results.ENDPOINT_URL)
        - name: ENDPOINT_PATH
          value: "/v1/models"
        - name: TIMEOUT_SECONDS
          value: $(params.HEALTH_CHECK_TIMEOUT)
        - name: RETRY_INTERVAL
          value: "10"
        - name: VERIFY_TLS
          value: "false"

    # Stage 3b: Detect Benchmark Type
    - name: detect-benchmark-type
      runAfter:
        - wait-for-endpoint
      when:
        - input: "$(params.SKIP_BENCHMARK)"
          operator: in
          values: ["false"]
      taskRef:
        name: detect-benchmark-type
      params:
        - name: IMAGE
          value: $(params.IMAGE)

    # Stage 4a: Run GuideLLM Benchmark (if IMAGE doesn't contain "mlperf")
    - name: run-guidellm-benchmark
      runAfter:
        - detect-benchmark-type
      when:
        - input: "$(params.SKIP_BENCHMARK)"
          operator: in
          values: ["false"]
        - input: "$(tasks.detect-benchmark-type.results.BENCHMARK_TYPE)"
          operator: in
          values: ["guidellm"]
      timeout: "2h"
      taskRef:
        name: run-guidellm-benchmark
      params:
        - name: IMAGE
          value: $(params.IMAGE)
        - name: TARGET
          value: $(tasks.deploy-rhaiis.results.ENDPOINT_URL)
        - name: MODEL
          value: $(params.MODEL_NAME)
        - name: GUIDELLM_PROCESSOR
          value: $(params.GUIDELLM_PROCESSOR)
        - name: GUIDELLM_BACKEND_TYPE
          value: $(params.GUIDELLM_BACKEND_TYPE)
        - name: GUIDELLM_RATE_TYPE
          value: $(params.GUIDELLM_RATE_TYPE)
        - name: GUIDELLM_RATE
          value: $(params.GUIDELLM_RATE)
        - name: GUIDELLM_DATA
          value: $(params.GUIDELLM_DATA)
        - name: GUIDELLM_MAX_SECONDS
          value: $(params.GUIDELLM_MAX_SECONDS)
        - name: GUIDELLM_MAX_REQUESTS
          value: $(params.GUIDELLM_MAX_REQUESTS)
        - name: ACCELERATOR
          value: $(params.ACCELERATOR)
        - name: MLFLOW_EXPERIMENT_NAME
          value: $(params.MLFLOW_EXPERIMENT_NAME)
        - name: MLFLOW_ENABLED
          value: $(params.MLFLOW_ENABLED)
        - name: MLFLOW_TAGS
          value: $(params.MLFLOW_TAGS[*])
        - name: VERSION
          value: $(params.VERSION)
        - name: TP
          value: $(params.TP)
        - name: BENCHMARK_ENV_VARS
          value: $(params.BENCHMARK_ENV_VARS[*])
      workspaces:
        - name: results
          workspace: results

    # Stage 4b: Run MLPerf Benchmark (if IMAGE contains "mlperf")
    - name: run-mlperf-benchmark
      runAfter:
        - detect-benchmark-type
      when:
        - input: "$(params.SKIP_BENCHMARK)"
          operator: in
          values: ["false"]
        - input: "$(tasks.detect-benchmark-type.results.BENCHMARK_TYPE)"
          operator: in
          values: ["mlperf"]
      timeout: "2h"
      taskRef:
        name: run-mlperf-benchmark
      params:
        - name: IMAGE
          value: $(params.IMAGE)
        - name: TARGET
          value: $(tasks.deploy-rhaiis.results.ENDPOINT_URL)
        - name: MODEL
          value: $(params.MODEL_NAME)
        - name: ACCELERATOR
          value: $(params.ACCELERATOR)
        - name: MLFLOW_EXPERIMENT_NAME
          value: $(params.MLFLOW_EXPERIMENT_NAME)
        - name: MLFLOW_ENABLED
          value: $(params.MLFLOW_ENABLED)
        - name: MLFLOW_TAGS
          value: $(params.MLFLOW_TAGS[*])
        - name: VERSION
          value: $(params.VERSION)
        - name: TP
          value: $(params.TP)
        - name: BENCHMARK_ENV_VARS
          value: $(params.BENCHMARK_ENV_VARS[*])
        - name: MLPERF_DATASET_NAME
          value: $(params.MLPERF_DATASET_NAME)
        - name: MLPERF_SCENARIO
          value: $(params.MLPERF_SCENARIO)
        - name: MLPERF_TEST_MODE
          value: $(params.MLPERF_TEST_MODE)
        - name: MLPERF_BATCH_SIZE
          value: $(params.MLPERF_BATCH_SIZE)
        - name: MLPERF_NUM_SAMPLES
          value: $(params.MLPERF_NUM_SAMPLES)
        - name: MLPERF_OUTPUT_DIR
          value: $(params.MLPERF_OUTPUT_DIR)
        - name: MLPERF_SERVER_TARGET_QPS
          value: $(params.MLPERF_SERVER_TARGET_QPS)
      workspaces:
        - name: models-storage
          workspace: models-storage
        - name: results
          workspace: results

    # Stage 5: Cleanup KServe Deployment
    - name: cleanup-rhaiis
      runAfter:
        - run-guidellm-benchmark
      when:
        - input: "$(params.SKIP_CLEANUP)"
          operator: in
          values: ["false"]
      taskRef:
        name: cleanup-rhaiis
      params:
        - name: MODEL_NAME
          value: $(params.MODEL_NAME)
        - name: NAMESPACE
          value: $(params.NAMESPACE)
        - name: WAIT_FOR_DELETION
          value: "true"
        - name: SKIP_IF_NOT_EXISTS
          value: "true"
